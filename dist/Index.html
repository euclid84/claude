<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #5b6475;
    --line: #dde2ea;
    --primary: #1f6feb;
    --primary-soft: #e6efff;
    --danger: #d1242f;
    --danger-soft: #ffebe9;
    --warn: #b35900;
    --warn-soft: #fff4e5;
    --ok: #1a7f37;
    --ok-soft: #e6f6ea;
    --radius: 14px;
    --fs: 17px;
  }
  body.large { --fs: 21px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: var(--fs);
    line-height: 1.55;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }
  header.bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); padding: 14px 0 10px;
  }
  header.bar h1 { font-size: 1.2em; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h2 { font-size: 1.1em; margin: 20px 0 8px; }
  h3 { font-size: 1em; margin: 14px 0 6px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); font-size: 0.9em; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin: 12px 0;
  }
  .card.click { cursor: pointer; }
  .card.click:active { background: #f0f3f8; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  button, .btn {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 12px 16px; min-height: 48px; cursor: pointer;
  }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.block { width: 100%; }
  button.icon { min-width: 48px; padding: 8px 12px; }
  button:disabled { opacity: 0.5; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, select, textarea {
    font: inherit; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--text);
  }
  textarea { min-height: 110px; resize: vertical; }
  input[type=checkbox] { width: auto; transform: scale(1.4); margin-right: 10px; }
  .check { display: flex; align-items: center; font-weight: normal; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; }
  .chip {
    white-space: nowrap; border-radius: 999px; padding: 6px 14px; min-height: 40px;
    border: 1px solid var(--line); background: #fff; font-size: 0.9em;
  }
  .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .tag { display: inline-block; font-size: 0.78em; padding: 2px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
  .flag { font-size: 0.8em; font-weight: 700; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  .flag.정상 { background: var(--ok-soft); color: var(--ok); }
  .flag.높음, .flag.낮음, .flag.이상 { background: var(--danger-soft); color: var(--danger); }
  .flag.경계 { background: var(--warn-soft); color: var(--warn); }
  .flag.판정없음 { background: #eef0f3; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .fab {
    position: fixed; right: 20px; bottom: 24px; z-index: 6;
    border-radius: 999px; padding: 16px 22px; box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .thumbs .t { position: relative; }
  .thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .thumbs .x { position: absolute; top: -8px; right: -8px; min-height: 32px; min-width: 32px; padding: 0; border-radius: 999px; }
  .photo-full { width: 100%; border-radius: 10px; border: 1px solid var(--line); margin: 6px 0; }
  .chat { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 140px; }
  .msg { padding: 12px 14px; border-radius: 16px; max-width: 88%; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.model { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .composer .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  .composer textarea { min-height: 52px; height: 52px; }
  .notice { background: var(--warn-soft); color: #6b3a00; border-radius: 10px; padding: 10px 12px; font-size: 0.9em; }
  .error { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 1.15em; letter-spacing: 1px; background: #fff; border: 2px dashed var(--primary); padding: 14px; border-radius: 10px; text-align: center; word-break: break-all; }
  #loading {
    position: fixed; inset: 0; background: rgba(255,255,255,.75); z-index: 50;
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  #loading.on { display: flex; }
  .spinner { width: 44px; height: 44px; border: 5px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 60;
    background: #1d2433; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 0.9em;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%;
  }
  #toast.on { opacity: 1; }
  .item-edit { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; background: #fafbfc; }
  .item-edit .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .item-edit input, .item-edit select { padding: 8px; }
  hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  details summary { cursor: pointer; font-weight: 600; min-height: 40px; display: flex; align-items: center; }
</style>
</head>
<body>
  <main id="app"></main>
  <div id="loading" role="status" aria-live="polite"><div class="spinner"></div><div id="loadingMsg"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
/**
 * 브라우저 안에서만 동작하는 암호화 (Web Crypto API)
 *
 *  비밀번호 ─PBKDF2(SHA-256, 30만회)→ 512bit ─┬ 앞 256bit: KEK (데이터키를 감싸는 키, 서버로 안 감)
 *                                              └ 뒤 256bit: authKey (로그인 확인용, 서버로 전송)
 *  데이터키(DEK, 랜덤 256bit) ─AES-GCM→ 모든 기록/사진/대화 암호화
 *  DEK는 KEK로 감싼 형태(wrappedDek)로만 서버에 저장된다. 복구코드로 감싼 사본도 하나 더 저장한다.
 */
const Crypt = (function () {
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const subtle = window.crypto && window.crypto.subtle;

  function assertSupported() {
    if (!subtle) throw new Error('이 브라우저는 암호화 기능을 지원하지 않습니다. 최신 크롬/사파리를 사용해 주세요.');
  }

  function randBytes(n) { const b = new Uint8Array(n); crypto.getRandomValues(b); return b; }

  function b64(bytes) {
    bytes = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  function unb64(str) {
    const s = atob(str);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  function concat(a, b) {
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0); out.set(b, a.length);
    return out;
  }

  /** 비밀번호(또는 복구코드) → { kek, authKey } */
  async function derive(secret, saltB64, iter) {
    assertSupported();
    const base = await subtle.importKey('raw', enc.encode(String(secret).normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await subtle.deriveBits(
      { name: 'PBKDF2', salt: unb64(saltB64), iterations: iter, hash: 'SHA-256' }, base, 512));
    const kek = await subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { kek: kek, authKey: b64(bits.slice(32)) };
  }

  async function encryptBytes(key, bytes) {
    const iv = randBytes(12);
    const ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, bytes));
    return concat(iv, ct);
  }

  async function decryptBytes(key, data) {
    const pt = await subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    return new Uint8Array(pt);
  }

  async function importDek(raw) {
    return subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  }

  return {
    randBytes: randBytes,
    b64: b64,
    unb64: unb64,
    derive: derive,
    newSalt: function () { return b64(randBytes(16)); },
    newDekRaw: function () { return randBytes(32); },
    importDek: importDek,

    async wrapDek(kek, dekRaw) { return b64(await encryptBytes(kek, dekRaw)); },
    async unwrapDek(kek, wrappedB64) {
      try { return await decryptBytes(kek, unb64(wrappedB64)); }
      catch (e) { throw new Error('비밀번호(또는 복구코드)가 올바르지 않습니다.'); }
    },

    async encryptJson(dek, obj) { return 'v1:' + b64(await encryptBytes(dek, enc.encode(JSON.stringify(obj)))); },
    async decryptJson(dek, s) {
      if (!s || s.indexOf('v1:') !== 0) return null;
      return JSON.parse(dec.decode(await decryptBytes(dek, unb64(s.slice(3)))));
    },

    async encryptBlobB64(dek, bytes) { return b64(await encryptBytes(dek, bytes)); },
    async decryptBlobB64(dek, b64str) { return decryptBytes(dek, unb64(b64str)); },

    /** 사람이 받아 적기 쉬운 복구코드 (혼동되는 0/O/1/I 제외, 약 100bit) */
    newRecoveryCode() {
      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const bytes = randBytes(20);
      let code = '';
      for (let i = 0; i < 20; i++) {
        code += alphabet[bytes[i] % 32];
        if (i % 4 === 3 && i < 19) code += '-';
      }
      return code;
    },
    normalizeRecoveryCode(code) { return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  };
})();
</script>
  <script>
/* =========================================================================
 *  우리가족 진료기록 — 화면/동작
 *  - 복호화된 데이터와 데이터키(DEK)는 이 페이지의 메모리에만 존재한다.
 *  - 새로고침하거나 창을 닫으면 다시 로그인해야 한다.
 * ========================================================================= */

const RECORD_TYPES = ['정기건강검진', '외래진료', '입원·수술', '검사결과', '처방·약', '문자·알림', '기타'];
const TEST_FLAGS = ['정상', '높음', '낮음', '경계', '이상', '판정없음'];
const MIN_PW = 8;

const DEFAULT_DOCTOR = {
  presetId: '', doctorName: '', specialty: '가정의학과',
  tone: 'friendly', level: 'easy', length: 'medium', lifestyleTips: true,
  patientCall: '', ageGroup: '', sex: '', conditions: '', medications: '', allergies: '', concerns: '',
  customPrompt: ''
};

const S = {
  token: null, username: null, dek: null,
  records: [], filter: '전체', search: '',
  doctor: null, presets: [],
  draft: null, pendingImages: [], keptImageIds: [], review: null
};

const $app = document.getElementById('app');

/* ---------------- 공통 도우미 ---------------- */

function esc(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function $(sel) { return $app.querySelector(sel); }
function $all(sel) { return Array.prototype.slice.call($app.querySelectorAll(sel)); }
function on(sel, evt, fn) { $all(sel).forEach(function (el) { el.addEventListener(evt, fn); }); }
function val(sel) { const el = $(sel); return el ? el.value.trim() : ''; }

function loading(msg) {
  document.getElementById('loadingMsg').textContent = msg || '잠시만 기다려 주세요…';
  document.getElementById('loading').classList.add('on');
}
function done() { document.getElementById('loading').classList.remove('on'); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2500);
}

function showError(err) {
  done();
  const msg = (err && err.message) || String(err);
  const box = $('#err');
  if (box) { box.textContent = msg; box.style.display = 'block'; box.scrollIntoView({ block: 'center' }); }
  else toast(msg);
}

/** 브라우저 기본 confirm 대신 쓰는 확인창 (iframe 안에서도 안전) */
function confirmBox(message, okLabel) {
  return new Promise(function (resolve) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px';
    wrap.innerHTML = '<div class="card" style="max-width:420px;width:100%"><p>' + esc(message) + '</p>' +
      '<div class="row" style="margin-top:14px"><button class="grow" data-a="no">취소</button>' +
      '<button class="grow primary" data-a="yes">' + esc(okLabel || '확인') + '</button></div></div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (e) {
      const a = e.target.getAttribute('data-a');
      if (!a) return;
      document.body.removeChild(wrap);
      resolve(a === 'yes');
    });
  });
}

/** 서버 함수 호출 (Promise) */
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(e); });
    runner[fn].apply(runner, args);
  }).catch(function (e) {
    const msg = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
    if (msg.indexOf('SESSION_EXPIRED') >= 0) {
      logoutLocal('로그인 시간이 지났습니다. 다시 로그인해 주세요.');
      throw new Error('다시 로그인해 주세요.');
    }
    throw new Error(msg);
  });
}

function storageGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function storageSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 무시 */ } }

function applyFontSize() {
  document.body.classList.toggle('large', storageGet('fontLarge') === '1');
}

function fmtDate(d) {
  if (!d) return '날짜 모름';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  return m ? m[1] + '.' + m[2] + '.' + m[3] : d;
}

function sortKey(r) { return (r.data.date || r.createdAt.slice(0, 10)) + r.createdAt; }

function header(title, backFn, rightHtml) {
  return '<header class="bar">' +
    (backFn ? '<button class="icon" id="back" aria-label="뒤로">←</button>' : '') +
    '<h1>' + esc(title) + '</h1>' + (rightHtml || '') + '</header>' +
    '<div id="err" class="error" style="display:none"></div>';
}

function bindBack(fn) { on('#back', 'click', fn); }

function render(html) { $app.innerHTML = html; window.scrollTo(0, 0); }

/* ---------------- 로그인 / 가입 / 복구 ---------------- */

function viewLogin(message) {
  render(
    '<header class="bar"><h1>🩺 우리가족 진료기록</h1></header>' +
    (message ? '<div class="notice">' + esc(message) + '</div>' : '') +
    '<div id="err" class="error" style="display:none"></div>' +
    '<div class="card">' +
    '<label for="u">아이디</label><input id="u" autocomplete="username" autocapitalize="none">' +
    '<label for="p">비밀번호</label><input id="p" type="password" autocomplete="current-password">' +
    '<p style="margin-top:16px"><button class="primary block" id="login">로그인</button></p>' +
    '</div>' +
    '<div class="row"><button class="grow" id="toSignup">처음이에요 (계정 만들기)</button>' +
    '<button class="grow" id="toRecover">비밀번호를 잊었어요</button></div>' +
    '<p class="muted" style="margin-top:16px">내 기록은 내 비밀번호로만 열 수 있게 암호화되어 저장됩니다. 가족이나 관리자도 내용을 볼 수 없습니다.</p>'
  );
  on('#login', 'click', doLogin);
  on('#p', 'keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  on('#toSignup', 'click', viewSignup);
  on('#toRecover', 'click', viewRecover);
}

async function doLogin() {
  const username = val('#u'), password = $('#p').value;
  if (!username || !password) return showError(new Error('아이디와 비밀번호를 입력해 주세요.'));
  try {
    loading('로그인 중… (암호 키를 만드는 데 몇 초 걸릴 수 있어요)');
    const pre = await call('api_prelogin', username);
    const d = await Crypt.derive(password, pre.kdfSalt, pre.kdfIter);
    const res = await call('api_login', username, d.authKey);
    const dekRaw = await Crypt.unwrapDek(d.kek, res.wrappedDek);
    S.dek = await Crypt.importDek(dekRaw);
    S.token = res.token;
    S.username = res.username;
    await loadAll();
    done();
    if (!S.doctor._saved) viewDoctor(true); else viewHome();
  } catch (e) { showError(e); }
}

async function viewSignup() {
  let info = { allowSignup: true, kdfIter: 300000 };
  try { loading(); info = await call('api_signupInfo'); done(); } catch (e) { done(); }
  render(
    header('계정 만들기', true) +
    (info.allowSignup ? '' : '<div class="error" style="display:block">지금은 새 계정을 만들 수 없습니다. 관리자에게 문의하세요.</div>') +
    '<div class="card">' +
    '<label for="inv">초대코드</label><input id="inv" autocapitalize="characters" placeholder="관리자에게 받은 코드">' +
    '<label for="u">아이디 (2~20자)</label><input id="u" autocapitalize="none" autocomplete="username">' +
    '<label for="p">비밀번호 (' + MIN_PW + '자 이상)</label><input id="p" type="password" autocomplete="new-password">' +
    '<label for="p2">비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +
    '<p class="notice" style="margin-top:14px">⚠️ 비밀번호는 관리자도 알 수 없고 찾아드릴 수도 없습니다. 가입 후 나오는 <b>복구코드</b>를 꼭 적어두세요.</p>' +
    '<p style="margin-top:16px"><button class="primary block" id="go"' + (info.allowSignup ? '' : ' disabled') + '>가입하기</button></p>' +
    '</div>'
  );
  bindBack(function () { viewLogin(); });
  on('#go', 'click', async function () {
    const username = val('#u'), pw = $('#p').value, pw2 = $('#p2').value, inviteCode = val('#inv');
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요.'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('계정을 만드는 중…');
      const iter = info.kdfIter;
      const kdfSalt = Crypt.newSalt(), rcKdfSalt = Crypt.newSalt();
      const recoveryCode = Crypt.newRecoveryCode();
      const pwd = await Crypt.derive(pw, kdfSalt, iter);
      const rcd = await Crypt.derive(Crypt.normalizeRecoveryCode(recoveryCode), rcKdfSalt, iter);
      const dekRaw = Crypt.newDekRaw();
      await call('api_signup', {
        username: username, inviteCode: inviteCode, kdfSalt: kdfSalt, kdfIter: iter,
        authKey: pwd.authKey, wrappedDek: await Crypt.wrapDek(pwd.kek, dekRaw),
        rcKdfSalt: rcKdfSalt, rcAuthKey: rcd.authKey, wrappedDekRc: await Crypt.wrapDek(rcd.kek, dekRaw)
      });
      done();
      viewRecoveryCode(username, recoveryCode);
    } catch (e) { showError(e); }
  });
}

async function addFiles() {

    }

}

const MAX_FILES = 10;
const MAX_RAW_BYTES = 10 * 1024 * 1024;   // PDF 등 원본 그대로 올리는 파일 1개 최대 10MB
const MAX_ANALYZE_BYTES = 18 * 1024 * 1024; // AI 분석 1번에 보낼 수 있는 총량

function isPdf(file) { return file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''); }

/**
 * 올릴 파일 준비
 *  - 사진: 1600px JPEG로 줄임
 *  - PDF: 원본 그대로 (AI가 PDF를 직접 읽음)
 *  - 브라우저가 못 여는 HEIC 사진: 원본 그대로
 */
async function prepareFile(file) {
  const takenAt = file.lastModified || Date.now();
  const raw = async function (mimeType) {
    if (file.size > MAX_RAW_BYTES) throw new Error('"' + file.name + '" 파일이 너무 큽니다 (최대 10MB).');
    return { mimeType: mimeType, bytes: new Uint8Array(await file.arrayBuffer()), url: null, name: file.name, takenAt: takenAt };
  };
  if (isPdf(file)) return raw('application/pdf');
  try {
    const img = await resizeImage(file);
    img.takenAt = takenAt;
    return img;
  } catch (e) {
    if (/heic|heif/i.test(file.type + file.name)) return raw(/heif/i.test(file.type + file.name) ? 'image/heif' : 'image/heic');
    throw e;
  }
}

function thumbHtml(item) {
  if (item.url) return '<img src="' + item.url + '" alt="">';
  const label = item.mimeType === 'application/pdf' ? '📄 PDF' : '🖼 사진';
  return '<div class="btn" style="width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75em;overflow:hidden;padding:4px">' +
    '<b>' + label + '</b><span style="word-break:break-all">' + esc(String(item.name || '').slice(0, 24)) + '</span></div>';
}

/** 복호화한 파일의 앞부분으로 종류를 알아낸다 (저장할 때 종류를 따로 적지 않으므로) */
function sniffType(b) {
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'application/pdf';
  if (b[0] === 0x89 && b[1] === 0x50) return 'image/png';
  if (b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70) return 'image/heic';
  return 'image/jpeg';
}

/** 사진을 긴 변 1600px JPEG로 줄인다 (업로드/AI 분석 속도와 용량을 위해) */
function resizeImage(file) {
  const MAX = 1600;
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) {
        if (!blob) return reject(new Error('사진을 처리하지 못했습니다.'));
        blob.arrayBuffer().then(function (buf) {
          resolve({ mimeType: 'image/jpeg', bytes: new Uint8Array(buf), url: URL.createObjectURL(blob) });
        });
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('"' + file.name + '" 파일은 열 수 없습니다. 사진 또는 PDF만 올릴 수 있어요.')); };
    img.src = url;
  });
}

async function analyze() {
  const text = S.addText || '';
  if (!S.pendingImages.length && !text.trim()) return showError(new Error('사진·PDF를 추가하거나 문자 내용을 붙여넣어 주세요.'));
  const total = S.pendingImages.reduce(function (n, i) { return n + i.bytes.length; }, 0);
  if (total > MAX_ANALYZE_BYTES) return showError(new Error('한 번에 분석하기엔 파일이 너무 큽니다. 파일 수를 줄여서 나눠 올려주세요.'));
  try {
    loading('AI가 결과를 읽고 있어요… (사진이 많으면 1분 정도 걸려요)');
    const taken = S.pendingImages.map(function (i) { return i.takenAt || Date.now(); });
    const result = await call('api_extract', S.token, {
      images: S.pendingImages.map(function (i) { return { mimeType: i.mimeType, data: Crypt.b64(i.bytes) }; }),
      text: text,
      hint: S.addHint || '',
      referenceDate: ymd(new Date(taken.length ? Math.max.apply(null, taken) : Date.now()))
    });
    done();
    const records = (result.records || []).map(function (r) {
      r.memo = S.addHint || '';
      r.source = S.pendingImages.length ? 'photo' : 'text';
      if (text && !r.raw_text && result.records.length === 1) r.raw_text = text;
      return r;
    });
    if (!records.length) return showError(new Error('결과를 찾지 못했습니다. 사진을 더 선명하게 찍어주세요.'));
    if (records.length === 1 && !findDuplicate(records[0])) return viewEdit(null, records[0]);
    viewReview(records);
  } catch (e) { showError(e); }
}

function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ---------------- 여러 건 검토 (문자 캡처 등) ---------------- */

/** 날짜 + 검사값이 같은 기록이 이미 있으면 중복으로 본다 */
function recordFingerprint(d) {
  const tests = (d.tests || []).map(function (t) { return normName(t.name) + '=' + String(t.value).replace(/\s/g, ''); }).sort().join('|');
  const body = tests || String(d.next_visit || d.summary || '').replace(/\s/g, '').slice(0, 60);
  return (d.date || '') + '#' + (d.record_type || '') + '#' + body;
}

function findDuplicate(d) {
  const fp = recordFingerprint(d);
  return S.records.find(function (r) { return recordFingerprint(r.data) === fp; }) || null;
}

function viewReview(records) {
  const seen = {};
  S.review = {
    items: records.map(function (d) {
      const fp = recordFingerprint(d);
      const dup = !!findDuplicate(d) || !!seen[fp];
      seen[fp] = true;
      // 이미 있는 기록과 예약·알림 문자는 기본으로 체크 해제
      return { data: d, dup: dup, checked: !dup && d.record_type !== '문자·알림' };
    })
  };
  renderReview();
}

function renderReview() {
  const items = S.review.items;

    '<div class="row"><button class="grow" id="all">모두 선택</button><button class="grow" id="results">결과만 선택</button></div>' +
    items.map(function (it, i) {
      const d = it.data;
      const tests = (d.tests || []).map(function (t) {
        return '<span class="flag ' + esc(t.flag || '판정없음') + '" style="display:inline-block;margin:2px">' + esc(shortName(t.name)) + ' ' + esc(t.value) + '</span>';
      }).join('');
      return '<div class="card" style="' + (it.checked ? '' : 'opacity:.6') + '">' +
        '<div class="row"><input type="checkbox" data-chk="' + i + '"' + (it.checked ? ' checked' : '') + '>' +
        '<span class="tag">' + esc(d.record_type || '기타') + '</span>' +
        '<span class="muted grow">' + esc(fmtDate(d.date)) + (d.date_confidence === '추정' ? ' (추정)' : '') + '</span>' +
        (it.dup ? '<span class="flag 판정없음">이미 있음</span>' : '') + '</div>' +
        '<div data-open="' + i + '" style="cursor:pointer">' +
        '<h3>' + esc(d.title || '(제목 없음)') + '</h3>' +
        (tests ? '<div>' + tests + '</div>' : '') +
        (d.doctor_opinion || d.summary || d.next_visit ? '<p class="muted">' + esc(d.doctor_opinion || d.next_visit || d.summary) + '</p>' : '') +
        '</div></div>';
    }).join('') +

    '<button class="primary fab" id="saveAll"' + (count ? '' : ' disabled') + '>선택한 ' + count + '건 저장</button>'
  );
  bindBack(function () {
    confirmBox('저장하지 않고 나갈까요?', '나가기').then(function (ok) { if (ok) { S.review = null; renderAdd(); } });
  });
  on('[data-chk]', 'change', function () { items[Number(this.getAttribute('data-chk'))].checked = this.checked; renderReview(); });
  on('[data-open]', 'click', function () {
    const i = Number(this.getAttribute('data-open'));
    viewEdit(null, items[i].data, i);
  });
  on('#all', 'click', function () { items.forEach(function (i) { i.checked = !i.dup; }); renderReview(); });
  on('#results', 'click', function () { items.forEach(function (i) { i.checked = !i.dup && i.data.record_type !== '문자·알림'; }); renderReview(); });
  on('#saveAll', 'click', saveReviewed);
}

function shortName(name) { return String(name || '').replace(/\(.*?\)/g, '').trim(); }

async function saveReviewed() {
  const chosen = S.review.items.filter(function (i) { return i.checked; }).map(function (i) { return cleanRecord(i.data); });
  if (!chosen.length) return;
  const uploaded = [];
  try {
    loading('사진을 암호화해서 올리는 중…');
    for (const img of S.pendingImages) {
      const res = await call('api_uploadImage', S.token, await Crypt.encryptBlobB64(S.dek, img.bytes));
      uploaded.push(res.imageId);
    }
    loading(chosen.length + '건을 암호화해서 저장하는 중…');
    const items = [];
    for (const d of chosen) items.push({ encData: await Crypt.encryptJson(S.dek, d), imageIds: uploaded });
    const res = await call('api_saveRecords', S.token, items);
    const now = new Date().toISOString();
    res.recordIds.forEach(function (id, i) {
      S.records.push({ recordId: id, createdAt: now, updatedAt: now, imageIds: uploaded.slice(), data: chosen[i] });
    });
    S.records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });
    S.review = null; S.pendingImages = []; S.addText = ''; S.addHint = '';
    done();
    toast(chosen.length + '건을 저장했습니다.');
    viewHome();
  } catch (e) {
    if (uploaded.length) call('api_discardImages', S.token, uploaded).catch(function () {});
    showError(e);
  }
}

function cleanRecord(d) {
  d.tests = (d.tests || []).filter(function (t) { return t.name || t.value; });
  d.medications = (d.medications || []).filter(function (m) { return m.name; });
  if (!d.title) d.title = (d.record_type || '기록') + ' ' + (d.date || '');
  return d;
}

function viewEdit(recordId, data, reviewIndex) {
  const d = JSON.parse(JSON.stringify(data || {}));
  d.tests = d.tests || []; d.medications = d.medications || [];
  d.diagnoses = d.diagnoses || []; d.follow_up = d.follow_up || [];
  S.draft = { recordId: recordId, data: d, reviewIndex: reviewIndex === undefined ? null : reviewIndex };

    const rec = S.records.find(function (r) { return r.recordId === recordId; });

    S.pendingImages = [];

}

/** data-bind 입력칸 → S.draft.data 자동 반영 */
$app.addEventListener('input', function (e) {
  const path = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (!path || !S.draft) return;
  const keys = path.split('.');
  let obj = S.draft.data;
  for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
  obj[keys[keys.length - 1]] = e.target.getAttribute('data-lines')
    ? e.target.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
    : e.target.value;
});

async function saveDraft() {
  const d = cleanRecord(S.draft.data);
  if (S.draft.reviewIndex !== null) {
    const item = S.review.items[S.draft.reviewIndex];
    item.data = d; item.checked = true; S.draft = null;
    return renderReview();
  }
  const uploaded = [];
  try {
    loading('암호화해서 저장하는 중…');
    for (const img of S.pendingImages) {
      const res = await call('api_uploadImage', S.token, await Crypt.encryptBlobB64(S.dek, img.bytes));
      uploaded.push(res.imageId);
    }
    const imageIds = S.keptImageIds.concat(uploaded);
    const res = await call('api_saveRecord', S.token, {
      recordId: S.draft.recordId || null,
      encData: await Crypt.encryptJson(S.dek, d),
      imageIds: imageIds
    });
    const now = new Date().toISOString();
    const existing = S.records.find(function (r) { return r.recordId === res.recordId; });
    if (existing) { existing.data = d; existing.imageIds = imageIds; existing.updatedAt = now; }
    else S.records.push({ recordId: res.recordId, createdAt: now, updatedAt: now, imageIds: imageIds, data: d });
    S.records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });
    S.pendingImages = []; S.keptImageIds = []; S.draft = null; S.addText = ''; S.addHint = '';
    done();
    toast('저장했습니다.');
    viewDetail(res.recordId);
  } catch (e) {
    if (uploaded.length) call('api_discardImages', S.token, uploaded).catch(function () {});
    showError(e);
  }
}

/* ---------------- 검사 항목 추이 ---------------- */

function normName(s) { return String(s || '').replace(/\s|\(.*?\)/g, '').toLowerCase(); }

function viewTrend(testName, fromRecordId) {
  const key = normName(testName);
  const points = [];
  S.records.forEach(function (r) {
    (r.data.tests || []).forEach(function (t) {
      if (normName(t.name) === key) points.push({ date: r.data.date || r.createdAt.slice(0, 10), t: t, recordId: r.recordId });
    });
  });
  points.sort(function (a, b) { return a.date.localeCompare(b.date); });
  const nums = points.map(function (p) { const v = String(p.t.value).replace(/,/g, '').trim(); return /^-?\d+(\.\d+)?$/.test(v) ? parseFloat(v) : NaN; });
  const numeric = points.length >= 2 && nums.every(function (n) { return !isNaN(n); });

  render(
    header(testName + ' 변화', true) +
    (numeric ? '<div class="card">' + sparkline(points, nums) + '</div>' : '') +
    '<div class="card"><table><tr><th>날짜</th><th>결과</th><th>참고치</th><th></th></tr>' +
    points.slice().reverse().map(function (p) {
      return '<tr><td>' + esc(fmtDate(p.date)) + '</td><td><b>' + esc(p.t.value) + '</b> ' + esc(p.t.unit) + '</td><td class="muted">' + esc(p.t.reference_range) + '</td>' +
        '<td><span class="flag ' + esc(p.t.flag || '판정없음') + '">' + esc(p.t.flag || '-') + '</span></td></tr>';
    }).join('') + '</table>' +
    (points.length < 2 ? '<p class="muted">같은 항목의 기록이 더 쌓이면 변화를 비교할 수 있어요.</p>' : '') + '</div>'
  );
  bindBack(function () { viewDetail(fromRecordId); });
}

function sparkline(points, nums) {
  const W = 320, H = 140, P = 28;
  const min = Math.min.apply(null, nums), max = Math.max.apply(null, nums);
  const span = max - min || 1;
  const xy = nums.map(function (n, i) {
    return [P + (W - 2 * P) * (points.length === 1 ? 0.5 : i / (points.length - 1)), H - P - (H - 2 * P) * ((n - min) / span)];
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="수치 변화 그래프">' +
    '<polyline fill="none" stroke="#1f6feb" stroke-width="3" points="' + xy.map(function (p) { return p.join(','); }).join(' ') + '"/>' +
    xy.map(function (p, i) {
      const bad = isAbnormal(points[i].t);
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="5" fill="' + (bad ? '#d1242f' : '#1f6feb') + '"/>' +
        '<text x="' + p[0] + '" y="' + (p[1] - 10) + '" font-size="12" text-anchor="middle" fill="#1d2433">' + esc(points[i].t.value) + '</text>' +
        '<text x="' + p[0] + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="#5b6475">' + esc(points[i].date.slice(2, 7)) + '</text>';
    }).join('') + '</svg>';
}

  try {
    loading('대화를 불러오는 중…');
    const rows = await call('api_listChats', S.token, recordId);
    rows.sort(function (a, b) { return a.createdAt.localeCompare(b.createdAt); });
    for (const row of rows) { try { messages.push(await Crypt.decryptJson(S.dek, row.encData)); } catch (e) { /* 건너뜀 */ } }
    done();
  } catch (e) { showError(e); return; }

  const doctorLabel = (S.doctor.doctorName || '의사') + ' 선생님';
  function draw() {
    render(
      header(isAll ? '전체 기록 상담' : (rec.data.title || '상담'), true, messages.length ? '<button class="icon" id="clear">🗑</button>' : '') +
      '<p class="notice">AI 설명은 참고용입니다. 진단·처방은 반드시 담당 의사와 상의하세요. 응급 상황은 119.</p>' +
      '<div class="chat">' +
      (messages.length ? '' : '<div class="msg model">안녕하세요, ' + esc(doctorLabel) + '입니다. ' +
        (isAll ? '등록하신 기록 전체를 보고 답해 드릴게요.' : '이 결과에 대해 궁금한 점을 물어보세요.') + '</div>' +
        '<div class="chips" style="flex-wrap:wrap">' + (isAll ? SUGGEST_ALL : SUGGEST_ONE).map(function (q) {
          return '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>';
        }).join('') + '</div>') +
      messages.map(function (m) { return '<div class="msg ' + (m.role === 'user' ? 'user' : 'model') + '">' + esc(m.text) + '</div>'; }).join('') +
      '</div>' +
      '<div class="composer"><div class="inner"><textarea id="q" placeholder="궁금한 점을 적어주세요"></textarea>' +
      '<button class="primary" id="send">보내기</button></div></div>'
    );
    bindBack(function () { if (isAll) viewHome(); else viewDetail(recordId); });
    on('#send', 'click', function () { send(val('#q')); });
    on('.chip[data-q]', 'click', function () { send(this.getAttribute('data-q')); });
    on('#clear', 'click', async function () {
      if (!(await confirmBox('이 상담 내역을 모두 지울까요?', '지우기'))) return;
      try { loading(); await call('api_clearChats', S.token, recordId); messages.length = 0; done(); draw(); } catch (e) { showError(e); }
    });
    window.scrollTo(0, document.body.scrollHeight);
  }

  async function send(question) {
    if (!question) return;
    const records = isAll
      ? S.records.map(function (r) { const c = Object.assign({}, r.data); delete c.raw_text; return c; })
      : [rec.data];
    try {
      loading(doctorLabel + '이 답변을 준비하고 있어요…');
      const res = await call('api_ask', S.token, {
        question: question,
        history: messages.slice(-12),
        records: records,
        doctor: stripDoctor(S.doctor)
      });
      const userMsg = { role: 'user', text: question };
      const modelMsg = { role: 'model', text: res.answer };
      await call('api_saveChat', S.token, recordId, await Crypt.encryptJson(S.dek, userMsg));
      await call('api_saveChat', S.token, recordId, await Crypt.encryptJson(S.dek, modelMsg));
      messages.push(userMsg, modelMsg);
      done();
      draw();
    } catch (e) { showError(e); }
  }

  draw();
}

function stripDoctor(d) { const c = Object.assign({}, d); delete c._saved; return c; }

/* ---------------- 설정: 의사 선생님 / 계정 ---------------- */

function viewSettings() {
  render(
    header('설정', true) +
    '<div class="card click" id="doc"><h3>👩‍⚕️ 의사 선생님 설정</h3><p class="muted">말투, 설명 수준, 내 건강 정보, 추가 지시사항</p></div>' +
    '<div class="card"><label class="check"><input type="checkbox" id="big"' + (storageGet('fontLarge') === '1' ? ' checked' : '') + '>글씨 크게 보기</label></div>' +
    '<div class="card click" id="pw"><h3>🔑 비밀번호 변경</h3></div>' +
    '<button class="block" id="logout">로그아웃</button>' +
    '<p class="muted" style="margin-top:16px">내 기록 ' + S.records.length + '건 · 모든 기록은 내 비밀번호로 암호화되어 저장됩니다.</p>'
  );
  bindBack(viewHome);
  on('#doc', 'click', function () { viewDoctor(false); });
  on('#pw', 'click', viewChangePassword);
  on('#logout', 'click', doLogout);
  on('#big', 'change', function () { storageSet('fontLarge', this.checked ? '1' : '0'); applyFontSize(); });
}

function radioGroup(name, value, options) {
  return options.map(function (o) {
    return '<label class="check" style="font-weight:normal;margin:8px 0"><input type="radio" name="' + name + '" value="' + o[0] + '"' +
      (value === o[0] ? ' checked' : '') + '>' + esc(o[1]) + '</label>';
  }).join('');
}

function viewDoctor(firstTime) {
  const d = S.doctor;
  render(
    header(firstTime ? '의사 선생님 설정 (처음 1회)' : '의사 선생님 설정', !firstTime) +
    (firstTime ? '<p class="notice">질문에 답하면 AI 의사 선생님이 그에 맞게 설명해 드려요. 나중에 설정에서 언제든 바꿀 수 있어요.</p>' : '') +
    '<div class="card"><h3>1. 어떤 선생님이면 좋을까요?</h3>' +
    (S.presets.length ? '<label>선생님 유형 (관리자가 준비한 프리셋)</label><select id="presetId"><option value="">선택 안 함</option>' +
      S.presets.map(function (p) { return '<option value="' + esc(p.id) + '"' + (d.presetId === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
      '</select>' : '') +
    '<label>선생님 이름 (선택)</label><input id="doctorName" value="' + esc(d.doctorName) + '" placeholder="예) 김주치">' +
    '<label>전문 분야</label><input id="specialty" value="' + esc(d.specialty) + '" placeholder="예) 가정의학과, 내과, 정형외과">' +
    '<label>말투</label>' + radioGroup('tone', d.tone, [['friendly', '다정하고 친근하게'], ['polite', '정중하고 차분하게'], ['concise', '간결하게 핵심만']]) +
    '<label>설명 수준</label>' + radioGroup('level', d.level, [['easy', '아주 쉽게 (전문용어 없이)'], ['normal', '보통 (용어는 괄호로)'], ['expert', '자세하고 전문적으로']]) +
    '<label>답변 길이</label>' + radioGroup('length', d.length, [['short', '짧게'], ['medium', '적당히'], ['long', '자세히']]) +
    '<label class="check"><input type="checkbox" id="lifestyleTips"' + (d.lifestyleTips ? ' checked' : '') + '>식습관·운동 등 생활습관 조언도 해주세요</label>' +
    '</div>' +

    '<div class="card"><h3>2. 내 건강 정보 (선택)</h3><p class="muted">적어두면 답변이 더 정확해져요. 이 정보도 암호화되어 저장됩니다.</p>' +
    '<label>저를 이렇게 불러주세요</label><input id="patientCall" value="' + esc(d.patientCall) + '" placeholder="예) 어머님, 김OO님">' +
    '<div class="row"><div class="grow"><label>나이대</label><input id="ageGroup" value="' + esc(d.ageGroup) + '" placeholder="예) 60대"></div>' +
    '<div class="grow"><label>성별</label><select id="sex">' + ['', '여성', '남성'].map(function (s) { return '<option' + (d.sex === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div></div>' +
    '<label>앓고 있는 질환 / 병력</label><input id="conditions" value="' + esc(d.conditions) + '" placeholder="예) 고혈압, 당뇨 전단계">' +
    '<label>복용 중인 약</label><input id="medications" value="' + esc(d.medications) + '" placeholder="예) 혈압약 아침 1알">' +
    '<label>알레르기</label><input id="allergies" value="' + esc(d.allergies) + '">' +
    '<label>특히 걱정되는 점</label><input id="concerns" value="' + esc(d.concerns) + '" placeholder="예) 콜레스테롤, 무릎 관절">' +
    '</div>' +

    '<div class="card"><h3>3. 추가 지시사항 (직접 작성)</h3>' +
    '<p class="muted">선생님께 바라는 점을 자유롭게 적어주세요. 이 내용이 AI 프롬프트에 그대로 들어갑니다.</p>' +
    '<textarea id="customPrompt" style="min-height:160px" placeholder="예) 설명 끝에 항상 한 줄로 요약해 주세요. 수치가 나쁘면 겁주지 말고 차분하게 알려주세요.">' + esc(d.customPrompt) + '</textarea>' +
    '<button class="block" id="preview" style="margin-top:10px">👀 최종 프롬프트 미리보기</button>' +
    '<pre id="pv" style="display:none;white-space:pre-wrap;font-size:.8em;background:#f0f3f8;padding:10px;border-radius:10px"></pre>' +
    '</div>' +
    '<button class="primary block" id="save">저장</button>' +
    (firstTime ? '<p style="margin-top:10px"><button class="block" id="skip">나중에 할게요</button></p>' : '')
  );

  function collect() {
    const pick = function (name) { const el = $('input[name="' + name + '"]:checked'); return el ? el.value : ''; };
    return {
      presetId: $('#presetId') ? $('#presetId').value : '',
      doctorName: val('#doctorName'), specialty: val('#specialty'),
      tone: pick('tone') || 'friendly', level: pick('level') || 'easy', length: pick('length') || 'medium',
      lifestyleTips: $('#lifestyleTips').checked,
      patientCall: val('#patientCall'), ageGroup: val('#ageGroup'), sex: $('#sex').value,
      conditions: val('#conditions'), medications: val('#medications'), allergies: val('#allergies'), concerns: val('#concerns'),
      customPrompt: $('#customPrompt').value.trim()
    };
  }

  bindBack(viewSettings);
  on('#skip', 'click', viewHome);
  on('#preview', 'click', async function () {
    try {
      loading();
      const res = await call('api_previewDoctorPrompt', S.token, collect());
      done();
      const pv = $('#pv'); pv.textContent = res.prompt; pv.style.display = 'block';
    } catch (e) { showError(e); }
  });
  on('#save', 'click', async function () {
    const doctor = collect();
    try {
      loading('저장하는 중…');
      await call('api_saveDoctorProfile', S.token, await Crypt.encryptJson(S.dek, doctor));
      S.doctor = Object.assign({}, doctor, { _saved: true });
      done(); toast('의사 선생님 설정을 저장했습니다.');
      if (firstTime) viewHome(); else viewSettings();
    } catch (e) { showError(e); }
  });
}

function viewChangePassword() {
  render(
    header('비밀번호 변경', true) +
    '<div class="card">' +
    '<label for="old">현재 비밀번호</label><input id="old" type="password" autocomplete="current-password">' +
    '<label for="p">새 비밀번호 (' + MIN_PW + '자 이상)</label><input id="p" type="password" autocomplete="new-password">' +
    '<label for="p2">새 비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +
    '<p style="margin-top:16px"><button class="primary block" id="go">변경</button></p>' +
    '<p class="muted">복구코드는 그대로 유지됩니다.</p></div>'
  );
  bindBack(viewSettings);
  on('#go', 'click', async function () {
    const old = $('#old').value, pw = $('#p').value, pw2 = $('#p2').value;
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요.'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('변경하는 중…');
      const pre = await call('api_prelogin', S.username);
      const oldD = await Crypt.derive(old, pre.kdfSalt, pre.kdfIter);
      const login = await call('api_login', S.username, oldD.authKey); // 현재 비밀번호 확인 + 감싼 키 받기
      S.token = login.token;
      const dekRaw = await Crypt.unwrapDek(oldD.kek, login.wrappedDek);
      const kdfSalt = Crypt.newSalt();
      const newD = await Crypt.derive(pw, kdfSalt, pre.kdfIter);
      await call('api_changePassword', S.token, {
        oldAuthKey: oldD.authKey, kdfSalt: kdfSalt, kdfIter: pre.kdfIter,
        authKey: newD.authKey, wrappedDek: await Crypt.wrapDek(newD.kek, dekRaw)
      });
      done(); toast('비밀번호를 변경했습니다.'); viewSettings();
    } catch (e) { showError(e); }
  });
}

/* ---------------- 시작 ---------------- */
applyFontSize();
viewLogin();
</script>
</body>
</html>
