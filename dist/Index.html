<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* =====================================================================
   *  디자인 원칙 (어르신 기준)
   *  - 기본 글씨 19px (보통 앱의 1.2배), 크게 22px / 아주 크게 25px
   *  - 글자와 배경 대비 7:1 이상(본문), 버튼·상태표시 4.5:1 이상
   *  - 누르는 곳은 최소 56px 높이, 한 줄에 버튼 1~2개
   *  - 상태는 색 + 기호 + 글자로 함께 표시 (▲ 높음 / ✓ 정상)
   *  - 따뜻한 아이보리 배경 + 차분한 청록색 (병원 느낌은 살리되 차갑지 않게)
   * ===================================================================== */
  :root {
    --bg: #F7F4EE;
    --card: #FFFFFF;
    --ink: #1B1F24;
    --ink-2: #454C58;
    --line: #E4DED3;
    --primary: #0E6B64;
    --primary-dark: #0A524D;
    --primary-soft: #E3F1EF;
    --good: #17693A;   --good-bg: #E6F4EA;
    --warn: #7A4B00;   --warn-bg: #FFF1D0;
    --bad: #A61B1B;    --bad-bg: #FDE8E6;
    --none: #3F4652;   --none-bg: #ECEEF1;
    --note: #5B3A00;   --note-bg: #FFF4DC;  --note-line: #EFD49A;
    --radius: 20px;
    --shadow: 0 1px 2px rgba(40, 30, 10, .05), 0 4px 14px rgba(40, 30, 10, .06);
    --fs: 19px;
  }
  body.size-l { --fs: 22px; }
  body.size-xl { --fs: 25px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: var(--fs);
    line-height: 1.6;
    letter-spacing: -0.01em;
    word-break: keep-all;          /* 한글 단어 중간에서 줄바꿈하지 않기 */
    overflow-wrap: anywhere;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 680px; margin: 0 auto; padding: 0 16px 120px; }

  /* ---------- 머리글 ---------- */
  header.bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    background: rgba(247, 244, 238, .96); backdrop-filter: blur(6px);
    padding: 12px 0 10px; margin-bottom: 4px;
  }
  header.bar h1 { font-size: 1.15em; font-weight: 800; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h2 { font-size: 1.1em; font-weight: 800; margin: 26px 0 10px; }
  h3 { font-size: 1.02em; font-weight: 800; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .muted { color: var(--ink-2); font-size: 0.9em; }
  b, strong { font-weight: 800; }

  /* ---------- 카드 ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin: 14px 0; box-shadow: var(--shadow);
  }
  .card.click { cursor: pointer; transition: transform .08s; }
  .card.click:active { transform: scale(.985); background: #FBFAF7; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .stack > .btn, .stack > button { width: 100%; }

  /* ---------- 버튼 ---------- */
  button, .btn {
    font: inherit; font-weight: 700; color: var(--ink);
    border: 1.5px solid var(--line); background: var(--card);
    border-radius: 16px; padding: 12px 18px; min-height: 56px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  }
  button:active, .btn:active { transform: scale(.98); }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(14, 107, 100, .25); }
  button.primary:active { background: var(--primary-dark); }
  button.danger { color: var(--bad); border-color: #E8B4AE; background: #fff; }
  button.block { width: 100%; }
  button.icon { min-width: 56px; padding: 8px 12px; }
  button:disabled { opacity: 0.45; }
  button.link { border: none; background: none; box-shadow: none; color: var(--primary); padding: 4px 6px; min-height: 40px; font-size: 0.95em; text-decoration: underline; }
  button.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary-dark); }

  /* ---------- 입력칸 ---------- */
  label { display: block; font-weight: 800; margin: 18px 0 8px; }
  input, select, textarea {
    font: inherit; width: 100%; padding: 14px 16px; border: 1.5px solid #CFC8BB; border-radius: 14px;
    background: #fff; color: var(--ink); min-height: 56px;
  }
  input:focus, select:focus, textarea:focus { outline: 3px solid rgba(14, 107, 100, .25); border-color: var(--primary); }
  input::placeholder, textarea::placeholder { color: #6B7280; }
  textarea { min-height: 120px; resize: vertical; }
  input[type=checkbox], input[type=radio] { width: auto; min-height: 0; flex-shrink: 0; transform: scale(1.5); margin: 0 14px 0 6px; accent-color: var(--primary); }
  .check { display: flex; align-items: center; font-weight: 600; min-height: 48px; margin: 6px 0; }

  /* ---------- 칩(분류 버튼) ---------- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 8px; }
  .chip {
    white-space: nowrap; border-radius: 999px; padding: 8px 18px; min-height: 48px;
    border: 1.5px solid var(--line); background: #fff; font-size: 0.92em; font-weight: 700;
  }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tag { display: inline-block; font-size: 0.8em; font-weight: 800; padding: 3px 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); }

  /* ---------- 상태 표시 (색 + 기호 + 글자) ---------- */
  .flag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.82em; font-weight: 800; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .flag.정상 { background: var(--good-bg); color: var(--good); }
  .flag.높음, .flag.낮음, .flag.이상 { background: var(--bad-bg); color: var(--bad); }
  .flag.경계 { background: var(--warn-bg); color: var(--warn); }
  .flag.판정없음 { background: var(--none-bg); color: var(--none); }

  /* ---------- 홈: 인사 카드 ---------- */
  .hero {
    background: linear-gradient(135deg, #0E6B64 0%, #13847B 100%); color: #fff;
    border-radius: 24px; padding: 22px 20px; margin: 10px 0 16px; box-shadow: 0 8px 22px rgba(14, 107, 100, .28);
  }
  .hero .hello { font-size: 1.35em; font-weight: 800; line-height: 1.35; margin: 0 0 6px; }
  .hero .sub { font-size: 0.95em; opacity: .95; margin: 0 0 16px; }
  .hero .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hero .actions.one { grid-template-columns: 1fr; }
  .hero button { background: #fff; color: var(--primary-dark); border: none; min-height: 64px; font-size: 1em; flex-direction: column; gap: 2px; line-height: 1.25; }
  .hero button .ico { font-size: 1.3em; }
  .hero button.wide { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 56px; }
  .hero button.wide .ico { font-size: 1.15em; }
  .hero .badge { font-size: 0.78em; font-weight: 800; background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 2px 10px; }

  /* ---------- 기록 카드 ---------- */
  .rec { position: relative; padding-left: 22px; }
  .rec::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 6px; border-radius: 0 6px 6px 0; background: var(--primary); }
  .rec.alert::before { background: #C0392B; }
  .rec .date { font-size: 1.05em; font-weight: 800; }
  .rec .title { font-size: 1.08em; font-weight: 800; margin: 6px 0 2px; }
  .rec .where { color: var(--ink-2); font-size: 0.9em; }
  .rec .summary { margin-top: 8px; color: var(--ink); }

  /* ---------- 검사 수치 목록 (표 대신 한 줄씩 크게) ---------- */
  .tests { margin: 0; padding: 0; list-style: none; }
  .tests li { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tests li:last-child { border-bottom: none; }
  .tests .nm { flex: 1; font-weight: 700; }
  .tests .nm small { display: block; font-weight: 500; color: var(--ink-2); font-size: 0.8em; }
  .tests .val { text-align: right; font-weight: 800; font-size: 1.1em; white-space: nowrap; }
  .tests .val small { font-weight: 600; font-size: 0.72em; color: var(--ink-2); margin-left: 2px; }
  .tests .go { color: #9AA1AB; font-size: 1.1em; }
  /* 검사 짧은 설명 ("나쁜 콜레스테롤") */
  .sh { display: block; font-size: 0.8em; font-weight: 700; color: var(--primary-dark); }
  .sh.big { font-size: 0.95em; margin-bottom: 2px; }
  /* 이 수치는? 카드 */
  .info h4 { margin: 18px 0 6px; font-size: 1em; }
  .info h4 small { font-weight: 500; color: var(--ink-2); }
  .info .normal { font-size: 1.15em; font-weight: 800; margin: 0; }
  .info .mean { margin: 10px 0 0; }
  .info .mean b { color: var(--primary-dark); margin-right: 4px; }
  .info .small { font-size: 0.8em; margin-top: 14px; }
  .levels { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .levels li { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 10px 14px; border-radius: 14px; background: var(--bg); border: 2px solid transparent; }
  .levels .lv { font-weight: 800; min-width: 5.5em; }
  .levels .ok .lv { color: var(--good); } .levels .wa .lv { color: var(--warn); } .levels .bad .lv { color: var(--bad); }
  .levels li.now { border-color: var(--primary); background: var(--primary-soft); }
  .levels .here { margin-left: auto; color: var(--primary-dark); white-space: nowrap; }
  /* 목록 / 전체 표 전환 */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #EAE5DB; border-radius: 18px; margin: 4px 0 14px; }
  .modes button { border: none; background: transparent; min-height: 52px; border-radius: 14px; color: var(--ink-2); padding: 8px; }
  .modes button.on { background: var(--card); color: var(--primary-dark); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  /* 검사일별 전체 표: 첫 열(검사 이름)은 옆으로 밀어도 고정 */
  .mxwrap { overflow-x: auto; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin: 8px 0; }
  table.mx { border-collapse: separate; border-spacing: 0; font-size: 0.82em; font-variant-numeric: tabular-nums; }
  .mx th, .mx td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .mx thead th { background: #FBF9F5; font-weight: 800; line-height: 1.3; }
  .mx thead th small { display: block; font-weight: 500; color: var(--ink-2); font-size: 0.85em; }
  .mx .rowh { position: sticky; left: 0; z-index: 1; background: var(--card); text-align: left; white-space: normal; min-width: 7.5em; max-width: 9.5em; font-weight: 800; border-right: 1px solid var(--line); line-height: 1.3; }
  .mx thead .rowh { background: #FBF9F5; z-index: 2; }
  .mx tbody .rowh { cursor: pointer; }
  .mx .rowh small { display: block; font-weight: 500; color: var(--ink-2); font-size: 0.85em; margin-top: 2px; }
  .mx tr.grp th { text-align: left; background: var(--primary-soft); color: var(--primary-dark); font-weight: 800; padding: 6px 10px; }
  .mx tr.grp th span { position: sticky; left: 10px; }
  .mx td { font-weight: 700; cursor: pointer; }
  .mx td.bad { background: var(--bad-bg); color: var(--bad); }
  .mx td.warn { background: var(--warn-bg); color: var(--warn); }
  .mx td.none { color: #B8BEC6; font-weight: 400; text-align: center; cursor: default; }
  .mx td .ar { font-size: 0.75em; margin-left: 3px; }
  .mx td small { display: block; font-size: 0.72em; font-weight: 500; }
  /* 지난 상담 모아보기: 질문은 굵게, 답은 3줄까지만 (누르면 전체 대화) */
  .hist .qa { border-top: 1px solid var(--line); padding: 10px 0; }
  .hist .q { font-weight: 800; }
  .hist .q .when { display: block; font-size: 0.75em; font-weight: 500; color: var(--ink-2); }
  .hist .q .who { font-size: 0.8em; color: var(--note); margin-right: 6px; }
  .hist .a { color: var(--ink-2); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  /* 홈 수치 변화 카드 (인바디처럼): 위에 이름·최근 값, 아래 날짜별 그래프 — 오른쪽 끝이 최신, 옆으로 밀어 과거 보기 */
  h2.sec { margin-top: 24px; }
  .tcard { padding-bottom: 8px; }
  .tcard .top { align-items: flex-start; flex-wrap: nowrap; }
  .tcard .nm { font-weight: 800; font-size: 1.05em; line-height: 1.3; }
  .tcard .val { text-align: right; white-space: nowrap; line-height: 1.2; }
  .tcard .val .n { font-size: 1.5em; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tcard .val small { font-size: 0.72em; color: var(--ink-2); margin-left: 3px; font-weight: 600; }
  .tcard .chg { font-size: 0.75em; font-weight: 700; color: var(--ink-2); }
  .tcard .go { color: #9AA1AB; font-size: 1.2em; align-self: center; }
  .muted.small { font-size: 0.82em; margin-top: 2px; }
  .hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 6px; }
  .hscroll .hchart { display: block; margin-left: auto; }
  .tstrip { display: flex; gap: 8px; justify-content: flex-end; min-width: max-content; margin-left: auto; padding: 6px 0; }
  .tpill { display: flex; flex-direction: column; align-items: center; min-width: 72px; padding: 6px 10px; border-radius: 12px; background: var(--bg); font-weight: 800; }
  .tpill small { font-size: 0.72em; font-weight: 500; color: var(--ink-2); }
  .tpill.bad { background: var(--bad-bg); color: var(--bad); }
  .tpill.warn { background: var(--warn-bg); color: var(--warn); }
  /* 하단 메뉴바 (로그인하면 항상) — 누르기 쉽게 크게, 지금 메뉴는 색으로 */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--card); border-top: 1px solid var(--line);
    box-shadow: 0 -2px 12px rgba(40, 30, 10, .07); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .in { max-width: 680px; margin: 0 auto; display: flex; }
  .tabbar button { flex: 1 1 0; min-width: 0; border: none; border-radius: 0; background: none; min-height: 66px; padding: 6px 2px;
    flex-direction: column; gap: 2px; font-size: 0.8em; font-weight: 700; color: var(--ink-2); box-shadow: none; }
  .tabbar button .ti { font-size: 1.45em; line-height: 1.1; }
  .tabbar button .tl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabbar button.on { color: var(--primary-dark); background: var(--primary-soft); box-shadow: inset 0 3px 0 var(--primary); }
  body.has-nav #app { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
  body.has-nav .composer { bottom: calc(66px + env(safe-area-inset-bottom)); padding-bottom: 12px; }
  body.has-nav #toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
  /* 홈 인사: 이름을 누르면 건강 요약 */
  .hero .namebtn { all: unset; cursor: pointer; display: inline; font: inherit; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .hero .namebtn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .hero button.mini { min-height: 44px; padding: 6px 16px; background: rgba(255,255,255,.18); color: #fff; border: 1.5px solid rgba(255,255,255,.55); font-size: 0.9em; flex-direction: row; }
  /* 건강 요약 */
  .sum h3 { margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; margin: 0; }
  .kv dt { color: var(--ink-2); font-weight: 700; }
  .kv dd { margin: 0; font-weight: 700; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 10px 0; border-top: 1px solid var(--line); }
  ul.plain li:first-child { border-top: none; padding-top: 0; }
  ul.plain li[data-rid] { cursor: pointer; }
  ul.plain li small { display: block; color: var(--ink-2); font-size: 0.85em; }
  /* 앱 버전 (홈·로그인 맨 아래) */
  .appver { text-align: center; color: var(--ink-2); font-size: 0.82em; margin: 28px 0 8px; }
  .appver button { background: none; border: none; min-height: 48px; padding: 8px 14px; color: var(--ink-2); font-size: 1em; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .appver #heart { text-decoration: none; font-size: 1.3em; color: var(--bad); }
  .secret { text-align: center; font-size: 1.3em; font-weight: 800; line-height: 1.6; color: var(--primary-dark); background: var(--primary-soft); border-radius: var(--radius); padding: 28px 16px; margin-bottom: 24px; }
  /* 수치 변화 목록: 이름 · 작은 그래프 · 최근 값, 필요하면 아래에 알림 한 줄 */
  .tests.trend li { flex-wrap: wrap; row-gap: 6px; }
  .tests .spk { flex: none; }
  .tests .chg { font-size: 0.72em; font-weight: 700; color: var(--ink-2); }
  .why { flex-basis: 100%; margin: 8px 0 0; font-size: 0.85em; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: 12px; padding: 6px 12px; }
  .tests .why { margin: 0; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82em; color: var(--ink-2); margin-top: 4px; }
  .legend i { display: inline-block; width: 16px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend i.band { background: #E6F4EA; border: 1px solid #9CCDAE; }
  .legend i.dot { width: 12px; border-radius: 50%; background: #C0392B; }

  table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
  th, td { text-align: left; padding: 12px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--ink-2); font-weight: 700; font-size: 0.85em; white-space: nowrap; }

  /* ---------- 사진 ---------- */
  .thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .thumbs .t { position: relative; }
  .thumbs img { width: 104px; height: 104px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); }
  .thumbs .x { position: absolute; top: -10px; right: -10px; min-height: 40px; min-width: 40px; padding: 0; border-radius: 999px; background: #fff; }
  .photo-full { width: 100%; border-radius: 14px; border: 1px solid var(--line); margin: 8px 0; }

  /* ---------- 상담 ---------- */
  .chat { display: flex; flex-direction: column; gap: 12px; margin: 12px 0 150px; }
  .msg { padding: 14px 16px; border-radius: 20px; max-width: 90%; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; font-size: 1.02em; line-height: 1.65; }
  .msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 6px; }
  .msg.model { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .msg.family { align-self: flex-start; background: var(--note-bg); border: 1.5px solid var(--note-line); color: var(--ink); border-bottom-left-radius: 6px; }
  .msg-label { font-size: 0.82em; font-weight: 700; color: var(--note); margin: 4px 6px -6px; }
  .msg-label.right { text-align: right; color: var(--ink-2); }
  .msg-act { font-size: 0.9em; font-weight: 700; color: var(--good); margin: -4px 6px 4px; display: flex; align-items: center; }
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(247, 244, 238, .97);
    border-top: 1px solid var(--line); padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .composer .inner { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { min-height: 60px; height: 60px; }
  .composer button { white-space: nowrap; flex-shrink: 0; min-height: 60px; }

  /* ---------- 안내 상자 ---------- */
  .notice { background: var(--note-bg); color: var(--note); border: 1px solid var(--note-line); border-radius: 16px; padding: 12px 16px; font-size: 0.92em; }

  <script>
/**
 * 브라우저 안에서만 동작하는 암호화 (Web Crypto API)
 *
 *  비밀번호 ─PBKDF2(SHA-256, 30만회)→ 512bit ─┬ 앞 256bit: KEK (데이터키를 감싸는 키, 서버로 안 감)
 *                                              └ 뒤 256bit: authKey (로그인 확인용, 서버로 전송)
 *  데이터키(DEK, 랜덤 256bit) ─AES-GCM→ 모든 기록/사진/대화 암호화
 *  DEK는 KEK로 감싼 형태(wrappedDek)로만 서버에 저장된다. 복구코드로 감싼 사본도 하나 더 저장한다.
 */
const Crypt = (function () {
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const subtle = window.crypto && window.crypto.subtle;

  function assertSupported() {
    if (!subtle) throw new Error('이 브라우저는 암호화 기능을 지원하지 않습니다. 최신 크롬/사파리를 사용해 주세요.');
  }

  function randBytes(n) { const b = new Uint8Array(n); crypto.getRandomValues(b); return b; }

  function b64(bytes) {
    bytes = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  function unb64(str) {
    const s = atob(str);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  function concat(a, b) {
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0); out.set(b, a.length);
    return out;
  }

  /** 비밀번호(또는 복구코드) → { kek, authKey } */
  async function derive(secret, saltB64, iter) {
    assertSupported();
    const base = await subtle.importKey('raw', enc.encode(String(secret).normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await subtle.deriveBits(
      { name: 'PBKDF2', salt: unb64(saltB64), iterations: iter, hash: 'SHA-256' }, base, 512));
    const kek = await subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { kek: kek, authKey: b64(bits.slice(32)) };
  }

  async function encryptBytes(key, bytes) {
    const iv = randBytes(12);
    const ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, bytes));
    return concat(iv, ct);
  }

  async function decryptBytes(key, data) {
    const pt = await subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    return new Uint8Array(pt);
  }

  async function importDek(raw) {
    return subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  }

  return {
    randBytes: randBytes,
    b64: b64,
    unb64: unb64,
    derive: derive,
    newSalt: function () { return b64(randBytes(16)); },
    newDekRaw: function () { return randBytes(32); },
    importDek: importDek,

    async wrapDek(kek, dekRaw) { return b64(await encryptBytes(kek, dekRaw)); },
    async unwrapDek(kek, wrappedB64) {
      try { return await decryptBytes(kek, unb64(wrappedB64)); }
      catch (e) { throw new Error('비밀번호(또는 복구코드)가 올바르지 않습니다.'); }
    },

    async encryptJson(dek, obj) { return 'v1:' + b64(await encryptBytes(dek, enc.encode(JSON.stringify(obj)))); },
    async decryptJson(dek, s) {
      if (!s || s.indexOf('v1:') !== 0) return null;
      return JSON.parse(dec.decode(await decryptBytes(dek, unb64(s.slice(3)))));
    },

    async encryptBlobB64(dek, bytes) { return b64(await encryptBytes(dek, bytes)); },
    async decryptBlobB64(dek, b64str) { return decryptBytes(dek, unb64(b64str)); },

    /* ---- 보호자 공유용 공개키/개인키 (RSA-OAEP 2048) ---- */

    /** 새 키쌍 → { publicKey(spki b64), privateKey(CryptoKey), privatePkcs8(bytes) } */
    async newKeypair() {
      assertSupported();
      const pair = await subtle.generateKey(
        { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
        true, ['encrypt', 'decrypt']);
      const spki = new Uint8Array(await subtle.exportKey('spki', pair.publicKey));
      const pkcs8 = new Uint8Array(await subtle.exportKey('pkcs8', pair.privateKey));
      return { publicKey: b64(spki), privateKey: pair.privateKey, privatePkcs8: pkcs8 };
    },
    async importPrivateKey(pkcs8) {
      return subtle.importKey('pkcs8', pkcs8, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);
    },
    /** 상대방 공개키로 작은 데이터(데이터키 32바이트)를 암호화 */
    async encryptForPublicKey(publicKeyB64, bytes) {
      const key = await subtle.importKey('spki', unb64(publicKeyB64), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
      return b64(new Uint8Array(await subtle.encrypt({ name: 'RSA-OAEP' }, key, bytes)));
    },
    async decryptWithPrivateKey(privateKey, b64str) {
      return new Uint8Array(await subtle.decrypt({ name: 'RSA-OAEP' }, privateKey, unb64(b64str)));
    },

    /** 사람이 받아 적기 쉬운 복구코드 (혼동되는 0/O/1/I 제외, 약 100bit) */
    newRecoveryCode() {
      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const bytes = randBytes(20);
      let code = '';
      for (let i = 0; i < 20; i++) {
        code += alphabet[bytes[i] % 32];
        if (i % 4 === 3 && i < 19) code += '-';
      }
      return code;
    },
    normalizeRecoveryCode(code) { return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  };
})();

/** 서버 함수 호출 (Promise) */
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(e); });
    runner[fn].apply(runner, args);
  }).catch(function (e) {
    const msg = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
    if (msg.indexOf('SESSION_EXPIRED') >= 0) {
      logoutLocal('로그인 시간이 지났습니다. 다시 로그인해 주세요.');
      throw new Error('다시 로그인해 주세요.');
    }
    throw new Error(msg);
  });
}

const KIN_RE = /(님|아빠|엄마|아버지|어머니|할머니|할아버지|어른|형|누나|언니|오빠|여보|동생|삼촌|이모|고모|아들|딸|자기)$/;
function nim(name) { name = String(name || ''); return KIN_RE.test(name) ? name : name + '님'; }
/** 받침 유무로 조사 고르기: josa('아빠','이','가') → '아빠가', josa('어머님','이','가') → '어머님이' */
function hasBatchim(w) {
  const c = String(w).charCodeAt(String(w).length - 1);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
}
function josa(w, withB, withoutB) { return w + (hasBatchim(w) ? withB : withoutB); }

const FONT_SIZES = [['m', '보통'], ['l', '크게'], ['xl', '아주 크게']];
function fontSize() { return storageGet('fontSize') || (storageGet('fontLarge') === '1' ? 'l' : 'm'); }
function applyFontSize() {
  const f = fontSize();
  document.body.classList.toggle('size-l', f === 'l');
  document.body.classList.toggle('size-xl', f === 'xl');
}
/** 머리글의 "가" 버튼: 보통 → 크게 → 아주 크게 → 보통 */
function cycleFontSize() {
  const order = FONT_SIZES.map(function (x) { return x[0]; });
  const next = order[(order.indexOf(fontSize()) + 1) % order.length];
  storageSet('fontSize', next); applyFontSize();
  toast('글씨 크기: ' + FONT_SIZES.find(function (x) { return x[0] === next; })[1]);
}

/* ---------------- 휴대폰 '뒤로' 버튼 ----------------
 * 웹앱이라 휴대폰 뒤로 버튼을 누르면 앱 밖으로 나가 버린다. 그래서 브라우저 기록에 빈 칸(덫)을 끼워 두고,
 * 뒤로 버튼이 눌리면 덫 한 칸이 빠지면서 앱 안에서 한 단계 뒤로 간다.
 *  - 안드로이드 크롬·삼성 인터넷은 "화면을 한 번 누른 사이에 끼운 칸은 하나만" 인정한다.
 *    누르지 않고 끼우거나, 한 번 누르는 사이 두 칸을 끼우면 앞 칸이 건너뛰기 칸이 되어 뒤로 버튼에 앱이 닫힌다.
 *    그래서 안드로이드에서는 화면을 한 번 누를 때마다 칸을 최대 하나만 끼우고, 홈이 아닌 화면에서는 3개까지 쌓아 둔다.
 *  - 아이폰(모든 브라우저가 사파리 엔진)에는 이 규칙이 없어서, 뒤로를 처리한 직후 바로 칸을 다시 끼운다.
 *  - 홈에서는 "한 번 더 누르면 나가요" 안내 후 한 번 더 누르면 나간다.
 * (Apps Script 웹앱은 google.script.history 로 바깥 브라우저 기록을 다룬다. state.n = 덫 번호)
 */
const HIST = (window.google && google.script && google.script.history) || null;
let trapN = 0, exitArmed = false, exitTimer = null, freshTap = false;
const UA = navigator.userAgent || '';
const IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
function atHomeRoot() { return !document.getElementById('back') && S.tab === 'home'; }
function wantTraps() { return !S.token ? 0 : atHomeRoot() ? 1 : 3; }
/** 칸 끼우기. 아이폰이 아니면 화면을 새로 누른 뒤 한 번만 (위 설명) */
function armBackTrap() {
  if (!HIST || exitArmed || trapN >= wantTraps()) return;
  if (!IOS) {
    const act = navigator.userActivation;
    if (!freshTap || (act && !act.isActive)) return;
    freshTap = false;
  }
  trapN++;
  HIST.push({ n: trapN }, {}, '');
}
// 화면을 누를 때마다 모자란 칸을 하나씩 채운다
['pointerup', 'keydown'].forEach(function (t) {
  document.addEventListener(t, function () {
    if (exitArmed) { exitArmed = false; clearTimeout(exitTimer); }
    freshTap = true;
    armBackTrap();
  }, true);
});

function onBrowserBack(e) {
  const n = (e && e.state && e.state.n) || 0;
  if (n >= trapN) { trapN = n; return; } // 앞으로 가기 등
  trapN = n;                             // 칸이 빠졌다 = 뒤로 버튼 (안드로이드에서는 여기서 칸을 다시 끼우지 않는다)
  if (!S.token) return;
  const busy = document.getElementById('loading').classList.contains('on');
  const modal = document.querySelector('[data-a="no"]');
  const back = document.getElementById('back');
  if (busy) return armBackTrap();
  if (modal) { modal.click(); return armBackTrap(); }     // 확인 창은 닫기
  if (back) { back.click(); return armBackTrap(); }       // 화면의 ← 와 같게
  if (S.tab && S.tab !== 'home') { goTab('home'); return; } // 다른 메뉴 첫 화면 → 홈
  toast('한 번 더 누르면 앱을 나가요');                        // 홈: 한 번 더 → 나가기 (여유 칸이 남았으면 한두 번 더)
  exitArmed = true;
  clearTimeout(exitTimer);
  exitTimer = setTimeout(function () { exitArmed = false; }, 3000);
}
if (HIST) HIST.setChangeHandler(onBrowserBack);

    '<label for="u">아이디</label><input id="u" autocomplete="username" autocapitalize="none">' +
    '<label for="p">비밀번호</label><input id="p" type="password" autocomplete="current-password">' +
    '<label class="check" style="margin-top:14px"><input type="checkbox" id="keep" checked>이 휴대폰에서 로그인 유지 (다음부터 비밀번호 없이 바로 열려요)</label>' +
    '<p style="margin-top:16px"><button class="primary block" id="login">로그인</button></p>' +
    '</div>' +
    '<div class="stack"><button id="toSignup">처음이에요 (계정 만들기)</button>' +
    '<button id="toRecover">비밀번호를 잊었어요</button></div>' +
    '<p class="muted" style="margin-top:16px">내 기록은 내 비밀번호로만 열 수 있게 암호화되어 저장됩니다. 가족이나 관리자도 내용을 볼 수 없습니다.</p>' +
    '<p class="appver">v' + APP_VERSION + '</p>'
  );
  on('#login', 'click', doLogin);
  on('#resume', 'click', function () { autoLogin(rememberGet()); });

/* ---------------- 이 휴대폰에서 자동 로그인 ----------------
 * 가족끼리 쓰는 앱이라 편하게: 로그인 확인값(authKey)과 데이터키를 이 기기에 저장해 두고
 * 다음부터는 비밀번호 입력과 암호 키 계산(몇 초) 없이 바로 연다.
 * 휴대폰을 열 수 있는 사람은 기록을 볼 수 있다. 로그아웃하거나 비밀번호를 바꾸면 지운다.
 */
const REMEMBER_KEY = 'fmr_login';
function rememberGet() { try { const v = JSON.parse(storageGet(REMEMBER_KEY) || 'null'); return v && v.u && v.a && v.k ? v : null; } catch (e) { return null; } }
function rememberSet(v) { storageSet(REMEMBER_KEY, JSON.stringify(v)); }
function rememberClear() { try { window.localStorage.removeItem(REMEMBER_KEY); } catch (e) { /* 무시 */ } }

async function doLogin() {
  const username = val('#u'), password = $('#p').value;
  const keep = !$('#keep') || $('#keep').checked;
  if (!username || !password) return showError(new Error('아이디와 비밀번호를 입력해 주세요.'));
  try {
    loading('암호 키를 만드는 중… (몇 초 걸려요)');
    const pre = await call('api_prelogin', username);
    const d = await Crypt.derive(password, pre.kdfSalt, pre.kdfIter);
    loading('기록을 불러오는 중…');
    const res = await call('api_login', username, d.authKey, { home: true });
    const dekRaw = await Crypt.unwrapDek(d.kek, res.wrappedDek);
    if (keep) rememberSet({ u: res.username, a: d.authKey, k: Crypt.b64(dekRaw) }); else rememberClear();
    await finishLogin(res, dekRaw);
  } catch (e) { showError(e); }
}

async function autoLogin(saved) {
  if (!saved) return viewLogin();
  try {
    loading('여는 중…');
    const res = await call('api_login', saved.u, saved.a, { home: true });
    await finishLogin(res, Crypt.unb64(saved.k));
  } catch (e) {
    done();
    const msg = String(e.message || e);
    // 비밀번호가 바뀌었거나 계정이 없어졌으면 저장한 값을 지우고 다시 로그인하게 한다
    if (/올바르지|잠겼|없습니다/.test(msg)) { rememberClear(); viewLogin('다시 로그인해 주세요.'); }
    else viewLogin('연결이 잘 안 됐어요. 아래 "계속하기"를 다시 눌러 주세요.');
  }
}

/** 로그인 뒤 공통: 키 준비 → 가족 목록 → 권한 맞추기 → 내 기록 (가능하면 서버에서 한 번에 받은 home 사용) */
async function finishLogin(res, dekRaw) {
  S.token = res.token;
  S.username = res.username;
  S.me = { userId: res.userId, username: res.username, dek: await Crypt.importDek(dekRaw), dekRaw: dekRaw, privateKey: null };
  S.me.publicKey = res.publicKey || null;
  S.me.isAdmin = !!res.isAdmin;
  await setupKeys(res.encPrivateKey);
  if (res.home) {
    await loadPeople(res.home.shared);
    try { await fulfillAccess(res.home.sync); } catch (e) { console.warn('권한 동기화 실패', e.message); }
    await selectPerson(null, true, res.home.data);
  } else {
    // 처음 로그인(공개키를 방금 만든 경우): 예전처럼 하나씩
    await loadPeople();
    try {
      const sync = await syncAccess();
      if (sync.removed || sync.changed) await loadPeople();
    } catch (e) { console.warn('권한 동기화 실패', e.message); }
    await selectPerson(null, true);
  }
  done();
  if (!S.doctor._saved) viewDoctor(true); else viewHome();
}

  try { loading(); info = await call('api_signupInfo'); done(); } catch (e) { done(); }
  render(

    (info.allowSignup ? '' : '<div class="error" style="display:block">지금은 새 계정을 만들 수 없습니다. 관리자에게 문의하세요.</div>') +

    '<label for="p2">비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +

      : '<p class="notice" style="margin-top:14px">👑 처음 가입하는 분이 <b>관리자</b>가 돼요. 관리자는 나중에 가입하는 가족들의 기록을 함께 챙겨볼 수 있어요.</p>') +
    '<p class="notice" style="margin-top:10px">⚠️ 비밀번호는 관리자도 알 수 없고 찾아드릴 수도 없습니다. 가입 후 나오는 <b>복구코드</b>를 꼭 적어두세요.</p>' +

    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('계정을 만드는 중…');
      const iter = info.kdfIter;
      const kdfSalt = Crypt.newSalt(), rcKdfSalt = Crypt.newSalt();
      const recoveryCode = Crypt.newRecoveryCode();
      const pwd = await Crypt.derive(pw, kdfSalt, iter);
      const rcd = await Crypt.derive(Crypt.normalizeRecoveryCode(recoveryCode), rcKdfSalt, iter);
      const dekRaw = Crypt.newDekRaw();
      await call('api_signup', {
        username: username, inviteCode: inviteCode, kdfSalt: kdfSalt, kdfIter: iter,
        authKey: pwd.authKey, wrappedDek: await Crypt.wrapDek(pwd.kek, dekRaw),
        rcKdfSalt: rcKdfSalt, rcAuthKey: rcd.authKey, wrappedDekRc: await Crypt.wrapDek(rcd.kek, dekRaw)
      });
      done();

    } catch (e) { showError(e); }

function viewRecover() {
  render(
    header('비밀번호 재설정', true) +
    '<div class="card">' +
    '<p class="muted">가입할 때 받은 복구코드로 새 비밀번호를 정할 수 있습니다. 기존 기록은 그대로 유지됩니다.</p>' +
    '<label for="u">아이디</label><input id="u" autocapitalize="none">' +
    '<label for="rc">복구코드</label><input id="rc" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX">' +
    '<label for="p">새 비밀번호 (' + MIN_PW + '자 이상, 숫자만도 돼요)</label><input id="p" type="password" autocomplete="new-password">' +
    '<label for="p2">새 비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +
    '<p style="margin-top:16px"><button class="primary block" id="go">재설정</button></p>' +
    '</div>'
  );
  bindBack(function () { viewLogin(); });
  on('#go', 'click', async function () {
    const username = val('#u'), code = Crypt.normalizeRecoveryCode(val('#rc'));
    const pw = $('#p').value, pw2 = $('#p2').value;
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요. (숫자만 써도 돼요)'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('확인 중…');
      const pre = await call('api_recoveryPrelogin', username);
      const rcd = await Crypt.derive(code, pre.rcKdfSalt, pre.kdfIter);
      const begin = await call('api_recoveryBegin', username, rcd.authKey);
      const dekRaw = await Crypt.unwrapDek(rcd.kek, begin.wrappedDekRc);
      const kdfSalt = Crypt.newSalt();
      const pwd = await Crypt.derive(pw, kdfSalt, pre.kdfIter);
      await call('api_recoveryFinish', username, rcd.authKey, {
        kdfSalt: kdfSalt, kdfIter: pre.kdfIter, authKey: pwd.authKey, wrappedDek: await Crypt.wrapDek(pwd.kek, dekRaw)
      });
      rememberClear();
      done();
      viewLogin('비밀번호가 바뀌었습니다. 새 비밀번호로 로그인해 주세요.');
    } catch (e) { showError(e); }
  });
}

function logoutLocal(message) {

  S.me = null; S.people = []; S.ownerId = null; S.perm = 'owner';
  S.draft = null; S.pendingImages = []; S.keptImageIds = [];
  viewLogin(message);
}

async function doLogout() {
  const token = S.token;
  rememberClear();
  logoutLocal('로그아웃되었습니다.');
  try { await call('api_logout', token); } catch (e) { /* 무시 */ }

/* ---------------- 보호자 공유: 키 준비 / 가족 목록 ---------------- */

/** 공개키·개인키 준비. 처음 로그인하는 계정(기존 가입자 포함)은 새로 만들어 등록한다. */
async function setupKeys(encPrivateKey) {
  if (encPrivateKey) {
    const pkcs8 = await Crypt.decryptBlobB64(S.me.dek, encPrivateKey);
    S.me.privateKey = await Crypt.importPrivateKey(pkcs8);
    return;
  }
  const kp = await Crypt.newKeypair();
  const res = await call('api_setKeypair', S.token, kp.publicKey, await Crypt.encryptBlobB64(S.me.dek, kp.privatePkcs8));
  if (!res.already) { S.me.privateKey = kp.privateKey; S.me.publicKey = kp.publicKey; }
}

/** 관리자에게 내 기록 연결 (가족이 로그인할 때 자동으로, 한 번만) */
/**
 * 권한 동기화 (로그인·관리자 콘솔 조작 때 자동 실행)
 * 서버가 정책에 맞춰 열쇠를 정리한 뒤, 내가 가진 데이터키로 발급할 수 있는 열쇠 목록을 준다.
 * 데이터키는 브라우저에만 있으므로 암호화는 여기서 하고, 서버는 정책에 있는 것만 받는다.
 */
async function syncAccess() {
  return fulfillAccess(await call('api_syncAccess', S.token));
}

/** 정책상 내가 발급해 줘야 하는 열쇠를 암호화해서 등록 */
async function fulfillAccess(plan) {
  const items = [];
  for (const t of plan.tasks) {
    const raw = dekRawOf(t.ownerId);
    if (!raw) continue;
    try { items.push({ ownerId: t.ownerId, viewerId: t.viewerId, encDek: await Crypt.encryptForPublicKey(t.publicKey, raw) }); }
    catch (e) { console.warn('열쇠 발급 실패', t.ownerId, e.message); }
  }
  const added = items.length ? (await call('api_fulfillAccess', S.token, items)).added : 0;
  return { added: added, removed: plan.removed, changed: plan.changed };
}

/** 내가 데이터키를 가진 사람의 키 (본인은 S.me.dekRaw) */
function dekRawOf(userId) {
  if (userId === S.me.userId) return S.me.dekRaw;
  const p = S.people.find(function (x) { return x.ownerId === userId; });
  return p ? p.dekRaw : null;
}

/** 나를 보호자로 추가한 가족들의 데이터키를 내 개인키로 풀어 둔다 */
/** shared: 이미 받아 둔 목록(로그인 때 한 번에 받은 것). 없으면 서버에서 받는다 */
async function loadPeople(shared) {
  S.people = [{ ownerId: null, username: S.me.username, dek: S.me.dek, perm: 'owner' }];
  if (!S.me.privateKey) return;
  if (!shared) shared = await call('api_listSharedWithMe', S.token);
  for (const sh of shared) {
    try {
      const raw = await Crypt.decryptWithPrivateKey(S.me.privateKey, sh.encDek);
      S.people.push({ ownerId: sh.ownerId, username: sh.username, dek: await Crypt.importDek(raw), dekRaw: raw, perm: sh.perm, shareId: sh.shareId, managed: !!sh.managed });
    } catch (e) { console.warn('공유 키를 열 수 없음', sh.username); }
  }
}

/** 누구의 기록을 볼지 바꾼다 (null = 본인) */
async function selectPerson(ownerId, silent, preloaded) {
  const p = S.people.find(function (x) { return x.ownerId === ownerId; }) || S.people[0];
  S.ownerId = p.ownerId; S.dek = p.dek; S.perm = p.perm; S.viewName = p.username; S.managed = !!p.managed;
  S.filter = '전체'; S.search = '';
  if (!silent) loading(nim(p.username) + '의 기록을 불러오는 중…');
  if (preloaded) await applyLoad(preloaded); else await loadAll();
  if (!silent) { done(); viewHome(); }
}

/* ---------------- 데이터 불러오기 ---------------- */

/** 지금 보고 있는 사람의 기록·의사 설정(·가족이 보내준 설명)을 한 번에 받는다 */
async function loadAll() {
  await applyLoad(await dcall('api_loadOwner', S.token, !viewingOther()));
}

async function applyLoad(data) {
  const records = [];
  for (const r of data.records) {
    try {
      records.push({ recordId: r.recordId, createdAt: r.createdAt, updatedAt: r.updatedAt, imageIds: r.imageIds, data: await Crypt.decryptJson(S.dek, r.encData) || {} });
    } catch (e) { console.warn('복호화 실패', r.recordId); }
  }
  S.records = records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });

  const prof = data.profile;
  S.presets = prof.presets || [];
  let doctor = null;
  if (prof.encData) { try { doctor = await Crypt.decryptJson(S.dek, prof.encData); } catch (e) { doctor = null; } }
  S.doctor = Object.assign({}, DEFAULT_DOCTOR, doctor || {}, { _saved: !!doctor });

  // 본인 화면: 보호자가 보내준 설명 모아두기
  S.familyNotes = viewingOther() ? [] : (await decryptChats(data.chats || [])).filter(function (m) { return !m.fromOwner; });
}

/* ---------------- 홈 (기록 목록) ---------------- */

function viewHome() {
  S.tab = 'home';
  // 인사 카드: 호칭(의사 선생님 설정의 "저를 이렇게 불러주세요")이 있으면 그걸로 부른다

    : (canWrite() ? '결과지를 올리면 AI 선생님이 쉽게 설명해 드려요.' : '아직 등록된 기록이 없어요.');
  // 메뉴: 결과지 올리기 | 결과지 보기, 그 아래 선생님께 묻기 (세 개면 마지막 버튼을 한 줄 전체로)
  const actions = [];
  if (canWrite()) actions.push('<button id="add"><span class="ico">📷</span>결과지 올리기</button>');
  if (S.records.length) actions.push('<button id="records"><span class="ico">📄</span>결과지 보기 (' + S.records.length + ')</button>');
  if (S.records.length) actions.push('<button id="askAll"' + (actions.length === 2 ? ' class="wide"' : '') + '><span class="ico">💬</span>선생님께 묻기</button>');

  render(
    header(viewingOther() ? '👪 가족 기록' : '🩺 진료기록', false,
      '<button class="icon" id="font" aria-label="글씨 크기">가</button><button class="icon" id="settings" aria-label="설정">⚙️</button>') +
    (S.people.length > 1 ? '<div class="chips">' + S.people.map(function (p, i) {
      return '<button class="chip' + (p.ownerId === S.ownerId ? ' on' : '') + '" data-p="' + i + '">' +
        (p.ownerId ? '👤 ' + esc(p.username) : '🙋 나') + '</button>';
    }).join('') + '</div>' : '') +
    (viewingOther() ? (S.managed
      ? '<p class="notice">내가 대신 관리하는 <b>' + esc(nim(S.viewName)) + '</b>의 기록이에요.</p>'

async function addFiles() {
  const files = Array.prototype.slice.call(this.files || []);
  if (!files.length) return;
  try {
    loading('파일을 준비하는 중…');
    for (const f of files) {
      if (S.pendingImages.length >= MAX_FILES) { toast('사진·PDF는 한 번에 ' + MAX_FILES + '개까지 가능합니다.'); break; }
      S.pendingImages.push(await prepareFile(f));
    }
    done();
    renderAdd();
  } catch (e) { showError(e); }
}

const MAX_FILES = 10;
const MAX_RAW_BYTES = 10 * 1024 * 1024;   // PDF 등 원본 그대로 올리는 파일 1개 최대 10MB
const MAX_ANALYZE_BYTES = 18 * 1024 * 1024; // AI 분석 1번에 보낼 수 있는 총량

function isPdf(file) { return file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''); }

/**
 * 올릴 파일 준비
 *  - 사진: 1600px JPEG로 줄임
 *  - PDF: 원본 그대로 (AI가 PDF를 직접 읽음)
 *  - 브라우저가 못 여는 HEIC 사진: 원본 그대로
 */
async function prepareFile(file) {
  const takenAt = file.lastModified || Date.now();
  const raw = async function (mimeType) {
    if (file.size > MAX_RAW_BYTES) throw new Error('"' + file.name + '" 파일이 너무 큽니다 (최대 10MB).');
    return { mimeType: mimeType, bytes: new Uint8Array(await file.arrayBuffer()), url: null, name: file.name, takenAt: takenAt };
  };
  if (isPdf(file)) return raw('application/pdf');
  try {
    const img = await resizeImage(file);
    img.takenAt = takenAt;
    return img;
  } catch (e) {
    if (/heic|heif/i.test(file.type + file.name)) return raw(/heif/i.test(file.type + file.name) ? 'image/heif' : 'image/heic');
    throw e;
  }
}

function thumbHtml(item) {
  if (item.url) return '<img src="' + item.url + '" alt="">';
  const label = item.mimeType === 'application/pdf' ? '📄 PDF' : '🖼 사진';
  return '<div class="btn" style="width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75em;overflow:hidden;padding:4px">' +
    '<b>' + label + '</b><span style="word-break:break-all">' + esc(String(item.name || '').slice(0, 24)) + '</span></div>';
}

/** 복호화한 파일의 앞부분으로 종류를 알아낸다 (저장할 때 종류를 따로 적지 않으므로) */
function sniffType(b) {
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'application/pdf';
  if (b[0] === 0x89 && b[1] === 0x50) return 'image/png';
  if (b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70) return 'image/heic';
  return 'image/jpeg';
}

/** 사진을 긴 변 1600px JPEG로 줄인다 (업로드/AI 분석 속도와 용량을 위해) */
function resizeImage(file) {
  const MAX = 1600;
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) {
        if (!blob) return reject(new Error('사진을 처리하지 못했습니다.'));
        blob.arrayBuffer().then(function (buf) {
          resolve({ mimeType: 'image/jpeg', bytes: new Uint8Array(buf), url: URL.createObjectURL(blob) });
        });
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('"' + file.name + '" 파일은 열 수 없습니다. 사진 또는 PDF만 올릴 수 있어요.')); };
    img.src = url;
  });
}

async function analyze() {
  const text = S.addText || '';
  if (!S.pendingImages.length && !text.trim()) return showError(new Error('사진·PDF를 추가하거나 문자 내용을 붙여넣어 주세요.'));
  const total = S.pendingImages.reduce(function (n, i) { return n + i.bytes.length; }, 0);
  if (total > MAX_ANALYZE_BYTES) return showError(new Error('한 번에 분석하기엔 파일이 너무 큽니다. 파일 수를 줄여서 나눠 올려주세요.'));
  try {
    loading('AI가 결과를 읽고 있어요… (사진이 많으면 1분 정도 걸려요)');
    const taken = S.pendingImages.map(function (i) { return i.takenAt || Date.now(); });
    const result = await call('api_extract', S.token, {
      images: S.pendingImages.map(function (i) { return { mimeType: i.mimeType, data: Crypt.b64(i.bytes) }; }),
      text: text,
      hint: S.addHint || '',
      referenceDate: ymd(new Date(taken.length ? Math.max.apply(null, taken) : Date.now()))
    });
    done();
    const records = (result.records || []).map(function (r) {
      r.memo = S.addHint || '';
      r.source = S.pendingImages.length ? 'photo' : 'text';
      if (text && !r.raw_text && result.records.length === 1) r.raw_text = text;
      return r;
    });
    if (!records.length) return showError(new Error('결과를 찾지 못했습니다. 사진을 더 선명하게 찍어주세요.'));
    if (records.length === 1 && !findDuplicate(records[0])) return viewEdit(null, records[0]);
    viewReview(records);
  } catch (e) { showError(e); }
}

function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ---------------- 여러 건 검토 (문자 캡처 등) ---------------- */

/** 날짜 + 검사값이 같은 기록이 이미 있으면 중복으로 본다 */
function recordFingerprint(d) {
  const tests = (d.tests || []).map(function (t) { return normName(t.name) + '=' + String(t.value).replace(/\s/g, ''); }).sort().join('|');
  const body = tests || String(d.next_visit || d.summary || '').replace(/\s/g, '').slice(0, 60);
  return (d.date || '') + '#' + (d.record_type || '') + '#' + body;
}

function findDuplicate(d) {
  const fp = recordFingerprint(d);
  return S.records.find(function (r) { return recordFingerprint(r.data) === fp; }) || null;
}

function viewReview(records) {
  const seen = {};
  S.review = {
    items: records.map(function (d) {
      const fp = recordFingerprint(d);
      const dup = !!findDuplicate(d) || !!seen[fp];
      seen[fp] = true;
      // 이미 있는 기록과 예약·알림 문자는 기본으로 체크 해제
      return { data: d, dup: dup, checked: !dup && d.record_type !== '문자·알림' };
    })
  };
  renderReview();
}

function renderReview() {
  const items = S.review.items;
  const count = items.filter(function (i) { return i.checked; }).length;
  const reminders = items.filter(function (i) { return i.data.record_type === '문자·알림'; }).length;
  render(
    header('찾은 기록 ' + items.length + '건', true) +
    '<p class="notice">AI가 날짜별로 나눈 결과입니다. 저장할 기록을 고르세요. 카드를 누르면 내용을 고칠 수 있어요.' +
    (reminders ? '<br>예약·검진 알림 문자 ' + reminders + '건은 기본으로 빠져 있어요.' : '') + '</p>' +
    '<div class="row"><button class="grow" id="all">모두 선택</button><button class="grow" id="results">결과만 선택</button></div>' +
    items.map(function (it, i) {
      const d = it.data;
      const tests = (d.tests || []).map(function (t) {
        return '<span style="display:inline-block;margin:3px 4px 3px 0">' + flagHtml(t.flag, shortName(t.name) + ' ' + t.value) + '</span>';
      }).join('');
      return '<div class="card" style="' + (it.checked ? '' : 'opacity:.6') + '">' +
        '<div class="row"><input type="checkbox" data-chk="' + i + '"' + (it.checked ? ' checked' : '') + '>' +
        '<span class="tag">' + esc(d.record_type || '기타') + '</span>' +
        '<span class="muted grow">' + esc(fmtDate(d.date)) + (d.date_confidence === '추정' ? ' (추정)' : '') + '</span>' +
        (it.dup ? '<span class="flag 판정없음">이미 있음</span>' : '') + '</div>' +
        '<div data-open="' + i + '" style="cursor:pointer">' +
        '<h3>' + esc(d.title || '(제목 없음)') + '</h3>' +
        (tests ? '<div>' + tests + '</div>' : '') +
        (d.doctor_opinion || d.summary || d.next_visit ? '<p class="muted">' + esc(d.doctor_opinion || d.next_visit || d.summary) + '</p>' : '') +
        '</div></div>';
    }).join('') +
    '<p class="muted">함께 올린 사진·PDF ' + S.pendingImages.length + '개는 저장하는 기록들에 원본으로 같이 붙습니다.</p>' +
    '<button class="primary fab" id="saveAll"' + (count ? '' : ' disabled') + '>선택한 ' + count + '건 저장</button>'
  );
  bindBack(function () {
    confirmBox('저장하지 않고 나갈까요?', '나가기').then(function (ok) { if (ok) { S.review = null; renderAdd(); } });
  });
  on('[data-chk]', 'change', function () { items[Number(this.getAttribute('data-chk'))].checked = this.checked; renderReview(); });
  on('[data-open]', 'click', function () {
    const i = Number(this.getAttribute('data-open'));
    viewEdit(null, items[i].data, i);
  });
  on('#all', 'click', function () { items.forEach(function (i) { i.checked = !i.dup; }); renderReview(); });
  on('#results', 'click', function () { items.forEach(function (i) { i.checked = !i.dup && i.data.record_type !== '문자·알림'; }); renderReview(); });
  on('#saveAll', 'click', saveReviewed);
}

function shortName(name) { return String(name || '').replace(/\(.*?\)/g, '').trim(); }

async function saveReviewed() {
  const chosen = S.review.items.filter(function (i) { return i.checked; }).map(function (i) { return cleanRecord(i.data); });
  if (!chosen.length) return;
  const uploaded = [];
  try {
    loading('사진을 암호화해서 올리는 중…');
    for (const img of S.pendingImages) {
      const res = await dcall('api_uploadImage', S.token, await Crypt.encryptBlobB64(S.dek, img.bytes));
      uploaded.push(res.imageId);
    }
    loading(chosen.length + '건을 암호화해서 저장하는 중…');
    const items = [];
    for (const d of chosen) items.push({ encData: await Crypt.encryptJson(S.dek, d), imageIds: uploaded });
    const res = await dcall('api_saveRecords', S.token, items);
    const now = new Date().toISOString();
    res.recordIds.forEach(function (id, i) {
      S.records.push({ recordId: id, createdAt: now, updatedAt: now, imageIds: uploaded.slice(), data: chosen[i] });
    });
    S.records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });
    S.review = null; S.pendingImages = []; S.addText = ''; S.addHint = '';
    done();
    toast(chosen.length + '건을 저장했습니다.');
    viewHome();
  } catch (e) {
    if (uploaded.length) dcall('api_discardImages', S.token, uploaded).catch(function () {});
    showError(e);
  }
}

function cleanRecord(d) {
  d.tests = (d.tests || []).filter(function (t) { return t.name || t.value; });
  d.medications = (d.medications || []).filter(function (m) { return m.name; });
  if (!d.title) d.title = (d.record_type || '기록') + ' ' + (d.date || '');
  return d;
}

function today() { return ymd(new Date()); }

/* ---------------- 기록 확인/수정 ---------------- */

/** reviewIndex 가 있으면 "여러 건 검토" 화면의 한 건을 고치는 모드 (저장은 검토 화면에서 한꺼번에) */
function viewEdit(recordId, data, reviewIndex) {
  const d = JSON.parse(JSON.stringify(data || {}));
  d.tests = d.tests || []; d.medications = d.medications || [];
  d.diagnoses = d.diagnoses || []; d.follow_up = d.follow_up || [];
  S.draft = { recordId: recordId, data: d, reviewIndex: reviewIndex === undefined ? null : reviewIndex };
  if (recordId) {
    const rec = S.records.find(function (r) { return r.recordId === recordId; });
    S.keptImageIds = rec ? rec.imageIds.slice() : [];
    S.pendingImages = [];
  } else {
    S.keptImageIds = [];
  }
  renderEdit();
}

function input(path, value, placeholder, type) {

}
function selectBox(path, value, options) {

  }).join('') + '</select>';
}

    (S.draft.reviewIndex !== null ? '<p style="margin-top:20px"><button class="primary block" id="save">확인</button></p>' :
    '<h2>사진</h2>' +
    '<div class="thumbs">' +
    S.keptImageIds.map(function (id, i) { return '<div class="t"><div class="btn" style="width:96px;height:96px;display:flex;align-items:center;justify-content:center">📷 ' + (i + 1) + '</div><button class="x" data-kept="' + i + '">✕</button></div>'; }).join('') +
    S.pendingImages.map(function (img, i) { return '<div class="t">' + thumbHtml(img) + '<button class="x" data-pend="' + i + '">✕</button></div>'; }).join('') +
    '</div>' +
    '<label class="btn block" style="text-align:center">+ 사진·PDF 추가<input id="more" type="file" accept="image/*,application/pdf,.pdf" multiple hidden></label>' +

  );
  bindBack(function () {

      if (!ok) return;
      if (S.draft.reviewIndex !== null) renderReview();
      else if (S.draft.recordId) viewDetail(S.draft.recordId); else renderAdd();
    });
  });
  on('[data-addrow]', 'click', function () {
    const key = this.getAttribute('data-addrow');
    S.draft.data[key].push(key === 'tests' ? { flag: '판정없음' } : {});
    renderEdit();
  });

    S.draft.data[this.getAttribute('data-del')].splice(Number(this.getAttribute('data-i')), 1);
    renderEdit();
  });
  on('[data-kept]', 'click', function () { S.keptImageIds.splice(Number(this.getAttribute('data-kept')), 1); renderEdit(); });
  on('[data-pend]', 'click', function () { S.pendingImages.splice(Number(this.getAttribute('data-pend')), 1); renderEdit(); });
  on('#more', 'change', async function () {
    try {
      loading('파일을 준비하는 중…');
      for (const f of Array.prototype.slice.call(this.files || [])) S.pendingImages.push(await prepareFile(f));
      done(); renderEdit();

  on('#save', 'click', saveDraft);

/** data-bind 입력칸 → S.draft.data 자동 반영 */
$app.addEventListener('input', function (e) {
  const path = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (!path || !S.draft) return;
  const keys = path.split('.');
  let obj = S.draft.data;
  for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
  obj[keys[keys.length - 1]] = e.target.getAttribute('data-lines')
    ? e.target.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
    : e.target.value;
});

async function saveDraft() {
  const d = cleanRecord(S.draft.data);
  if (S.draft.reviewIndex !== null) {
    const item = S.review.items[S.draft.reviewIndex];
    item.data = d; item.checked = true; S.draft = null;
    return renderReview();
  }
  const uploaded = [];
  try {
    loading('암호화해서 저장하는 중…');
    for (const img of S.pendingImages) {
      const res = await dcall('api_uploadImage', S.token, await Crypt.encryptBlobB64(S.dek, img.bytes));
      uploaded.push(res.imageId);
    }
    const imageIds = S.keptImageIds.concat(uploaded);
    const res = await dcall('api_saveRecord', S.token, {
      recordId: S.draft.recordId || null,
      encData: await Crypt.encryptJson(S.dek, d),
      imageIds: imageIds
    });
    const now = new Date().toISOString();
    const existing = S.records.find(function (r) { return r.recordId === res.recordId; });
    if (existing) { existing.data = d; existing.imageIds = imageIds; existing.updatedAt = now; }
    else S.records.push({ recordId: res.recordId, createdAt: now, updatedAt: now, imageIds: imageIds, data: d });
    S.records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });
    S.pendingImages = []; S.keptImageIds = []; S.draft = null; S.addText = ''; S.addHint = '';
    done();
    toast('저장했습니다.');
    viewDetail(res.recordId);
  } catch (e) {
    if (uploaded.length) dcall('api_discardImages', S.token, uploaded).catch(function () {});
    showError(e);
  }
}

/* ---------------- 기록 상세 ---------------- */

/** onBack: 뒤로 갔을 때 보여줄 화면 (없으면 결과지 모아보기) */
function viewDetail(recordId, onBack) {
  const back = onBack || viewRecords;
  const r = S.records.find(function (x) { return x.recordId === recordId; });
  if (!r) return back();
  const d = r.data;
  const tests = d.tests || [];
  const abnormal = tests.filter(isAbnormal);

  render(
    header(d.title || '기록', true) +
    '<div class="card">' +
    '<div class="row"><span class="grow" style="font-size:1.25em;font-weight:800">' + esc(fmtDate(d.date)) + (d.date_confidence === '추정' ? ' <span class="muted">(날짜 추정)</span>' : '') + '</span>' +
    '<span class="tag">' + esc(d.record_type || '기타') + '</span></div>' +
    '<p class="muted" style="margin-top:8px">' + esc([d.hospital, d.department, d.doctor && d.doctor + ' 선생님'].filter(Boolean).join(' · ')) + '</p>' +

    (d.doctor_opinion ? '<h3>의사 소견</h3><p>' + esc(d.doctor_opinion) + '</p>' : '') +
    '</div>' +
    '<button class="primary block" id="ask">💬 이 결과에 대해 의사 선생님께 질문하기</button>' +

    (abnormal.length ? '<div class="card"><h3>⚠️ 확인이 필요한 항목</h3>' + testTable(abnormal) + '</div>' : '') +
    (tests.length ? '<div class="card"><h3>전체 검사 수치 (' + tests.length + ')</h3><p class="muted">항목을 누르면 지난 기록과 비교해 볼 수 있어요.</p>' + testTable(tests) + '</div>' : '') +

    ((d.medications || []).length ? '<div class="card"><h3>💊 처방 약</h3><table><tr><th>약</th><th>용량</th><th>복용법</th><th>일수</th></tr>' +
      d.medications.map(function (m) { return '<tr><td>' + esc(m.name) + '</td><td>' + esc(m.dosage) + '</td><td>' + esc(m.schedule) + '</td><td>' + esc(m.days) + '</td></tr>'; }).join('') +
      '</table></div>' : '') +

    (d.next_visit || (d.follow_up || []).length ? '<div class="card"><h3>📅 다음 할 일</h3>' +
      (d.next_visit ? '<p><b>' + esc(d.next_visit) + '</b></p>' : '') +
      '<ul>' + (d.follow_up || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +

    (d.memo ? '<div class="card"><h3>📝 내 메모</h3><p style="white-space:pre-wrap">' + esc(d.memo) + '</p></div>' : '') +

    (r.imageIds.length ? '<div class="card"><h3>📷 원본 사진·PDF (' + r.imageIds.length + ')</h3><div id="photos"><button class="block" id="loadPhotos">원본 보기</button></div></div>' : '') +
    (d.raw_text ? '<div class="card"><details><summary>원문 텍스트</summary><p style="white-space:pre-wrap">' + esc(d.raw_text) + '</p></details></div>' : '') +

    (canWrite() ? '<div class="row" style="margin-top:16px"><button class="grow" id="edit">✏️ 수정</button><button class="grow danger" id="del">🗑 삭제</button></div>' : '')
  );

      let html = '';
      for (const id of r.imageIds) {
        const res = await dcall('api_getImage', S.token, id);
        const bytes = await Crypt.decryptBlobB64(S.dek, res.encB64);
        const type = sniffType(bytes);
        const url = URL.createObjectURL(new Blob([bytes], { type: type }));
        if (type === 'application/pdf') {
          html += '<iframe class="photo-full" style="height:70vh" src="' + url + '" title="결과지 PDF"></iframe>' +
            '<a class="btn block" style="display:block;text-align:center;text-decoration:none" href="' + url + '" target="_blank" download="결과지.pdf">📄 PDF 새 창에서 열기 / 저장</a>';

          html += '<img class="photo-full" src="' + url + '" alt="결과지 사진">';

  });
}

function testTable(tests) {
  return '<ul class="tests">' + tests.map(function (t) {
    const info = testInfo(t.name);
    const sub = [normalLabel(t, info), t.note].filter(Boolean).join(' · ');
    return '<li data-test="' + esc(t.name) + '"><div class="nm">' + esc(t.name) + (info ? '<span class="sh">' + esc(info.short) + '</span>' : '') +
      (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>' +
      '<div class="val">' + esc(t.value) + '<small>' + esc(t.unit) + '</small><div>' + flagHtml(t.flag) + '</div></div>' +
      '<span class="go" aria-hidden="true">›</span></li>';
  }).join('') + '</ul>';
}

/* ---------------- 수치 변화 (검사 항목 추이) ---------------- */

// 같은 검사인지 비교할 이름: 공백·괄호 설명·하이픈 등 기호는 무시 ("LDL-콜레스테롤(계산)" = "LDL 콜레스테롤")
function normName(s) { return String(s || '').replace(/\(.*?\)|[\s\-_·ㆍ]/g, '').toLowerCase(); }
/** 검사 설명 사전(TestInfo)에서 찾기: 병원마다 다른 이름(SGOT, AST(SGOT) …)도 같은 검사로 */
let TEST_INDEX = null;
function testInfo(name) {
  if (!TEST_INDEX) {
    TEST_INDEX = {};
    TEST_INFO.forEach(function (x, i) { x.order = i; x.names.forEach(function (n) { TEST_INDEX[normName(n)] = x; }); });
  }
  return TEST_INDEX[normName(name)] || null;
}
/** 같은 검사끼리 묶는 열쇠: 사전에 있으면 대표 이름, 없으면 정리한 이름 */
function testKey(name) { const i = testInfo(name); return i ? '#' + i.names[0] : normName(name); }
/** 사전의 정상 기준을 이 단위에 써도 되는지 (mg/dL 기준을 mmol/L 값에 쓰면 안 됨) */
function unitOk(info, unit) {
  if (!info.units) return true;
  const u = normUnit(unit);
  return info.units.some(function (x) { return x === '' ? u === '' : u.indexOf(x) === 0; });
}
/** "정상 130 미만": 결과지 참고치가 있으면 그것, 없으면 사전 기준 */
function normalLabel(t, info) {
  if (t.reference_range) return '정상 ' + t.reference_range;
  if (info && info.normal && (!info.range || unitOk(info, t.unit))) return '정상 ' + info.normal;
  return '';
}
function levelIndex(info, v) {
  for (let i = 0; i < info.levels.length; i++) {
    const up = info.levels[i][3];
    if (up == null || v < up || (info.levels[i][4] && v === up)) return i;
  }
  return -1;
}
// 단위 비교용: 공백·대소문자 무시, 같은 단위의 다른 표기(IU/L = U/L, μ = u)는 같게
function normUnit(u) { return String(u || '').replace(/\s/g, '').toLowerCase().replace(/[μµ]/g, 'u').replace(/^iu\/l$/, 'u/l'); }
function toNum(v) { const s = String(v == null ? '' : v).replace(/,/g, '').trim(); return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN; }

/**
 * 참고치 글자를 { lo, hi } 로 읽는다. 못 읽으면 null.
 *  "70-99", "70~99", "<130", "130 미만", "40 이하", "60 이상", "≥60"
 */
function parseRange(s) {
  s = String(s || '').replace(/,/g, '').trim();
  let m = s.match(/(\d+(?:\.\d+)?)\s*[-~–—]\s*(\d+(?:\.\d+)?)/);
  if (m && parseFloat(m[1]) < parseFloat(m[2])) return { lo: parseFloat(m[1]), hi: parseFloat(m[2]) };
  m = s.match(/^[<≤]=?\s*(\d+(?:\.\d+)?)/) || s.match(/(\d+(?:\.\d+)?)\s*(미만|이하)/);
  if (m) return { lo: null, hi: parseFloat(m[1]) };
  m = s.match(/^[>≥]=?\s*(\d+(?:\.\d+)?)/) || s.match(/(\d+(?:\.\d+)?)\s*(초과|이상)/);
  if (m) return { lo: parseFloat(m[1]), hi: null };
  return null;
}

/** 지금 보고 있는 사람의 기록에서 검사 항목별로 날짜순 수치를 모은다 (기록은 이미 브라우저에서 복호화된 상태) */
function collectSeries() {
  const map = {};
  S.records.forEach(function (r) {
    const date = r.data.date || r.createdAt.slice(0, 10);
    (r.data.tests || []).forEach(function (t) {
      const key = testKey(t.name);
      if (!key) return;
      (map[key] = map[key] || []).push({ date: date, t: t, recordId: r.recordId, hospital: r.data.hospital || '', n: toNum(t.value) });
    });
  });
  return Object.keys(map).map(function (key) { return makeSeries(key, map[key]); });
}

function makeSeries(key, points) {
  points.sort(function (a, b) { return a.date.localeCompare(b.date); });
  const last = points[points.length - 1];
  const unit = normUnit(last.t.unit);
  // 그래프는 최근 기록과 단위가 같은 숫자만 잇는다 (mg/dL과 mmol/L을 한 선에 이으면 안 됨)
  const num = points.filter(function (p) { return !isNaN(p.n) && normUnit(p.t.unit) === unit; });
  let range = null;
  for (let i = num.length - 1; i >= 0 && !range; i--) range = parseRange(num[i].t.reference_range);
  const info = testInfo(last.t.name);
  if (!range && info && info.range && unitOk(info, last.t.unit)) range = info.range; // 결과지에 참고치가 없으면 사전 기준
  const s = { key: key, name: info ? info.names[0] : last.t.name, info: info, points: points, num: num, last: last, range: range };
  s.alert = isAbnormal(last.t);
  s.trend = trendText(s);
  return s;
}

/** 정상이어도 3번 이상 같은 방향으로 계속 움직이면 알려준다 (AI 없이 규칙으로 계산) */
function trendText(s) {
  if (s.num.length < 4 || s.num[s.num.length - 1] !== s.last) return '';
  let steps = 0, dir = 0;
  for (let i = s.num.length - 1; i > 0; i--) {
    const d = Math.sign(s.num[i].n - s.num[i - 1].n);
    if (!d || (dir && d !== dir)) break;
    dir = d; steps++;
  }
  if (steps < 3) return '';
  return (s.last.t.flag === '정상' ? '정상 범위지만 ' : '') + steps + '번 연속 ' + (dir > 0 ? '오르고' : '내리고') + ' 있어요';
}

/** 지난번 대비 변화량 (최근 기록이 숫자이고 그 전 숫자가 있을 때만) */
function seriesDiff(s) {
  const k = s.num.length;
  if (k < 2 || s.num[k - 1] !== s.last) return null;
  return { diff: Math.round((s.num[k - 1].n - s.num[k - 2].n) * 100) / 100, prev: s.num[k - 2] };
}

function trendSeries() { return collectSeries().filter(function (s) { return s.points.length >= 2; }); }

/**
 * 홈의 수치 변화 (인바디처럼): 검사마다 카드 한 장 — 최근 값 + 날짜별 그래프(오른쪽 끝이 최신, 왼쪽으로 밀면 과거)
 *  - 지켜볼 항목(범위 밖이거나 계속 한쪽으로 움직이는 항목)이 먼저, 그다음 안정적인 항목
 *  - 한 번만 검사한 항목은 접어서 목록으로 (여러 번 검사한 항목이 없으면 펼쳐서)
 *  - [그래프 | 전체 표] 전환. 카드나 검사 이름을 누르면 자세히
 */
function trendsSection() {
  if (!S.records.length) {
    return '<div class="card"><h3>📈 수치 변화</h3><p>결과지를 올리면 여기에서 검사 수치가 어떻게 변하는지 한눈에 볼 수 있어요.</p></div>';
  }
  const all = collectSeries();
  if (!all.length) {
    return '<div class="card"><h3>📈 수치 변화</h3><p>올린 결과지에 검사 수치가 아직 없어요. 건강검진·혈액검사 결과지를 올리면 여기에 모여요.</p></div>';
  }
  const multi = all.filter(function (s) { return s.points.length >= 2; });
  const once = all.filter(function (s) { return s.points.length < 2; });
  const byRecent = function (a, b) { return b.last.date.localeCompare(a.last.date) || b.points.length - a.points.length; };
  const byOrder = function (a, b) { return (a.info ? a.info.order : 999) - (b.info ? b.info.order : 999) || a.name.localeCompare(b.name); };
  const watch = multi.filter(function (s) { return s.alert || s.trend; }).sort(function (a, b) { return (b.alert - a.alert) || byRecent(a, b); });
  const calm = multi.filter(function (s) { return !s.alert && !s.trend; }).sort(byOrder);
  once.sort(byOrder);
  const table = S.trendMode === 'table';
  const graphs = (watch.length ? '<h2>⚠️ 지켜볼 항목 ' + watch.length + '</h2>' + watch.map(trendCard).join('') : '') +
    (calm.length ? '<h2>✓ 안정적인 항목 ' + calm.length + '</h2>' + calm.map(trendCard).join('') : '') +
    (once.length ? '<div class="card"><details' + (multi.length ? '' : ' open') + '><summary>한 번만 검사한 항목 ' + once.length + '개</summary>' +
      '<ul class="tests trend">' + once.map(seriesRow).join('') + '</ul></details></div>' : '') +
    (multi.length ? '' : '<p class="muted">같은 검사를 두 번 이상 받으면 날짜별 그래프가 생겨요.</p>');
  return '<h2 class="sec">📈 수치 변화</h2>' +
    '<div class="modes" role="tablist"><button role="tab" data-mode="list" class="' + (table ? '' : 'on') + '" aria-selected="' + !table + '">📈 그래프</button>' +
    '<button role="tab" data-mode="table" class="' + (table ? 'on' : '') + '" aria-selected="' + table + '">📋 전체 표</button></div>' +
    (table ? trendTable(all)
      : '<p class="muted">오른쪽 끝이 가장 최근이고, 왼쪽에 이전 검사가 있어요 (손가락으로 그래프를 오른쪽으로 밀기). 초록 띠는 정상 범위, 카드를 누르면 자세히 볼 수 있어요.</p>' + graphs);
}

function trendCard(s) {
  const last = s.last, d = seriesDiff(s);
  const normal = normalLabel(last.t, s.info);
  return '<div class="card click tcard" data-series="' + esc(last.t.name) + '">' +
    '<div class="row top"><div class="grow"><div class="nm">' + esc(s.name) + '</div>' + (s.info ? '<span class="sh">' + esc(s.info.short) + '</span>' : '') + '</div>' +
    '<div class="val"><span class="n">' + esc(last.t.value) + '</span><small>' + esc(last.t.unit) + '</small>' +
    '<div>' + (s.alert ? flagHtml(last.t.flag) : d && d.diff ? '<span class="chg">지난번보다 ' + (d.diff > 0 ? '▲ ' : '▼ ') + Math.abs(d.diff) + '</span>' : '') + '</div></div>' +
    '<span class="go" aria-hidden="true">›</span></div>' +
    (normal ? '<div class="muted small">' + esc(normal) + '</div>' : '') +
    (s.trend ? '<div class="why">' + esc(s.trend) + '</div>' : '') +
    '<div class="hscroll">' + (s.num.length ? historyChart(s) : textStrip(s)) + '</div></div>';
}

/** 날짜별 그래프 (인바디처럼): 점마다 수치, 아래에 날짜. 점 사이 간격은 고정이라 많아지면 옆으로 밀어서 본다 */
function historyChart(s) {
  const pts = s.num, n = pts.length, STEP = 70, L = 34, R = 34, H = 150, T = 32, B = 34;
  const W = Math.max(L + R + (n - 1) * STEP, 280);
  const x = function (i) { return W - R - (n - 1 - i) * STEP; };
  const dom = chartDomain(s);
  const y = function (v) { return T + (H - T - B) * (1 - (v - dom.min) / (dom.max - dom.min)); };
  let svg = '<svg class="hchart" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
    esc(s.name) + ' 날짜별 수치: ' + esc(pts.map(function (p) { return fmtDate(p.date) + ' ' + p.t.value; }).join(', ')) + '">' +
    bandRect(s, y, 0, W, T - 10, H - B) +
    '<line x1="0" x2="' + W + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="#E4DED3"/>';
  if (n > 1) svg += '<polyline fill="none" stroke="#0E6B64" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' +
    pts.map(function (p, i) { return x(i) + ',' + y(p.n).toFixed(1); }).join(' ') + '"/>';
  pts.forEach(function (p, i) {
    const isLast = i === n - 1, bad = isAbnormal(p.t);
    svg += '<circle cx="' + x(i) + '" cy="' + y(p.n).toFixed(1) + '" r="' + (isLast ? 6.5 : 5) + '" fill="' + dotColor(p.t) + '" stroke="#fff" stroke-width="2"/>' +
      '<text x="' + x(i) + '" y="' + (y(p.n) - 12).toFixed(1) + '" text-anchor="middle" font-size="' + (isLast ? 16 : 14) + '" font-weight="' + (isLast ? 800 : 700) +
      '" fill="' + (bad ? '#A61B1B' : '#1B1F24') + '">' + esc(p.t.value) + '</text>' +
      '<text x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="12.5" font-weight="' + (isLast ? 800 : 500) + '" fill="#454C58">' +
      esc(p.date.slice(2).replace(/-/g, '.')) + '</text>';
  });
  return svg + '</svg>';
}

/** 글자 결과(음성·양성 등): 날짜별 칸을 옆으로 나열 (오른쪽 끝이 최신) */
function textStrip(s) {
  return '<div class="tstrip">' + s.points.map(function (p) {
    const cls = !isAbnormal(p.t) ? '' : p.t.flag === '경계' ? ' warn' : ' bad';
    return '<span class="tpill' + cls + '"><small>' + esc(p.date.slice(2).replace(/-/g, '.')) + '</small>' + esc(p.t.value) + '</span>';
  }).join('') + '</div>';
}

/** 옆으로 미는 그래프·표를 오른쪽 끝(가장 최근)에서 시작하게 */
function scrollChartsToLatest() {
  $all('.hscroll').forEach(function (el) { el.scrollLeft = el.scrollWidth; });
}

/**
 * 검사일별 전체 표: 행 = 검사(분류별로 묶음), 열 = 검사한 날 (그래프와 같게 오른쪽 끝이 최신, 처음에 오른쪽 끝을 보여준다)
 *  - 병원마다 이름이 달라도 사전 기준으로 한 줄에 모은다
 *  - 범위 밖 칸은 색 + ▲▼(지난 검사 대비) 로 표시, 칸을 누르면 그날 기록으로
 */
function trendTable(all) {
  if (!all.length) return '';
  const dates = [];
  all.forEach(function (s) { s.points.forEach(function (p) { if (dates.indexOf(p.date) < 0) dates.push(p.date); }); });
  dates.sort();
  const groups = {};
  all.forEach(function (s) { const c = s.info ? s.info.cat : '기타'; (groups[c] = groups[c] || []).push(s); });
  const cats = TEST_CATS.filter(function (c) { return groups[c]; });
  let html = '<p class="muted">오른쪽 끝이 가장 최근 검사이고, 왼쪽에 이전 검사가 있어요 (손가락으로 표를 오른쪽으로 밀기). 검사 이름을 누르면 설명과 그래프를, 숫자를 누르면 그날 결과지를 볼 수 있어요.</p>' +
    '<div class="mxwrap hscroll"><table class="mx"><thead><tr><th class="rowh" scope="col">검사</th>' +
    dates.map(function (d) { return '<th scope="col"><small>' + esc(d.slice(0, 4)) + '</small>' + esc(d.slice(5).replace('-', '.')) + '</th>'; }).join('') +
    '</tr></thead><tbody>';
  cats.forEach(function (c) {
    html += '<tr class="grp"><th colspan="' + (dates.length + 1) + '"><span>' + esc(c) + '</span></th></tr>';
    groups[c].sort(function (a, b) {
      return (a.info ? a.info.order : 999) - (b.info ? b.info.order : 999) || a.name.localeCompare(b.name);
    }).forEach(function (s) {
      const unit = normUnit(s.last.t.unit);
      html += '<tr><th class="rowh" scope="row" data-series="' + esc(s.last.t.name) + '">' + esc(s.name) +
        '<small>' + esc(normalLabel(s.last.t, s.info) || s.last.t.unit || '') + '</small></th>';
      dates.forEach(function (d) {
        let p = null;
        for (let i = s.points.length - 1; i >= 0; i--) if (s.points[i].date === d) { p = s.points[i]; break; }
        if (!p) { html += '<td class="none">·</td>'; return; }
        const idx = s.num.indexOf(p);
        const ar = idx > 0 ? (p.n > s.num[idx - 1].n ? '▲' : p.n < s.num[idx - 1].n ? '▼' : '') : '';
        const cls = !isAbnormal(p.t) ? '' : p.t.flag === '경계' ? 'warn' : 'bad';
        html += '<td data-rec="' + esc(p.recordId) + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(p.t.value) +
          (ar ? '<span class="ar" aria-hidden="true">' + ar + '</span>' : '') +
          (normUnit(p.t.unit) !== unit ? '<small>' + esc(p.t.unit) + '</small>' : '') + '</td>';
      });
      html += '</tr>';
    });
  });
  return html + '</tbody></table></div>' +
    '<div class="legend"><span><i style="background:var(--bad-bg);border:1px solid #E8B4AE"></i>범위 밖</span>' +
    '<span><i style="background:var(--warn-bg);border:1px solid #EFD49A"></i>경계</span><span>▲▼ 지난 검사보다 오름·내림</span></div>';
}

/** 이 수치는? — 쉬운 설명, 정상 기준(단계), 지금 어디에 있는지 */
function infoCard(s) {
  const info = s.info;
  if (!info) return '';
  const v = s.num.length && s.num[s.num.length - 1] === s.last && unitOk(info, s.last.t.unit) ? s.last.n : NaN;
  const lv = info.levels && !isNaN(v) ? levelIndex(info, v) : -1;
  const rr = s.last.t.reference_range;
  return '<div class="card info"><h3>💡 이 수치는?</h3><p>' + esc(info.desc) + '</p>' +
    '<h4>정상 기준' + (info.unit ? ' <small>(' + esc(info.unit) + ')</small>' : '') + '</h4>' +
    (info.levels
      ? '<ul class="levels">' + info.levels.map(function (l, i) {

function seriesRow(s) {

    (s.trend ? '<div class="why">' + esc(s.trend) + '</div>' : '') + '</li>';
}

/** 세로축 범위: 수치 + (너무 멀지 않으면) 정상 범위 경계까지 */
function chartDomain(s) {
  const vals = s.num.map(function (p) { return p.n; });
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const span = max - min || Math.abs(max) * 0.2 || 1;
  if (s.range && s.range.hi != null && s.range.hi <= max + span && s.range.hi >= min - span) max = Math.max(max, s.range.hi);
  if (s.range && s.range.lo != null && s.range.lo >= min - span && s.range.lo <= max + span) min = Math.min(min, s.range.lo);
  const pad = (max - min || 1) * 0.08;
  return { min: min - pad, max: max + pad };
}

/** 정상 범위 띠 (그래프 안쪽으로 잘라서) */
function bandRect(s, y, x0, x1, top, bottom) {
  if (!s.range) return '';
  const a = s.range.hi != null ? Math.max(top, Math.min(bottom, y(s.range.hi))) : top;
  const b = s.range.lo != null ? Math.max(top, Math.min(bottom, y(s.range.lo))) : bottom;
  if (b - a < 1) return '';
  return '<rect x="' + x0 + '" y="' + a.toFixed(1) + '" width="' + (x1 - x0) + '" height="' + (b - a).toFixed(1) + '" fill="#E6F4EA"/>';
}

function dotColor(t) { return !isAbnormal(t) ? '#0E6B64' : (t.flag === '경계' ? '#B26A00' : '#C0392B'); }
