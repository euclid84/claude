/**
 * 수치 변화 그래프 (한 가지 항목)
 *  - 선 1개, 점은 크게, 숫자는 처음·최근·최고·최저에만 표시 (모든 점에 숫자를 달면 복잡해짐)
 *  - 정상 범위는 초록 띠로 깔아서 숫자를 읽지 않아도 띠 안/밖이 보이게
 *  - 정상 범위를 벗어난 점은 빨간 점 + 아래 표에 기호·글자로 함께 표시
 *  - 점을 누르면 그날 수치를 알려준다 (손가락으로 누르기 쉽게 투명한 큰 원)
 */
function sparkline(s) {
  const W = 340, H = 200, L = 16, R = 34, T = 34, B = 36;
  const points = s.num, nums = points.map(function (p) { return p.n; });
  const dom = chartDomain(s);
  const n = points.length;
  const x = function (i) { return L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)); };
  const y = function (v) { return T + (H - T - B) * (1 - (v - dom.min) / (dom.max - dom.min)); };
  const max = Math.max.apply(null, nums), min = Math.min.apply(null, nums);
  const iMax = nums.indexOf(max), iMin = nums.indexOf(min);
  const labeled = {}; [0, n - 1, iMax, iMin].forEach(function (i) { labeled[i] = true; });
  const dateStep = Math.max(1, Math.ceil(n / 4));
  const line = nums.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="수치 변화 그래프. 아래 표에 모든 값이 있습니다.">' +
    bandRect(s, y, L, W - R + 10, T - 20, H - B) +
    '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R + 10) + '" y2="' + (H - B) + '" stroke="#E4DED3" stroke-width="1"/>' +
    '<polyline fill="none" stroke="#0E6B64" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + line + '"/>';
  nums.forEach(function (v, i) {
    const isLast = i === n - 1;
    svg += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (isLast ? 7 : 5) + '" fill="' + dotColor(points[i].t) + '" stroke="#fff" stroke-width="2"/>'; // 표의 기호·글자와 같은 색
    if (labeled[i]) {
      const above = y(v) - 12 > 14;
      svg += '<text x="' + Math.min(Math.max(x(i), 16), W - 16) + '" y="' + (above ? y(v) - 12 : y(v) + 24) + '" font-size="' + (isLast ? 17 : 14) + '" font-weight="' + (isLast ? 800 : 600) +
        '" text-anchor="middle" fill="#1B1F24">' + esc(points[i].t.value) + '</text>';
    }
    if (i % dateStep === 0 || isLast) {
      if (!isLast && n - 1 - i < dateStep / 2) return;
      svg += '<text x="' + Math.min(Math.max(x(i), 22), W - 22) + '" y="' + (H - 12) + '" font-size="13" text-anchor="middle" fill="#454C58">' +
        esc("'" + points[i].date.slice(2, 7).replace('-', '.')) + '</text>';
    }
  });
  // 누르는 영역은 숫자·날짜 글자보다 위에 그려야 눌린다
  nums.forEach(function (v, i) {
    svg += '<circle data-pt="' + i + '" cx="' + x(i) + '" cy="' + y(v) + '" r="18" fill="transparent" style="cursor:pointer"><title>' +
      esc(fmtDate(points[i].date) + ' ' + points[i].t.value + ' ' + (points[i].t.unit || '')) + '</title></circle>';
  });
  return svg + '</svg>';
}

/* ---------------- 의사 선생님께 질문 ---------------- */

const SUGGEST_ONE = ['이 결과를 쉽게 설명해 주세요', '주의해야 할 수치가 있나요?', '생활습관으로 좋아질 수 있는 건 뭐예요?', '다음 진료 때 무엇을 물어보면 좋을까요?'];
const SUGGEST_ALL = ['지난번과 비교해서 달라진 점이 있나요?', '계속 나빠지고 있는 수치가 있나요?', '지금 먹고 있는 약을 정리해 주세요', '전체적으로 건강 상태를 요약해 주세요'];

/** 상담 내역을 불러와 복호화 (recordId: 기록 ID / 'ALL' / '*') */
async function loadChats(recordId) {
  return decryptChats(await dcall('api_listChats', S.token, recordId));
}

async function decryptChats(rows) {
  rows.sort(function (a, b) { return a.createdAt.localeCompare(b.createdAt); });
  const out = [];
  for (const row of rows) {
    try {
      const m = await Crypt.decryptJson(S.dek, row.encData);
      out.push(Object.assign(m, {
        id: row.messageId, recordId: row.recordId, createdAt: row.createdAt, mine: row.mine,
        fromOwner: row.fromOwner, authorName: row.authorName, shared: row.shared
      }));
    } catch (e) { /* 건너뜀 */ }
  }
  return out;
}

/** onBack: 뒤로 갔을 때 보여줄 화면 (없으면 전체 상담은 홈, 기록 상담은 그 기록) */
async function viewChat(recordId, startTab, onBack) {
  const isAll = recordId === 'ALL';
  const rec = isAll ? null : S.records.find(function (r) { return r.recordId === recordId; });
  const guardian = viewingOther();
  let all;
  try { loading('대화를 불러오는 중…'); all = await loadChats(recordId); done(); } catch (e) { showError(e); return; }

  // 보호자: 'team'(보호자 팀 상담) / 'owner'(기록 주인 본인 상담, 읽기 전용)
  let tab = startTab || 'team';
  const doctorLabel = (S.doctor.doctorName || '의사') + ' 선생님';
  const ownerName = nim(S.viewName);

  /** AI에게 이어서 물을 때 쓰는 대화 흐름: 보호자는 팀 상담, 본인은 본인 상담만 */
  function myThread() { return all.filter(function (m) { return guardian ? !m.fromOwner : m.fromOwner; }); }
  function shown() {
    if (!guardian) return all;                       // 본인 상담 + 가족이 보내준 설명
    return all.filter(function (m) { return tab === 'owner' ? m.fromOwner : !m.fromOwner; });
  }

  function bubble(m, i, list) {
    let label = '';
    if (!guardian && !m.fromOwner) label = '👪 ' + josa(nim(m.authorName), '이', '가') + (m.role === 'user' ? ' 물어본 것' : ' 보내준 답변');
    else if (guardian && tab === 'team' && m.role === 'user' && !m.mine) label = nim(m.authorName) + '의 질문';
    const cls = (!guardian && !m.fromOwner) ? 'family' : (m.role === 'user' ? 'user' : 'model');
    let actions = '';
    if (guardian && !S.managed && tab === 'team' && m.role === 'model') {
      actions = m.shared
        ? '<div class="msg-act">✓ ' + esc(ownerName) + '께 보냄 <button class="link" data-unshare="' + i + '">취소</button></div>'
        : '<div class="msg-act"><button class="link" data-share="' + i + '">📤 ' + esc(ownerName) + '께 보내기</button></div>';
    }
    return (label ? '<div class="msg-label ' + (cls === 'user' ? 'right' : '') + '">' + esc(label) + '</div>' : '') +
      '<div class="msg ' + cls + '">' + esc(m.text) + '</div>' + actions;
  }

  function draw() {
    const list = shown();
    const canAsk = !guardian || tab === 'team';
    const clearable = myThread().length > 0 && canAsk;
    render(
      header(isAll ? '전체 기록 상담' : (rec.data.title || '상담'), true, clearable ? '<button class="icon" id="clear">🗑</button>' : '') +
      (guardian && !S.managed ? '<div class="chips">' +
        '<button class="chip' + (tab === 'team' ? ' on' : '') + '" data-tab="team">' + (S.me.isAdmin ? '👑 관리자 상담' : '👪 가족 상담') + '</button>' +
        '<button class="chip' + (tab === 'owner' ? ' on' : '') + '" data-tab="owner">👤 ' + esc(ownerName) + ' 상담 (' + all.filter(function (m) { return m.fromOwner; }).length + ')</button>' +
        '</div>' : '') +
      (guardian && tab === 'team' && !S.managed ? '<p class="muted">' + esc(ownerName) + '께는 보이지 않는 상담이에요. 답변 아래 <b>📤 보내기</b>를 누르면 ' + esc(ownerName) + '께도 보여요.</p>' : '') +
      (guardian && tab === 'owner' ? '<p class="muted">' + esc(josa(ownerName, '이', '가')) + ' 직접 나눈 상담이에요 (읽기만 가능).</p>' : '') +
      '<p class="notice">AI 설명은 참고용입니다. 진단·처방은 반드시 담당 의사와 상의하세요. 응급 상황은 119.</p>' +
      '<div class="chat">' +
      (list.length ? '' : (canAsk
        ? '<div class="msg model">안녕하세요, ' + esc(doctorLabel) + '입니다. ' +
          (isAll ? '등록된 기록 전체를 보고 답해 드릴게요.' : '이 결과에 대해 궁금한 점을 물어보세요.') + '</div>' +
          '<div class="chips" style="flex-wrap:wrap">' + (isAll ? SUGGEST_ALL : SUGGEST_ONE).map(function (q) {
            return '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>';
          }).join('') + '</div>'
        : '<p class="muted">아직 상담 내역이 없어요.</p>')) +
      list.map(function (m, i) { return bubble(m, i, list); }).join('') +
      '</div>' +
      (canAsk ? '<div class="composer"><div class="inner"><textarea id="q" placeholder="궁금한 점을 적어주세요"></textarea>' +
        '<button class="primary" id="send">보내기</button></div></div>' : '')
    );
    bindBack(onBack || function () { if (isAll) viewHome(); else viewDetail(recordId); });
    on('#send', 'click', function () { send(val('#q')); });
    on('.chip[data-q]', 'click', function () { send(this.getAttribute('data-q')); });
    on('.chip[data-tab]', 'click', function () { tab = this.getAttribute('data-tab'); draw(); });
    on('[data-share]', 'click', function () { share(list, Number(this.getAttribute('data-share')), true); });
    on('[data-unshare]', 'click', function () { share(list, Number(this.getAttribute('data-unshare')), false); });
    on('#clear', 'click', async function () {
      const what = guardian ? (S.me.isAdmin ? '관리자 상담 내역을' : '가족 상담 내역을') : '내 상담 내역을';
      if (!(await confirmBox('이 기록의 ' + what + ' 모두 지울까요?', '지우기'))) return;
      try {
        loading(); await dcall('api_clearChats', S.token, recordId);
        all = all.filter(function (m) { return guardian ? m.fromOwner : !m.fromOwner; });
        done(); draw();
      } catch (e) { showError(e); }
    });
    window.scrollTo(0, document.body.scrollHeight);
  }

  /** 답변과 그 바로 앞 질문을 함께 보내기/취소 */
  async function share(list, i, flag) {
    const pair = [list[i]];
    if (i > 0 && list[i - 1].role === 'user') pair.unshift(list[i - 1]);
    if (flag && !(await confirmBox('이 질문과 답변을 ' + ownerName + '께 보낼까요? ' + ownerName + ' 화면에 "가족이 보내준 설명"으로 보여요.', '보내기'))) return;
    try {
      loading();
      await dcall('api_shareChats', S.token, pair.map(function (m) { return m.id; }), flag);
      pair.forEach(function (m) { m.shared = flag; });
      done(); toast(flag ? ownerName + '께 보냈습니다.' : '보내기를 취소했습니다.'); draw();
    } catch (e) { showError(e); }
  }

  async function send(question) {
    if (!question) return;
    const records = isAll
      ? S.records.map(function (r) { const c = Object.assign({}, r.data); delete c.raw_text; return c; })
      : [rec.data];
    try {
      loading(doctorLabel + '이 답변을 준비하고 있어요…');
      const res = await call('api_ask', S.token, {
        question: question,
        history: myThread().slice(-12).map(function (m) { return { role: m.role, text: m.text }; }),
        records: records,
        doctor: stripDoctor(S.doctor),
        asGuardian: guardian
      });
      const now = new Date().toISOString();
      const userMsg = { role: 'user', text: question };
      const modelMsg = { role: 'model', text: res.answer };
      const u = await dcall('api_saveChat', S.token, recordId, await Crypt.encryptJson(S.dek, userMsg));
      const a = await dcall('api_saveChat', S.token, recordId, await Crypt.encryptJson(S.dek, modelMsg));
      const base = { mine: true, fromOwner: !guardian, authorName: S.me.username, shared: false, createdAt: now, recordId: recordId };
      all.push(Object.assign({ id: u.messageId }, base, userMsg), Object.assign({ id: a.messageId }, base, modelMsg));
      done();
      draw();
    } catch (e) { showError(e); }
  }

  draw();
}

/* ---------------- 가족이 보내준 설명 (기록 주인 화면) ---------------- */

function notesSeenKey() { return 'notesSeen_' + (S.me && S.me.userId); }

function viewFamilyNotes() {
  const notes = S.familyNotes || [];
  storageSet(notesSeenKey(), new Date().toISOString());
  const titleOf = function (id) {
    if (id === 'ALL') return '전체 기록 상담';
    const r = S.records.find(function (x) { return x.recordId === id; });
    return r ? (r.data.title || '기록') + ' · ' + fmtDate(r.data.date) : '삭제된 기록';
  };
  const groups = [];
  notes.forEach(function (m) {
    let g = groups.find(function (x) { return x.recordId === m.recordId; });
    if (!g) { g = { recordId: m.recordId, items: [] }; groups.push(g); }
    g.items.push(m);
  });
  groups.reverse();
  render(
    header('👪 가족이 보내준 설명', true) +
    (groups.length ? groups.map(function (g) {
      return '<div class="card click" data-rec="' + esc(g.recordId) + '"><h3>' + esc(titleOf(g.recordId)) + '</h3>' +

  if (isNaN(d)) return '';

    ' ' + (d.getHours() < 12 ? '오전 ' : '오후 ') + ((d.getHours() + 11) % 12 + 1) + ':' + String(d.getMinutes()).padStart(2, '0');
}

function stripDoctor(d) {
  const c = Object.assign({}, d); delete c._saved;

/* ---------------- 혈액형: 직접 입력 또는 결과지에서 찾기 ---------------- */

function bloodText(abo, rh) { return abo ? abo + '형' + (rh ? ' Rh' + rh : '') : (rh ? 'Rh' + rh : ''); }
/** "A형 Rh+", "AB", "O형(Rh+)", "A+", "Rh(-)", "양성" … → { abo: 'A', rh: '+' } */
function parseBlood(text) {
  const t = String(text || '').replace(/\s/g, '').toUpperCase();
  const m = t.match(/(?:^|[^A-Z])(AB|A|B|O)(?=형|TYPE|$|[^A-Z])/) || t.match(/^(AB|A|B|O)/);
  let rh = '';
  const r = t.match(/RH\(?(\+|-|양성|음성|POS|NEG)/) || t.match(/^(?:AB|A|B|O)형?\(?(\+|-)/);
  if (r) rh = /\+|양성|POS/.test(r[1]) ? '+' : '-';
  return { abo: m ? m[1] : '', rh: rh };
}
/** 결과지(최근 것부터)에서 혈액형 찾기: 검사 항목(혈액형·ABO·Rh) → 글(원문·요약·진단) 순서 */
function detectBloodType() {
  let abo = null, rh = null;
  for (const r of S.records) {
    const d = r.data;
    (d.tests || []).forEach(function (t) {
      const nm = normName(t.name);
      if (!abo && /혈액형|abo|bloodtype/.test(nm) && !/^rh/.test(nm)) {
        const p = parseBlood(t.value); if (p.abo) abo = { v: p.abo, r: r }; if (p.rh && !rh) rh = { v: p.rh, r: r };
      }
      if (!rh && /^rh|rh(d)?혈액형|rh인자/.test(nm)) {
        const p = parseBlood(/rh/i.test(t.value) ? t.value : 'RH' + t.value); if (p.rh) rh = { v: p.rh, r: r };
      }
    });
    if (!abo) {
      const txt = [d.raw_text, d.summary, (d.diagnoses || []).join(' '), d.doctor_opinion].filter(Boolean).join(' ');
      const m = txt.match(/혈액형\s*[:：]?\s*((?:AB|A|B|O)\s*형?(?:\s*[,/]?\s*Rh\s*\(?\s*(?:[+-]|양성|음성)\s*\)?)?)/i);
      if (m) { const p = parseBlood(m[1]); if (p.abo) abo = { v: p.abo, r: r }; if (p.rh && !rh) rh = { v: p.rh, r: r }; }
    }
    if (abo && rh) break;
  }
  if (!abo && !rh) return null;
  const src = (abo || rh).r;
  return { text: bloodText(abo ? abo.v : '', rh ? rh.v : ''), date: src.data.date, recordId: src.recordId };
}

/** 현황 탭: 구성원별 기록 수·최근 검사·확인 필요 항목 */
async function familyOverviewRows() {
  const rows = [];
  for (const p of S.people) {
    let recs = [];
    try {
      const list = await call('api_listRecords', S.token, p.ownerId);
      for (const r of list) { try { recs.push(await Crypt.decryptJson(p.dek, r.encData) || {}); } catch (e) { /* 건너뜀 */ } }
    } catch (e) { /* 권한 없음 등 */ }
    recs.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
    const latest = recs[0];
    rows.push({ p: p, count: recs.length, latest: latest, alerts: latest ? (latest.tests || []).filter(isAbnormal).length : 0 });
  }
  return rows;
}

/** 대신 관리하는 구성원: 이름 변경 / 조회 허용 / 본인 계정으로 전환 */
async function viewProfileManage(ownerId) {
  const p = S.people.find(function (x) { return x.ownerId === ownerId; });
  if (!p) return viewAdminConsole({ tab: 'members' });
  render(
    header(p.username + ' · 구성원 설정', true) +
    '<div class="card"><h3>기본 정보</h3>' +
    '<label for="rname" style="margin-top:0">이름(호칭)</label><div class="row"><input id="rname" class="grow" style="flex:1" maxlength="20" value="' + esc(p.username) + '">' +
    '<button id="rename">변경</button></div>' +
    '<p style="margin-top:12px"><button id="openRec">기록 열기</button> <button data-permfor="' + esc(ownerId) + '">조회 권한</button></p></div>' +
    '<div class="card"><h3>본인 계정으로 전환</h3>' +
    '<p class="muted">본인이 직접 앱을 쓰게 되면 아이디와 비밀번호를 만들어 전환합니다. 기존 기록은 유지되며 관리자는 계속 조회할 수 있습니다. 비밀번호는 본인이 직접 입력하도록 하세요.</p>' +
    '<label for="cu">아이디</label><input id="cu" autocapitalize="none">' +
    '<label for="cp">비밀번호 (' + MIN_PW + '자 이상, 숫자만도 돼요)</label><input id="cp" type="password" autocomplete="new-password">' +
    '<label for="cp2">비밀번호 확인</label><input id="cp2" type="password" autocomplete="new-password">' +
    '<p style="margin-top:12px"><button class="primary" id="claim">계정 만들기</button></p></div>',
    { console: true }
  );
  bindBack(function () { viewAdminConsole({ tab: 'members' }).catch(showError); });
  on('#openRec', 'click', function () { selectPerson(ownerId).catch(showError); });
  on('[data-permfor]', 'click', function () { viewAdminConsole({ tab: 'perms', sel: ownerId }).catch(showError); });
  on('#rename', 'click', async function () {
    const name = val('#rname');
    try {
      loading(); await call('api_renameProfile', S.token, ownerId, name);
      p.username = name; if (S.ownerId === ownerId) S.viewName = name;
      done(); toast('변경했습니다.'); viewProfileManage(ownerId);
    } catch (e) { showError(e); }
  });
  on('#claim', 'click', async function () {
    const username = val('#cu'), pw = $('#cp').value, pw2 = $('#cp2').value;
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요. (숫자만 써도 돼요)'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    if (!(await confirmBox(p.username + ' 구성원이 아이디 "' + username + '"로 로그인할 수 있게 됩니다. 계속할까요?', '계정 만들기'))) return;
    try {
      loading('계정을 만드는 중…');
      const iter = 300000;
      const kdfSalt = Crypt.newSalt(), rcKdfSalt = Crypt.newSalt();
      const recoveryCode = Crypt.newRecoveryCode();
      const pwd = await Crypt.derive(pw, kdfSalt, iter);
      const rcd = await Crypt.derive(Crypt.normalizeRecoveryCode(recoveryCode), rcKdfSalt, iter);
      const kp = await Crypt.newKeypair();
      await call('api_claimProfile', S.token, ownerId, {
        username: username, kdfSalt: kdfSalt, kdfIter: iter,
        authKey: pwd.authKey, wrappedDek: await Crypt.wrapDek(pwd.kek, p.dekRaw),
        rcKdfSalt: rcKdfSalt, rcAuthKey: rcd.authKey, wrappedDekRc: await Crypt.wrapDek(rcd.kek, p.dekRaw),
        publicKey: kp.publicKey, encPrivateKey: await Crypt.encryptBlobB64(p.dek, kp.privatePkcs8)
      });
      p.managed = false; if (S.ownerId === ownerId) S.managed = false;
      done();
      render(
        header('계정 전환 완료') +
        '<div class="card"><p><b>' + esc(p.username) + '</b> 구성원이 아이디 <b>' + esc(username) + '</b>로 로그인할 수 있습니다.</p>' +
        '<p class="muted">비밀번호 분실 시 필요한 복구코드입니다. 본인에게 전달해 보관하도록 하세요.</p>' +
        '<div class="code">' + esc(recoveryCode) + '</div>' +
        '<label class="check" style="margin-top:14px"><input type="checkbox" id="ok">복구코드를 전달했습니다</label>' +
        '<p style="margin-top:12px"><button class="primary" id="go" disabled>확인</button></p></div>',
        { console: true }
      );
      on('#ok', 'change', function () { $('#go').disabled = !this.checked; });
      on('#go', 'click', function () { viewAdminConsole({ tab: 'members' }).catch(showError); });
    } catch (e) { showError(e); }
  });
}

    '<label>전문 분야</label><input id="specialty" value="' + esc(d.specialty) + '" placeholder="예) 가정의학과, 내과, 정형외과">' +
    '<label>말투</label>' + radioGroup('tone', d.tone, [['friendly', '다정하고 친근하게'], ['polite', '정중하고 차분하게'], ['concise', '간결하게 핵심만']]) +
    '<label>설명 수준</label>' + radioGroup('level', d.level, [['easy', '아주 쉽게 (전문용어 없이)'], ['normal', '보통 (용어는 괄호로)'], ['expert', '자세하고 전문적으로']]) +
    '<label>답변 길이</label>' + radioGroup('length', d.length, [['short', '짧게'], ['medium', '적당히'], ['long', '자세히']]) +
    '<label class="check"><input type="checkbox" id="lifestyleTips"' + (d.lifestyleTips ? ' checked' : '') + '>식습관·운동 등 생활습관 조언도 해주세요</label>' +
    '</div>' +

    '<div class="card"><h3>2. 내 건강 정보 (선택)</h3><p class="muted">적어두면 답변이 더 정확해져요. 이 정보도 암호화되어 저장됩니다.</p>' +
    '<label>저를 이렇게 불러주세요</label><input id="patientCall" value="' + esc(d.patientCall) + '" placeholder="예) 어머님, 김OO님">' +
    '<div class="row"><div class="grow"><label>나이대</label><input id="ageGroup" value="' + esc(d.ageGroup) + '" placeholder="예) 60대"></div>' +
    '<div class="grow"><label>성별</label><select id="sex">' + ['', '여성', '남성'].map(function (s) { return '<option' + (d.sex === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div></div>' +
    (function () {
      const cur = parseBlood(d.bloodType), found = detectBloodType();
      const opt = function (id, list, v) { return '<select id="' + id + '">' + list.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === v ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>'; };
      return '<div class="row"><div class="grow"><label>혈액형</label>' + opt('abo', [['', '모름'], ['A', 'A형'], ['B', 'B형'], ['O', 'O형'], ['AB', 'AB형']], cur.abo) + '</div>' +
        '<div class="grow"><label>Rh</label>' + opt('rh', [['', '모름'], ['+', 'Rh+'], ['-', 'Rh-']], cur.rh) + '</div></div>' +
        (found ? '<p class="muted small">결과지에서 찾은 혈액형: <b>' + esc(found.text) + '</b> (' + esc(fmtDate(found.date)) + ')' + (d.bloodType ? '' : ' — 비워 두면 이걸 써요') + '</p>' : '');
    })() +
    '<label>앓고 있는 질환 / 병력</label><input id="conditions" value="' + esc(d.conditions) + '" placeholder="예) 고혈압, 당뇨 전단계">' +
    '<label>수술·입원 기록</label><input id="surgeries" value="' + esc(d.surgeries) + '" placeholder="예) 2019 담낭 절제술, 2023 백내장 수술">' +
    '<label>복용 중인 약</label><input id="medications" value="' + esc(d.medications) + '" placeholder="예) 혈압약 아침 1알">' +
    '<label>알레르기</label><input id="allergies" value="' + esc(d.allergies) + '">' +
    '<label>특히 걱정되는 점</label><input id="concerns" value="' + esc(d.concerns) + '" placeholder="예) 콜레스테롤, 무릎 관절">' +
    '</div>' +

    '<div class="card"><h3>3. 추가 지시사항 (직접 작성)</h3>' +
    '<p class="muted">선생님께 바라는 점을 자유롭게 적어주세요. 이 내용이 AI 프롬프트에 그대로 들어갑니다.</p>' +
    '<textarea id="customPrompt" style="min-height:160px" placeholder="예) 설명 끝에 항상 한 줄로 요약해 주세요. 수치가 나쁘면 겁주지 말고 차분하게 알려주세요.">' + esc(d.customPrompt) + '</textarea>' +
    '<button class="block" id="preview" style="margin-top:10px">👀 최종 프롬프트 미리보기</button>' +
    '<pre id="pv" style="display:none;white-space:pre-wrap;font-size:.8em;background:#f0f3f8;padding:10px;border-radius:10px"></pre>' +
    '</div>' +
    '<button class="primary block" id="save">저장</button>' +
    (firstTime ? '<p style="margin-top:10px"><button class="block" id="skip">나중에 할게요</button></p>' : '')
  );

  function collect() {
    const pick = function (name) { const el = $('input[name="' + name + '"]:checked'); return el ? el.value : ''; };
    return {
      presetId: $('#presetId') ? $('#presetId').value : '',
      doctorName: val('#doctorName'), specialty: val('#specialty'),
      tone: pick('tone') || 'friendly', level: pick('level') || 'easy', length: pick('length') || 'medium',
      lifestyleTips: $('#lifestyleTips').checked,
      patientCall: val('#patientCall'), ageGroup: val('#ageGroup'), sex: $('#sex').value,
      bloodType: bloodText($('#abo').value, $('#rh').value),
      conditions: val('#conditions'), surgeries: val('#surgeries'), medications: val('#medications'), allergies: val('#allergies'), concerns: val('#concerns'),
      customPrompt: $('#customPrompt').value.trim()
    };
  }

  bindBack(onBack || viewSettings);
  on('#skip', 'click', viewHome);
  on('#preview', 'click', async function () {
    try {
      loading();
      const res = await call('api_previewDoctorPrompt', S.token, collect());
      done();
      const pv = $('#pv'); pv.textContent = res.prompt; pv.style.display = 'block';
    } catch (e) { showError(e); }
  });
  on('#save', 'click', async function () {
    const doctor = collect();
    try {
      loading('저장하는 중…');
      await dcall('api_saveDoctorProfile', S.token, await Crypt.encryptJson(S.dek, doctor));
      S.doctor = Object.assign({}, doctor, { _saved: true });
      done(); toast(onBack ? '건강 정보를 저장했습니다.' : '의사 선생님 설정을 저장했습니다.');
      if (firstTime) viewHome(); else (onBack || viewSettings)();
    } catch (e) { showError(e); }
  });
}

function viewChangePassword() {
  render(
    header('비밀번호 변경', true) +
    '<div class="card">' +
    '<label for="old">현재 비밀번호</label><input id="old" type="password" autocomplete="current-password">' +
    '<label for="p">새 비밀번호 (' + MIN_PW + '자 이상, 숫자만도 돼요)</label><input id="p" type="password" autocomplete="new-password">' +
    '<label for="p2">새 비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +
    '<p style="margin-top:16px"><button class="primary block" id="go">변경</button></p>' +
    '<p class="muted">복구코드는 그대로 유지됩니다.</p></div>'
  );
  bindBack(viewSettings);
  on('#go', 'click', async function () {
    const old = $('#old').value, pw = $('#p').value, pw2 = $('#p2').value;
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요. (숫자만 써도 돼요)'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('변경하는 중…');
      const pre = await call('api_prelogin', S.username);
      const oldD = await Crypt.derive(old, pre.kdfSalt, pre.kdfIter);
      const login = await call('api_login', S.username, oldD.authKey); // 현재 비밀번호 확인 + 감싼 키 받기
      S.token = login.token;
      const dekRaw = await Crypt.unwrapDek(oldD.kek, login.wrappedDek);
      const kdfSalt = Crypt.newSalt();
      const newD = await Crypt.derive(pw, kdfSalt, pre.kdfIter);
      await call('api_changePassword', S.token, {
        oldAuthKey: oldD.authKey, kdfSalt: kdfSalt, kdfIter: pre.kdfIter,
        authKey: newD.authKey, wrappedDek: await Crypt.wrapDek(newD.kek, dekRaw)
      });
      if (rememberGet()) rememberSet({ u: S.username, a: newD.authKey, k: Crypt.b64(dekRaw) });
      done(); toast('비밀번호를 변경했습니다.'); viewSettings();
    } catch (e) { showError(e); }
  });
}

/* ---------------- 시작 ---------------- */
applyFontSize();
// 이 휴대폰에 로그인을 저장해 두었으면 비밀번호 없이 바로 연다
if (rememberGet()) autoLogin(rememberGet()); else viewLogin();
</script>
