<script>
/* =========================================================================
 *  우리가족 진료기록 — 화면/동작
 *  - 복호화된 데이터와 데이터키(DEK)는 이 페이지의 메모리에만 존재한다.
 *  - 새로고침하거나 창을 닫으면 다시 로그인해야 한다.
 * ========================================================================= */

const RECORD_TYPES = ['정기건강검진', '외래진료', '입원·수술', '검사결과', '처방·약', '문자·알림', '기타'];
const TEST_FLAGS = ['정상', '높음', '낮음', '경계', '이상', '판정없음'];
const MIN_PW = 8;

const DEFAULT_DOCTOR = {
  presetId: '', doctorName: '', specialty: '가정의학과',
  tone: 'friendly', level: 'easy', length: 'medium', lifestyleTips: true,
  patientCall: '', ageGroup: '', sex: '', conditions: '', medications: '', allergies: '', concerns: '',
  customPrompt: ''
};

const S = {
  token: null, username: null, dek: null,
  records: [], filter: '전체', search: '',
  doctor: null, presets: [],
  draft: null, pendingImages: [], keptImageIds: [], review: null,
  // 보호자 공유: me = 로그인한 본인, people = [본인, 나를 보호자로 추가한 가족...]
  me: null, people: [], ownerId: null, perm: 'owner'
};

const $app = document.getElementById('app');

/* ---------------- 공통 도우미 ---------------- */

function esc(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function $(sel) { return $app.querySelector(sel); }
function $all(sel) { return Array.prototype.slice.call($app.querySelectorAll(sel)); }
function on(sel, evt, fn) { $all(sel).forEach(function (el) { el.addEventListener(evt, fn); }); }
function val(sel) { const el = $(sel); return el ? el.value.trim() : ''; }

function loading(msg) {
  document.getElementById('loadingMsg').textContent = msg || '잠시만 기다려 주세요…';
  document.getElementById('loading').classList.add('on');
}
function done() { document.getElementById('loading').classList.remove('on'); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2500);
}

function showError(err) {
  done();
  const msg = (err && err.message) || String(err);
  const box = $('#err');
  if (box) { box.textContent = msg; box.style.display = 'block'; box.scrollIntoView({ block: 'center' }); }
  else toast(msg);
}

/** 브라우저 기본 confirm 대신 쓰는 확인창 (iframe 안에서도 안전) */
function confirmBox(message, okLabel) {
  return new Promise(function (resolve) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px';
    wrap.innerHTML = '<div class="card" style="max-width:420px;width:100%"><p>' + esc(message) + '</p>' +
      '<div class="row" style="margin-top:14px"><button class="grow" data-a="no">취소</button>' +
      '<button class="grow primary" data-a="yes">' + esc(okLabel || '확인') + '</button></div></div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (e) {
      const a = e.target.getAttribute('data-a');
      if (!a) return;
      document.body.removeChild(wrap);
      resolve(a === 'yes');
    });
  });
}

/** 서버 함수 호출 (Promise) */
function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) { reject(e); });
    runner[fn].apply(runner, args);
  }).catch(function (e) {
    const msg = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
    if (msg.indexOf('SESSION_EXPIRED') >= 0) {
      logoutLocal('로그인 시간이 지났습니다. 다시 로그인해 주세요.');
      throw new Error('다시 로그인해 주세요.');
    }
    throw new Error(msg);
  });
}

/** 지금 보고 있는 사람의 기록을 다루는 서버 호출 (본인이면 ownerId = null) */
function dcall() {
  const args = Array.prototype.slice.call(arguments);
  args.push(S.ownerId);
  return call.apply(null, args);
}

/** "장모님" 같은 아이디에 "님"이 겹치지 않게 */
function nim(name) { name = String(name || ''); return /님$/.test(name) ? name : name + '님'; }

function canWrite() { return S.perm === 'owner' || S.perm === 'write'; }
function viewingOther() { return !!S.ownerId; }

function storageGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function storageSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 무시 */ } }

const FONT_SIZES = [['m', '보통'], ['l', '크게'], ['xl', '아주 크게']];
function fontSize() { return storageGet('fontSize') || (storageGet('fontLarge') === '1' ? 'l' : 'm'); }
function applyFontSize() {
  const f = fontSize();
  document.body.classList.toggle('size-l', f === 'l');
  document.body.classList.toggle('size-xl', f === 'xl');
}
/** 머리글의 "가" 버튼: 보통 → 크게 → 아주 크게 → 보통 */
function cycleFontSize() {
  const order = FONT_SIZES.map(function (x) { return x[0]; });
  const next = order[(order.indexOf(fontSize()) + 1) % order.length];
  storageSet('fontSize', next); applyFontSize();
  toast('글씨 크기: ' + FONT_SIZES.find(function (x) { return x[0] === next; })[1]);
}

/** 상태 표시: 색 + 기호 + 글자 (색만으로 구분하지 않음) */
const FLAG_ICON = { '정상': '✓', '높음': '▲', '낮음': '▼', '경계': '!', '이상': '!', '판정없음': '–' };
function flagHtml(flag, text) {
  flag = flag || '판정없음';
  return '<span class="flag ' + esc(flag) + '"><span aria-hidden="true">' + (FLAG_ICON[flag] || '') + '</span>' + esc(text || flag) + '</span>';
}

function fmtDate(d) {
  if (!d) return '날짜 모름';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
  return m ? m[1] + '.' + m[2] + '.' + m[3] : d;
}

function sortKey(r) { return (r.data.date || r.createdAt.slice(0, 10)) + r.createdAt; }

function header(title, backFn, rightHtml) {
  return '<header class="bar">' +
    (backFn ? '<button class="icon" id="back" aria-label="뒤로">←</button>' : '') +
    '<h1>' + esc(title) + '</h1>' + (rightHtml || '') + '</header>' +
    '<div id="err" class="error" style="display:none"></div>';
}

function bindBack(fn) { on('#back', 'click', fn); }

function render(html) { $app.innerHTML = html; window.scrollTo(0, 0); }

/* ---------------- 로그인 / 가입 / 복구 ---------------- */

function viewLogin(message) {
  render(
    '<div class="welcome"><div class="logo" aria-hidden="true">🩺</div><h1>우리가족 진료기록</h1>' +
    '<p>결과지를 올리면 AI 선생님이<br>쉽게 설명해 드려요</p></div>' +
    (message ? '<div class="notice">' + esc(message) + '</div>' : '') +
    '<div id="err" class="error" style="display:none"></div>' +
    '<div class="card">' +
    '<label for="u">아이디</label><input id="u" autocomplete="username" autocapitalize="none">' +
    '<label for="p">비밀번호</label><input id="p" type="password" autocomplete="current-password">' +
    '<p style="margin-top:16px"><button class="primary block" id="login">로그인</button></p>' +
    '</div>' +
    '<div class="stack"><button id="toSignup">처음이에요 (계정 만들기)</button>' +
    '<button id="toRecover">비밀번호를 잊었어요</button></div>' +
    '<p class="muted" style="margin-top:16px">내 기록은 내 비밀번호로만 열 수 있게 암호화되어 저장됩니다. 가족이나 관리자도 내용을 볼 수 없습니다.</p>'
  );
  on('#login', 'click', doLogin);
  on('#p', 'keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  on('#toSignup', 'click', viewSignup);
  on('#toRecover', 'click', viewRecover);
}

async function doLogin() {
  const username = val('#u'), password = $('#p').value;
  if (!username || !password) return showError(new Error('아이디와 비밀번호를 입력해 주세요.'));
  try {
    loading('로그인 중… (암호 키를 만드는 데 몇 초 걸릴 수 있어요)');
    const pre = await call('api_prelogin', username);
    const d = await Crypt.derive(password, pre.kdfSalt, pre.kdfIter);
    const res = await call('api_login', username, d.authKey);
    const dekRaw = await Crypt.unwrapDek(d.kek, res.wrappedDek);
    S.token = res.token;
    S.username = res.username;
    S.me = { userId: res.userId, username: res.username, dek: await Crypt.importDek(dekRaw), dekRaw: dekRaw, privateKey: null };
    await setupKeys(res.encPrivateKey);
    await loadPeople();
    await selectPerson(null, true);
    done();
    if (!S.doctor._saved) viewDoctor(true); else viewHome();
  } catch (e) { showError(e); }
}

async function viewSignup() {
  let info = { allowSignup: true, kdfIter: 300000 };
  try { loading(); info = await call('api_signupInfo'); done(); } catch (e) { done(); }
  render(
    header('계정 만들기', true) +
    (info.allowSignup ? '' : '<div class="error" style="display:block">지금은 새 계정을 만들 수 없습니다. 관리자에게 문의하세요.</div>') +
    '<div class="card">' +
    '<label for="inv">초대코드</label><input id="inv" autocapitalize="characters" placeholder="관리자에게 받은 코드">' +
    '<label for="u">아이디 (2~20자)</label><input id="u" autocapitalize="none" autocomplete="username">' +
    '<label for="p">비밀번호 (' + MIN_PW + '자 이상)</label><input id="p" type="password" autocomplete="new-password">' +
    '<label for="p2">비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +
    '<p class="notice" style="margin-top:14px">⚠️ 비밀번호는 관리자도 알 수 없고 찾아드릴 수도 없습니다. 가입 후 나오는 <b>복구코드</b>를 꼭 적어두세요.</p>' +
    '<p style="margin-top:16px"><button class="primary block" id="go"' + (info.allowSignup ? '' : ' disabled') + '>가입하기</button></p>' +
    '</div>'
  );
  bindBack(function () { viewLogin(); });
  on('#go', 'click', async function () {
    const username = val('#u'), pw = $('#p').value, pw2 = $('#p2').value, inviteCode = val('#inv');
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요.'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('계정을 만드는 중…');
      const iter = info.kdfIter;
      const kdfSalt = Crypt.newSalt(), rcKdfSalt = Crypt.newSalt();
      const recoveryCode = Crypt.newRecoveryCode();
      const pwd = await Crypt.derive(pw, kdfSalt, iter);
      const rcd = await Crypt.derive(Crypt.normalizeRecoveryCode(recoveryCode), rcKdfSalt, iter);
      const dekRaw = Crypt.newDekRaw();
      await call('api_signup', {
        username: username, inviteCode: inviteCode, kdfSalt: kdfSalt, kdfIter: iter,
        authKey: pwd.authKey, wrappedDek: await Crypt.wrapDek(pwd.kek, dekRaw),
        rcKdfSalt: rcKdfSalt, rcAuthKey: rcd.authKey, wrappedDekRc: await Crypt.wrapDek(rcd.kek, dekRaw)
      });
      done();
      viewRecoveryCode(username, recoveryCode);
    } catch (e) { showError(e); }
  });
}

function viewRecoveryCode(username, code) {
  render(
    header('복구코드를 적어두세요') +
    '<div class="card">' +
    '<p>비밀번호를 잊어버렸을 때 <b>이 코드가 유일한 방법</b>입니다. 종이에 적거나 사진을 찍어 안전한 곳에 보관하세요.</p>' +
    '<p class="muted">아이디: ' + esc(username) + '</p>' +
    '<div class="code">' + esc(code) + '</div>' +
    '<label class="check" style="margin-top:16px"><input type="checkbox" id="ok">복구코드를 안전한 곳에 적어두었습니다</label>' +
    '<p style="margin-top:16px"><button class="primary block" id="go" disabled>로그인하러 가기</button></p>' +
    '</div>'
  );
  on('#ok', 'change', function () { $('#go').disabled = !this.checked; });
  on('#go', 'click', function () { viewLogin('가입이 완료되었습니다. 방금 만든 아이디로 로그인해 주세요.'); });
}

function viewRecover() {
  render(
    header('비밀번호 재설정', true) +
    '<div class="card">' +
    '<p class="muted">가입할 때 받은 복구코드로 새 비밀번호를 정할 수 있습니다. 기존 기록은 그대로 유지됩니다.</p>' +
    '<label for="u">아이디</label><input id="u" autocapitalize="none">' +
    '<label for="rc">복구코드</label><input id="rc" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX">' +
    '<label for="p">새 비밀번호 (' + MIN_PW + '자 이상)</label><input id="p" type="password" autocomplete="new-password">' +
    '<label for="p2">새 비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +
    '<p style="margin-top:16px"><button class="primary block" id="go">재설정</button></p>' +
    '</div>'
  );
  bindBack(function () { viewLogin(); });
  on('#go', 'click', async function () {
    const username = val('#u'), code = Crypt.normalizeRecoveryCode(val('#rc'));
    const pw = $('#p').value, pw2 = $('#p2').value;
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요.'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('확인 중…');
      const pre = await call('api_recoveryPrelogin', username);
      const rcd = await Crypt.derive(code, pre.rcKdfSalt, pre.kdfIter);
      const begin = await call('api_recoveryBegin', username, rcd.authKey);
      const dekRaw = await Crypt.unwrapDek(rcd.kek, begin.wrappedDekRc);
      const kdfSalt = Crypt.newSalt();
      const pwd = await Crypt.derive(pw, kdfSalt, pre.kdfIter);
      await call('api_recoveryFinish', username, rcd.authKey, {
        kdfSalt: kdfSalt, kdfIter: pre.kdfIter, authKey: pwd.authKey, wrappedDek: await Crypt.wrapDek(pwd.kek, dekRaw)
      });
      done();
      viewLogin('비밀번호가 바뀌었습니다. 새 비밀번호로 로그인해 주세요.');
    } catch (e) { showError(e); }
  });
}

function logoutLocal(message) {
  S.token = null; S.username = null; S.dek = null; S.records = []; S.doctor = null;
  S.me = null; S.people = []; S.ownerId = null; S.perm = 'owner';
  S.draft = null; S.pendingImages = []; S.keptImageIds = [];
  viewLogin(message);
}

async function doLogout() {
  const token = S.token;
  logoutLocal('로그아웃되었습니다.');
  try { await call('api_logout', token); } catch (e) { /* 무시 */ }
}

/* ---------------- 보호자 공유: 키 준비 / 가족 목록 ---------------- */

/** 공개키·개인키 준비. 처음 로그인하는 계정(기존 가입자 포함)은 새로 만들어 등록한다. */
async function setupKeys(encPrivateKey) {
  if (encPrivateKey) {
    const pkcs8 = await Crypt.decryptBlobB64(S.me.dek, encPrivateKey);
    S.me.privateKey = await Crypt.importPrivateKey(pkcs8);
    return;
  }
  const kp = await Crypt.newKeypair();
  const res = await call('api_setKeypair', S.token, kp.publicKey, await Crypt.encryptBlobB64(S.me.dek, kp.privatePkcs8));
  if (!res.already) S.me.privateKey = kp.privateKey;
}

/** 나를 보호자로 추가한 가족들의 데이터키를 내 개인키로 풀어 둔다 */
async function loadPeople() {
  S.people = [{ ownerId: null, username: S.me.username, dek: S.me.dek, perm: 'owner' }];
  if (!S.me.privateKey) return;
  const shared = await call('api_listSharedWithMe', S.token);
  for (const sh of shared) {
    try {
      const raw = await Crypt.decryptWithPrivateKey(S.me.privateKey, sh.encDek);
      S.people.push({ ownerId: sh.ownerId, username: sh.username, dek: await Crypt.importDek(raw), perm: sh.perm, shareId: sh.shareId });
    } catch (e) { console.warn('공유 키를 열 수 없음', sh.username); }
  }
}

/** 누구의 기록을 볼지 바꾼다 (null = 본인) */
async function selectPerson(ownerId, silent) {
  const p = S.people.find(function (x) { return x.ownerId === ownerId; }) || S.people[0];
  S.ownerId = p.ownerId; S.dek = p.dek; S.perm = p.perm; S.viewName = p.username;
  S.filter = '전체'; S.search = '';
  if (!silent) loading(nim(p.username) + '의 기록을 불러오는 중…');
  await loadAll();
  if (!silent) { done(); viewHome(); }
}

/* ---------------- 데이터 불러오기 ---------------- */

async function loadAll() {
  const rows = await dcall('api_listRecords', S.token);
  const records = [];
  for (const r of rows) {
    try {
      records.push({ recordId: r.recordId, createdAt: r.createdAt, updatedAt: r.updatedAt, imageIds: r.imageIds, data: await Crypt.decryptJson(S.dek, r.encData) || {} });
    } catch (e) { console.warn('복호화 실패', r.recordId); }
  }
  S.records = records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });

  const prof = await dcall('api_getDoctorProfile', S.token);
  S.presets = prof.presets || [];
  let doctor = null;
  if (prof.encData) { try { doctor = await Crypt.decryptJson(S.dek, prof.encData); } catch (e) { doctor = null; } }
  S.doctor = Object.assign({}, DEFAULT_DOCTOR, doctor || {}, { _saved: !!doctor });

  // 본인 화면: 보호자가 보내준 설명 모아두기
  S.familyNotes = [];
  if (!viewingOther()) {
    try { S.familyNotes = (await loadChats('*')).filter(function (m) { return !m.fromOwner; }); } catch (e) { /* 없어도 됨 */ }
  }
}

/* ---------------- 홈 (기록 목록) ---------------- */

function viewHome() {
  const q = S.search.toLowerCase();
  const types = RECORD_TYPES.filter(function (t) { return S.records.some(function (r) { return r.data.record_type === t; }); });
  if (S.filter !== '전체' && types.indexOf(S.filter) === -1) S.filter = '전체';
  const list = S.records.filter(function (r) {
    if (S.filter !== '전체' && r.data.record_type !== S.filter) return false;
    if (!q) return true;
    return JSON.stringify([r.data.title, r.data.hospital, r.data.department, r.data.diagnoses, r.data.summary, r.data.memo]).toLowerCase().indexOf(q) >= 0;
  });

  // 인사 카드: 호칭(의사 선생님 설정의 "저를 이렇게 불러주세요")이 있으면 그걸로 부른다
  const call = (S.doctor && S.doctor.patientCall) || nim(S.viewName);
  const latest = S.records[0];
  const latestAlerts = latest ? (latest.data.tests || []).filter(isAbnormal).length : 0;
  const heroTitle = viewingOther() ? esc(nim(S.viewName)) + '의 건강 기록' : '안녕하세요,<br>' + esc(call) + ' 😊';
  const heroSub = latest
    ? '최근 기록 · ' + esc(fmtDate(latest.data.date)) + ' ' + esc(latest.data.title || '') + (latestAlerts ? ' · 확인할 항목 ' + latestAlerts + '개' : '')
    : (canWrite() ? '결과지를 올리면 AI 선생님이 쉽게 설명해 드려요.' : '아직 등록된 기록이 없어요.');
  const actions = [];
  if (canWrite()) actions.push('<button id="add"><span class="ico">📷</span>결과지 올리기</button>');

async function addFiles() {
  const files = Array.prototype.slice.call(this.files || []);
  if (!files.length) return;
  try {

      S.pendingImages.push(await prepareFile(f));
    }
    done();
    renderAdd();
  } catch (e) { showError(e); }
}

const MAX_FILES = 10;
const MAX_RAW_BYTES = 10 * 1024 * 1024;   // PDF 등 원본 그대로 올리는 파일 1개 최대 10MB
const MAX_ANALYZE_BYTES = 18 * 1024 * 1024; // AI 분석 1번에 보낼 수 있는 총량

function isPdf(file) { return file.type === 'application/pdf' || /\.pdf$/i.test(file.name || ''); }

/**
 * 올릴 파일 준비
 *  - 사진: 1600px JPEG로 줄임
 *  - PDF: 원본 그대로 (AI가 PDF를 직접 읽음)
 *  - 브라우저가 못 여는 HEIC 사진: 원본 그대로
 */
async function prepareFile(file) {
  const takenAt = file.lastModified || Date.now();
  const raw = async function (mimeType) {
    if (file.size > MAX_RAW_BYTES) throw new Error('"' + file.name + '" 파일이 너무 큽니다 (최대 10MB).');
    return { mimeType: mimeType, bytes: new Uint8Array(await file.arrayBuffer()), url: null, name: file.name, takenAt: takenAt };
  };
  if (isPdf(file)) return raw('application/pdf');
  try {
    const img = await resizeImage(file);
    img.takenAt = takenAt;
    return img;
  } catch (e) {
    if (/heic|heif/i.test(file.type + file.name)) return raw(/heif/i.test(file.type + file.name) ? 'image/heif' : 'image/heic');
    throw e;
  }
}

function thumbHtml(item) {
  if (item.url) return '<img src="' + item.url + '" alt="">';
  const label = item.mimeType === 'application/pdf' ? '📄 PDF' : '🖼 사진';
  return '<div class="btn" style="width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75em;overflow:hidden;padding:4px">' +
    '<b>' + label + '</b><span style="word-break:break-all">' + esc(String(item.name || '').slice(0, 24)) + '</span></div>';
}

/** 복호화한 파일의 앞부분으로 종류를 알아낸다 (저장할 때 종류를 따로 적지 않으므로) */
function sniffType(b) {
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'application/pdf';
  if (b[0] === 0x89 && b[1] === 0x50) return 'image/png';
  if (b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70) return 'image/heic';
  return 'image/jpeg';
}

/** 사진을 긴 변 1600px JPEG로 줄인다 (업로드/AI 분석 속도와 용량을 위해) */
function resizeImage(file) {
  const MAX = 1600;
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (blob) {
        if (!blob) return reject(new Error('사진을 처리하지 못했습니다.'));
        blob.arrayBuffer().then(function (buf) {
          resolve({ mimeType: 'image/jpeg', bytes: new Uint8Array(buf), url: URL.createObjectURL(blob) });
        });
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('"' + file.name + '" 파일은 열 수 없습니다. 사진 또는 PDF만 올릴 수 있어요.')); };
    img.src = url;
  });
}

async function analyze() {
  const text = S.addText || '';
  if (!S.pendingImages.length && !text.trim()) return showError(new Error('사진·PDF를 추가하거나 문자 내용을 붙여넣어 주세요.'));
  const total = S.pendingImages.reduce(function (n, i) { return n + i.bytes.length; }, 0);
  if (total > MAX_ANALYZE_BYTES) return showError(new Error('한 번에 분석하기엔 파일이 너무 큽니다. 파일 수를 줄여서 나눠 올려주세요.'));
  try {
    loading('AI가 결과를 읽고 있어요… (사진이 많으면 1분 정도 걸려요)');
    const taken = S.pendingImages.map(function (i) { return i.takenAt || Date.now(); });
    const result = await call('api_extract', S.token, {
      images: S.pendingImages.map(function (i) { return { mimeType: i.mimeType, data: Crypt.b64(i.bytes) }; }),
      text: text,
      hint: S.addHint || '',
      referenceDate: ymd(new Date(taken.length ? Math.max.apply(null, taken) : Date.now()))
    });
    done();
    const records = (result.records || []).map(function (r) {
      r.memo = S.addHint || '';
      r.source = S.pendingImages.length ? 'photo' : 'text';
      if (text && !r.raw_text && result.records.length === 1) r.raw_text = text;
      return r;
    });
    if (!records.length) return showError(new Error('결과를 찾지 못했습니다. 사진을 더 선명하게 찍어주세요.'));
    if (records.length === 1 && !findDuplicate(records[0])) return viewEdit(null, records[0]);
    viewReview(records);
  } catch (e) { showError(e); }
}

function ymd(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ---------------- 여러 건 검토 (문자 캡처 등) ---------------- */

/** 날짜 + 검사값이 같은 기록이 이미 있으면 중복으로 본다 */
function recordFingerprint(d) {
  const tests = (d.tests || []).map(function (t) { return normName(t.name) + '=' + String(t.value).replace(/\s/g, ''); }).sort().join('|');
  const body = tests || String(d.next_visit || d.summary || '').replace(/\s/g, '').slice(0, 60);
  return (d.date || '') + '#' + (d.record_type || '') + '#' + body;
}

function findDuplicate(d) {
  const fp = recordFingerprint(d);
  return S.records.find(function (r) { return recordFingerprint(r.data) === fp; }) || null;
}

function viewReview(records) {
  const seen = {};
  S.review = {
    items: records.map(function (d) {
      const fp = recordFingerprint(d);
      const dup = !!findDuplicate(d) || !!seen[fp];
      seen[fp] = true;
      // 이미 있는 기록과 예약·알림 문자는 기본으로 체크 해제
      return { data: d, dup: dup, checked: !dup && d.record_type !== '문자·알림' };
    })
  };
  renderReview();
}

function renderReview() {
  const items = S.review.items;
  const count = items.filter(function (i) { return i.checked; }).length;
  const reminders = items.filter(function (i) { return i.data.record_type === '문자·알림'; }).length;

    (reminders ? '<br>예약·검진 알림 문자 ' + reminders + '건은 기본으로 빠져 있어요.' : '') + '</p>' +
    '<div class="row"><button class="grow" id="all">모두 선택</button><button class="grow" id="results">결과만 선택</button></div>' +
    items.map(function (it, i) {
      const d = it.data;
      const tests = (d.tests || []).map(function (t) {
        return '<span style="display:inline-block;margin:3px 4px 3px 0">' + flagHtml(t.flag, shortName(t.name) + ' ' + t.value) + '</span>';
      }).join('');
      return '<div class="card" style="' + (it.checked ? '' : 'opacity:.6') + '">' +
        '<div class="row"><input type="checkbox" data-chk="' + i + '"' + (it.checked ? ' checked' : '') + '>' +
        '<span class="tag">' + esc(d.record_type || '기타') + '</span>' +
        '<span class="muted grow">' + esc(fmtDate(d.date)) + (d.date_confidence === '추정' ? ' (추정)' : '') + '</span>' +
        (it.dup ? '<span class="flag 판정없음">이미 있음</span>' : '') + '</div>' +
        '<div data-open="' + i + '" style="cursor:pointer">' +
        '<h3>' + esc(d.title || '(제목 없음)') + '</h3>' +
        (tests ? '<div>' + tests + '</div>' : '') +
        (d.doctor_opinion || d.summary || d.next_visit ? '<p class="muted">' + esc(d.doctor_opinion || d.next_visit || d.summary) + '</p>' : '') +
        '</div></div>';
    }).join('') +
    '<p class="muted">함께 올린 사진·PDF ' + S.pendingImages.length + '개는 저장하는 기록들에 원본으로 같이 붙습니다.</p>' +
    '<button class="primary fab" id="saveAll"' + (count ? '' : ' disabled') + '>선택한 ' + count + '건 저장</button>'
  );
  bindBack(function () {
    confirmBox('저장하지 않고 나갈까요?', '나가기').then(function (ok) { if (ok) { S.review = null; renderAdd(); } });
  });
  on('[data-chk]', 'change', function () { items[Number(this.getAttribute('data-chk'))].checked = this.checked; renderReview(); });
  on('[data-open]', 'click', function () {
    const i = Number(this.getAttribute('data-open'));
    viewEdit(null, items[i].data, i);
  });
  on('#all', 'click', function () { items.forEach(function (i) { i.checked = !i.dup; }); renderReview(); });
  on('#results', 'click', function () { items.forEach(function (i) { i.checked = !i.dup && i.data.record_type !== '문자·알림'; }); renderReview(); });
  on('#saveAll', 'click', saveReviewed);
}

function shortName(name) { return String(name || '').replace(/\(.*?\)/g, '').trim(); }

async function saveReviewed() {
  const chosen = S.review.items.filter(function (i) { return i.checked; }).map(function (i) { return cleanRecord(i.data); });
  if (!chosen.length) return;
  const uploaded = [];
  try {
    loading('사진을 암호화해서 올리는 중…');
    for (const img of S.pendingImages) {
      const res = await dcall('api_uploadImage', S.token, await Crypt.encryptBlobB64(S.dek, img.bytes));
      uploaded.push(res.imageId);
    }
    loading(chosen.length + '건을 암호화해서 저장하는 중…');
    const items = [];
    for (const d of chosen) items.push({ encData: await Crypt.encryptJson(S.dek, d), imageIds: uploaded });
    const res = await dcall('api_saveRecords', S.token, items);
    const now = new Date().toISOString();
    res.recordIds.forEach(function (id, i) {
      S.records.push({ recordId: id, createdAt: now, updatedAt: now, imageIds: uploaded.slice(), data: chosen[i] });
    });
    S.records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });
    S.review = null; S.pendingImages = []; S.addText = ''; S.addHint = '';
    done();
    toast(chosen.length + '건을 저장했습니다.');
    viewHome();
  } catch (e) {
    if (uploaded.length) dcall('api_discardImages', S.token, uploaded).catch(function () {});
    showError(e);
  }
}

function cleanRecord(d) {
  d.tests = (d.tests || []).filter(function (t) { return t.name || t.value; });
  d.medications = (d.medications || []).filter(function (m) { return m.name; });
  if (!d.title) d.title = (d.record_type || '기록') + ' ' + (d.date || '');
  return d;
}

function today() { return ymd(new Date()); }

/* ---------------- 기록 확인/수정 ---------------- */

/** reviewIndex 가 있으면 "여러 건 검토" 화면의 한 건을 고치는 모드 (저장은 검토 화면에서 한꺼번에) */
function viewEdit(recordId, data, reviewIndex) {
  const d = JSON.parse(JSON.stringify(data || {}));
  d.tests = d.tests || []; d.medications = d.medications || [];
  d.diagnoses = d.diagnoses || []; d.follow_up = d.follow_up || [];
  S.draft = { recordId: recordId, data: d, reviewIndex: reviewIndex === undefined ? null : reviewIndex };
  if (recordId) {
    const rec = S.records.find(function (r) { return r.recordId === recordId; });
    S.keptImageIds = rec ? rec.imageIds.slice() : [];
    S.pendingImages = [];
  } else {
    S.keptImageIds = [];
  }
  renderEdit();
}

function input(path, value, placeholder, type) {
  return '<input data-bind="' + path + '" value="' + esc(value) + '" placeholder="' + esc(placeholder || '') + '"' + (type ? ' type="' + type + '"' : '') + '>';
}
function selectBox(path, value, options) {
  return '<select data-bind="' + path + '">' + options.map(function (o) {

/** data-bind 입력칸 → S.draft.data 자동 반영 */
$app.addEventListener('input', function (e) {
  const path = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (!path || !S.draft) return;
  const keys = path.split('.');
  let obj = S.draft.data;
  for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
  obj[keys[keys.length - 1]] = e.target.getAttribute('data-lines')
    ? e.target.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
    : e.target.value;
});

async function saveDraft() {
  const d = cleanRecord(S.draft.data);
  if (S.draft.reviewIndex !== null) {
    const item = S.review.items[S.draft.reviewIndex];
    item.data = d; item.checked = true; S.draft = null;
    return renderReview();
  }
  const uploaded = [];
  try {
    loading('암호화해서 저장하는 중…');
    for (const img of S.pendingImages) {
      const res = await dcall('api_uploadImage', S.token, await Crypt.encryptBlobB64(S.dek, img.bytes));
      uploaded.push(res.imageId);
    }
    const imageIds = S.keptImageIds.concat(uploaded);
    const res = await dcall('api_saveRecord', S.token, {
      recordId: S.draft.recordId || null,
      encData: await Crypt.encryptJson(S.dek, d),
      imageIds: imageIds
    });
    const now = new Date().toISOString();
    const existing = S.records.find(function (r) { return r.recordId === res.recordId; });
    if (existing) { existing.data = d; existing.imageIds = imageIds; existing.updatedAt = now; }
    else S.records.push({ recordId: res.recordId, createdAt: now, updatedAt: now, imageIds: imageIds, data: d });
    S.records.sort(function (a, b) { return sortKey(b).localeCompare(sortKey(a)); });
    S.pendingImages = []; S.keptImageIds = []; S.draft = null; S.addText = ''; S.addHint = '';
    done();
    toast('저장했습니다.');
    viewDetail(res.recordId);
  } catch (e) {
    if (uploaded.length) dcall('api_discardImages', S.token, uploaded).catch(function () {});
    showError(e);
  }
}

function normName(s) { return String(s || '').replace(/\s|\(.*?\)/g, '').toLowerCase(); }

function viewTrend(testName, fromRecordId) {
  const key = normName(testName);
  const points = [];
  S.records.forEach(function (r) {
    (r.data.tests || []).forEach(function (t) {
      if (normName(t.name) === key) points.push({ date: r.data.date || r.createdAt.slice(0, 10), t: t, recordId: r.recordId });
    });
  });
  points.sort(function (a, b) { return a.date.localeCompare(b.date); });
  const nums = points.map(function (p) { const v = String(p.t.value).replace(/,/g, '').trim(); return /^-?\d+(\.\d+)?$/.test(v) ? parseFloat(v) : NaN; });
  const numeric = points.length >= 2 && nums.every(function (n) { return !isNaN(n); });

  const last = points[points.length - 1];
  const prevNum = nums.length >= 2 ? nums[nums.length - 2] : NaN, lastNum = nums[nums.length - 1];
  const diff = !isNaN(prevNum) && !isNaN(lastNum) ? Math.round((lastNum - prevNum) * 100) / 100 : null;
  render(
    header(testName, true) +
    '<div class="card"><div class="muted">가장 최근 · ' + esc(fmtDate(last.date)) + '</div>' +
    '<div class="row" style="align-items:baseline"><span style="font-size:2.2em;font-weight:800;line-height:1.2">' + esc(last.t.value) + '</span>' +
    '<span class="muted">' + esc(last.t.unit) + '</span><span class="grow"></span>' + flagHtml(last.t.flag) + '</div>' +
    (diff !== null ? '<div class="muted">지난번(' + esc(fmtDate(points[points.length - 2].date)) + ')보다 <b style="color:var(--ink)">' +
      (diff > 0 ? '▲ ' + diff + ' 올랐어요' : diff < 0 ? '▼ ' + Math.abs(diff) + ' 내렸어요' : '변화 없어요') + '</b></div>' : '') +
    (last.t.reference_range ? '<div class="muted">참고치 ' + esc(last.t.reference_range) + '</div>' : '') + '</div>' +
    (numeric ? '<div class="card"><h3>' + points.length + '번의 변화</h3>' + sparkline(points, nums) +
      '<p class="muted" style="margin-top:4px">점을 누르면 그날 수치가 나와요.</p></div>' : '') +
    '<div class="card"><h3>날짜별 기록</h3><ul class="tests">' +
    points.slice().reverse().map(function (p) {
      return '<li style="cursor:default"><div class="nm">' + esc(fmtDate(p.date)) + '</div>' +
        '<div class="val">' + esc(p.t.value) + '<small>' + esc(p.t.unit) + '</small></div>' + flagHtml(p.t.flag) + '</li>';
    }).join('') + '</ul>' +
    (points.length < 2 ? '<p class="muted">같은 항목의 기록이 더 쌓이면 변화를 비교할 수 있어요.</p>' : '') + '</div>'
  );
  bindBack(function () { viewDetail(fromRecordId); });
  on('[data-pt]', 'click', function () {
    const p = points[Number(this.getAttribute('data-pt'))];
    toast(fmtDate(p.date) + ' · ' + p.t.value + ' ' + (p.t.unit || '') + ' (' + (p.t.flag || '판정없음') + ')');
  });
}

/**
 * 수치 변화 그래프 (한 가지 항목)
 *  - 선 1개, 점은 크게, 숫자는 처음·최근·최고·최저에만 표시 (모든 점에 숫자를 달면 복잡해짐)
 *  - 정상 범위를 벗어난 점은 빨간 점 + 아래 표에 기호·글자로 함께 표시
 *  - 점을 누르면 그날 수치를 알려준다 (손가락으로 누르기 쉽게 투명한 큰 원)
 */
function sparkline(points, nums) {
  const W = 340, H = 200, L = 16, R = 34, T = 34, B = 36;
  const min = Math.min.apply(null, nums), max = Math.max.apply(null, nums);
  const span = max - min || 1;
  const n = points.length;
  const x = function (i) { return L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)); };
  const y = function (v) { return T + (H - T - B) * (1 - (v - min) / span); };
  const iMax = nums.indexOf(max), iMin = nums.indexOf(min);
  const labeled = {}; [0, n - 1, iMax, iMin].forEach(function (i) { labeled[i] = true; });
  const dateStep = Math.max(1, Math.ceil(n / 4));
  const line = nums.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
  const area = x(0).toFixed(1) + ',' + (H - B) + ' ' + line + ' ' + x(n - 1).toFixed(1) + ',' + (H - B);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="수치 변화 그래프. 아래 표에 모든 값이 있습니다.">' +
    '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E6B64" stop-opacity=".16"/><stop offset="1" stop-color="#0E6B64" stop-opacity="0"/></linearGradient></defs>' +
    '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R + 10) + '" y2="' + (H - B) + '" stroke="#E4DED3" stroke-width="1"/>' +
    '<polygon points="' + area + '" fill="url(#sg)"/>' +
    '<polyline fill="none" stroke="#0E6B64" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + line + '"/>';
  nums.forEach(function (v, i) {
    const bad = isAbnormal(points[i].t);
    const isLast = i === n - 1;
    const dot = !bad ? '#0E6B64' : (points[i].t.flag === '경계' ? '#B26A00' : '#C0392B'); // 표의 기호·글자와 같은 색
    svg += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (isLast ? 7 : 5) + '" fill="' + dot + '" stroke="#fff" stroke-width="2"/>';
    if (labeled[i]) {
      const above = y(v) - 12 > 14;
      svg += '<text x="' + Math.min(Math.max(x(i), 16), W - 16) + '" y="' + (above ? y(v) - 12 : y(v) + 24) + '" font-size="' + (isLast ? 17 : 14) + '" font-weight="' + (isLast ? 800 : 600) +
        '" text-anchor="middle" fill="#1B1F24">' + esc(points[i].t.value) + '</text>';
    }
    if (i % dateStep === 0 || isLast) {
      if (!isLast && n - 1 - i < dateStep / 2) return;
      svg += '<text x="' + Math.min(Math.max(x(i), 22), W - 22) + '" y="' + (H - 12) + '" font-size="13" text-anchor="middle" fill="#454C58">' +
        esc("'" + points[i].date.slice(2, 7).replace('-', '.')) + '</text>';
    }
    svg += '<circle data-pt="' + i + '" cx="' + x(i) + '" cy="' + y(v) + '" r="18" fill="transparent" style="cursor:pointer"><title>' +
      esc(fmtDate(points[i].date) + ' ' + points[i].t.value + ' ' + (points[i].t.unit || '')) + '</title></circle>';
  });
  return svg + '</svg>';
}

/** 상담 내역을 불러와 복호화 (recordId: 기록 ID / 'ALL' / '*') */
async function loadChats(recordId) {
  const rows = await dcall('api_listChats', S.token, recordId);
  rows.sort(function (a, b) { return a.createdAt.localeCompare(b.createdAt); });
  const out = [];
  for (const row of rows) {
    try {
      const m = await Crypt.decryptJson(S.dek, row.encData);
      out.push(Object.assign(m, {
        id: row.messageId, recordId: row.recordId, createdAt: row.createdAt, mine: row.mine,
        fromOwner: row.fromOwner, authorName: row.authorName, shared: row.shared
      }));
    } catch (e) { /* 건너뜀 */ }
  }
  return out;
}

async function viewChat(recordId, startTab) {
  const isAll = recordId === 'ALL';
  const rec = isAll ? null : S.records.find(function (r) { return r.recordId === recordId; });
  const guardian = viewingOther();
  let all;
  try { loading('대화를 불러오는 중…'); all = await loadChats(recordId); done(); } catch (e) { showError(e); return; }

  // 보호자: 'team'(보호자 팀 상담) / 'owner'(기록 주인 본인 상담, 읽기 전용)
  let tab = startTab || 'team';
  const doctorLabel = (S.doctor.doctorName || '의사') + ' 선생님';
  const ownerName = nim(S.viewName);

  /** AI에게 이어서 물을 때 쓰는 대화 흐름: 보호자는 팀 상담, 본인은 본인 상담만 */
  function myThread() { return all.filter(function (m) { return guardian ? !m.fromOwner : m.fromOwner; }); }
  function shown() {
    if (!guardian) return all;                       // 본인 상담 + 가족이 보내준 설명
    return all.filter(function (m) { return tab === 'owner' ? m.fromOwner : !m.fromOwner; });
  }

  function bubble(m, i, list) {
    let label = '';
    if (!guardian && !m.fromOwner) label = '👪 ' + nim(m.authorName) + (m.role === 'user' ? '이 물어본 것' : '이 보내준 답변');
    else if (guardian && tab === 'team' && m.role === 'user' && !m.mine) label = nim(m.authorName) + '의 질문';
    const cls = (!guardian && !m.fromOwner) ? 'family' : (m.role === 'user' ? 'user' : 'model');
    let actions = '';
    if (guardian && tab === 'team' && m.role === 'model') {
      actions = m.shared
        ? '<div class="msg-act">✓ ' + esc(ownerName) + '께 보냄 <button class="link" data-unshare="' + i + '">취소</button></div>'
        : '<div class="msg-act"><button class="link" data-share="' + i + '">📤 ' + esc(ownerName) + '께 보내기</button></div>';
    }
    return (label ? '<div class="msg-label ' + (cls === 'user' ? 'right' : '') + '">' + esc(label) + '</div>' : '') +
      '<div class="msg ' + cls + '">' + esc(m.text) + '</div>' + actions;
  }

  function draw() {
    const list = shown();
    const canAsk = !guardian || tab === 'team';
    const clearable = myThread().length > 0 && canAsk;
    render(
      header(isAll ? '전체 기록 상담' : (rec.data.title || '상담'), true, clearable ? '<button class="icon" id="clear">🗑</button>' : '') +
      (guardian ? '<div class="chips">' +
        '<button class="chip' + (tab === 'team' ? ' on' : '') + '" data-tab="team">👪 보호자 상담</button>' +
        '<button class="chip' + (tab === 'owner' ? ' on' : '') + '" data-tab="owner">👤 ' + esc(ownerName) + ' 상담 (' + all.filter(function (m) { return m.fromOwner; }).length + ')</button>' +
        '</div>' : '') +
      (guardian && tab === 'team' ? '<p class="muted">보호자끼리 함께 보는 상담이에요. 답변 아래 <b>📤 보내기</b>를 누르면 ' + esc(ownerName) + '께도 보여요.</p>' : '') +
      (guardian && tab === 'owner' ? '<p class="muted">' + esc(ownerName) + '이 직접 나눈 상담이에요 (읽기만 가능).</p>' : '') +
      '<p class="notice">AI 설명은 참고용입니다. 진단·처방은 반드시 담당 의사와 상의하세요. 응급 상황은 119.</p>' +
      '<div class="chat">' +
      (list.length ? '' : (canAsk
        ? '<div class="msg model">안녕하세요, ' + esc(doctorLabel) + '입니다. ' +
          (isAll ? '등록된 기록 전체를 보고 답해 드릴게요.' : '이 결과에 대해 궁금한 점을 물어보세요.') + '</div>' +
          '<div class="chips" style="flex-wrap:wrap">' + (isAll ? SUGGEST_ALL : SUGGEST_ONE).map(function (q) {
            return '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>';
          }).join('') + '</div>'
        : '<p class="muted">아직 상담 내역이 없어요.</p>')) +
      list.map(function (m, i) { return bubble(m, i, list); }).join('') +
      '</div>' +
      (canAsk ? '<div class="composer"><div class="inner"><textarea id="q" placeholder="궁금한 점을 적어주세요"></textarea>' +
        '<button class="primary" id="send">보내기</button></div></div>' : '')
    );
    bindBack(function () { if (isAll) viewHome(); else viewDetail(recordId); });
    on('#send', 'click', function () { send(val('#q')); });
    on('.chip[data-q]', 'click', function () { send(this.getAttribute('data-q')); });
    on('.chip[data-tab]', 'click', function () { tab = this.getAttribute('data-tab'); draw(); });
    on('[data-share]', 'click', function () { share(list, Number(this.getAttribute('data-share')), true); });
    on('[data-unshare]', 'click', function () { share(list, Number(this.getAttribute('data-unshare')), false); });
    on('#clear', 'click', async function () {
      const what = guardian ? '보호자 상담 내역을' : '내 상담 내역을';
      if (!(await confirmBox('이 기록의 ' + what + ' 모두 지울까요?', '지우기'))) return;
      try {
        loading(); await dcall('api_clearChats', S.token, recordId);
        all = all.filter(function (m) { return guardian ? m.fromOwner : !m.fromOwner; });
        done(); draw();
      } catch (e) { showError(e); }
    });
    window.scrollTo(0, document.body.scrollHeight);
  }

  /** 답변과 그 바로 앞 질문을 함께 보내기/취소 */
  async function share(list, i, flag) {
    const pair = [list[i]];
    if (i > 0 && list[i - 1].role === 'user') pair.unshift(list[i - 1]);
    if (flag && !(await confirmBox('이 질문과 답변을 ' + ownerName + '께 보낼까요? ' + ownerName + ' 화면에 "가족이 보내준 설명"으로 보여요.', '보내기'))) return;
    try {
      loading();
      await dcall('api_shareChats', S.token, pair.map(function (m) { return m.id; }), flag);
      pair.forEach(function (m) { m.shared = flag; });
      done(); toast(flag ? ownerName + '께 보냈습니다.' : '보내기를 취소했습니다.'); draw();
    } catch (e) { showError(e); }
  }

  async function send(question) {
    if (!question) return;
    const records = isAll
      ? S.records.map(function (r) { const c = Object.assign({}, r.data); delete c.raw_text; return c; })
      : [rec.data];
    try {
      loading(doctorLabel + '이 답변을 준비하고 있어요…');
      const res = await call('api_ask', S.token, {
        question: question,
        history: myThread().slice(-12).map(function (m) { return { role: m.role, text: m.text }; }),
        records: records,
        doctor: stripDoctor(S.doctor),
        asGuardian: guardian
      });
      const now = new Date().toISOString();
      const userMsg = { role: 'user', text: question };
      const modelMsg = { role: 'model', text: res.answer };
      const u = await dcall('api_saveChat', S.token, recordId, await Crypt.encryptJson(S.dek, userMsg));
      const a = await dcall('api_saveChat', S.token, recordId, await Crypt.encryptJson(S.dek, modelMsg));
      const base = { mine: true, fromOwner: !guardian, authorName: S.me.username, shared: false, createdAt: now, recordId: recordId };
      all.push(Object.assign({ id: u.messageId }, base, userMsg), Object.assign({ id: a.messageId }, base, modelMsg));
      done();
      draw();
    } catch (e) { showError(e); }
  }

  draw();
}

/* ---------------- 가족이 보내준 설명 (기록 주인 화면) ---------------- */

function notesSeenKey() { return 'notesSeen_' + (S.me && S.me.userId); }

function viewFamilyNotes() {
  const notes = S.familyNotes || [];
  storageSet(notesSeenKey(), new Date().toISOString());
  const titleOf = function (id) {
    if (id === 'ALL') return '전체 기록 상담';
    const r = S.records.find(function (x) { return x.recordId === id; });
    return r ? (r.data.title || '기록') + ' · ' + fmtDate(r.data.date) : '삭제된 기록';
  };
  const groups = [];
  notes.forEach(function (m) {
    let g = groups.find(function (x) { return x.recordId === m.recordId; });
    if (!g) { g = { recordId: m.recordId, items: [] }; groups.push(g); }
    g.items.push(m);
  });
  groups.reverse();
  render(
    header('👪 가족이 보내준 설명', true) +
    (groups.length ? groups.map(function (g) {
      return '<div class="card click" data-rec="' + esc(g.recordId) + '"><h3>' + esc(titleOf(g.recordId)) + '</h3>' +
        g.items.map(function (m) {
          return '<div class="msg-label">' + esc(m.role === 'user' ? nim(m.authorName) + '의 질문' : '답변') + '</div>' +
            '<div class="msg ' + (m.role === 'user' ? 'family' : 'model') + '" style="max-width:100%">' + esc(m.text) + '</div>';
        }).join('') + '</div>';
    }).join('') : '<div class="card"><p>아직 가족이 보내준 설명이 없어요.</p></div>')
  );
  bindBack(viewHome);
  on('.card[data-rec]', 'click', function () {
    const id = this.getAttribute('data-rec');
    if (id === 'ALL' || S.records.some(function (r) { return r.recordId === id; })) viewChat(id);
  });
}

function stripDoctor(d) { const c = Object.assign({}, d); delete c._saved; return c; }

/* ---------------- 보호자(가족) 관리 ---------------- */

const PERM_LABEL = { read: '보기만', write: '보기 + 대신 등록·수정' };

async function viewGuardians() {
  loading();
  const mine = await call('api_listGuardians', S.token);
  done();
  const others = S.people.filter(function (p) { return p.ownerId; });
  render(
    header('보호자(가족) 관리', true) +
    '<div class="card"><h3>내 기록을 볼 수 있는 가족</h3>' +
    '<p class="muted">여기 추가한 사람만 내 기록과 상담 내역을 볼 수 있어요. 추가하지 않은 가족은 볼 수 없습니다.</p>' +
    (mine.length ? '<table>' + mine.map(function (g) {
      return '<tr><td><b>' + esc(g.username) + '</b><div class="muted">' + esc(PERM_LABEL[g.perm] || g.perm) + '</div></td>' +
        '<td style="text-align:right"><button class="danger" data-rm="' + esc(g.shareId) + '" data-name="' + esc(g.username) + '">해제</button></td></tr>';
    }).join('') + '</table>' : '<p>아직 없어요.</p>') +
    '<hr><label for="gname">추가할 가족의 아이디</label><input id="gname" autocapitalize="none" placeholder="예) 사위 또는 딸이 쓰는 아이디">' +
    '<label>권한</label>' + radioGroup('perm', 'read', [['read', PERM_LABEL.read], ['write', PERM_LABEL.write]]) +
    '<p style="margin-top:12px"><button class="primary block" id="addG">보호자로 추가</button></p>' +
    '<p class="muted">추가할 가족이 먼저 가입해서 한 번 로그인해 있어야 해요.</p></div>' +

    '<div class="card"><h3>내가 챙겨보는 가족</h3>' +
    (others.length ? '<table>' + others.map(function (p) {
      return '<tr><td><b>' + esc(p.username) + '</b><div class="muted">' + esc(PERM_LABEL[p.perm] || p.perm) + '</div></td>' +
        '<td style="text-align:right"><button data-leave="' + esc(p.shareId) + '" data-name="' + esc(p.username) + '">그만 보기</button></td></tr>';
    }).join('') + '</table>' : '<p class="muted">나를 보호자로 추가한 가족이 없어요.</p>') + '</div>'
  );
  bindBack(viewSettings);

  on('#addG', 'click', async function () {
    const name = val('#gname');
    const perm = ($('input[name="perm"]:checked') || {}).value || 'read';
    if (!name) return showError(new Error('가족의 아이디를 입력해 주세요.'));
    try {
      loading('확인 중…');
      const u = await call('api_findUser', S.token, name);
      done();
      const ok = await confirmBox(nim(u.username) + '이 내 진료기록 전체를 볼 수 있게 됩니다' +
        (perm === 'write' ? ' (대신 등록·수정도 가능)' : '') + '. 내가 AI 선생님과 나눈 상담 내역도 볼 수 있어요. 추가할까요?', '추가');
      if (!ok) return;
      loading('추가하는 중…');
      const encDek = await Crypt.encryptForPublicKey(u.publicKey, S.me.dekRaw);
      await call('api_addGuardian', S.token, u.userId, encDek, perm);
      toast(nim(u.username) + '을 보호자로 추가했습니다.');
      await viewGuardians();
    } catch (e) { showError(e); }
  });
  on('[data-rm]', 'click', async function () {
    const id = this.getAttribute('data-rm'), name = this.getAttribute('data-name');
    if (!(await confirmBox(nim(name) + '이 더 이상 내 기록을 볼 수 없게 할까요?', '해제'))) return;
    try { loading(); await call('api_removeShare', S.token, id); toast('해제했습니다.'); await viewGuardians(); } catch (e) { showError(e); }
  });
  on('[data-leave]', 'click', async function () {
    const id = this.getAttribute('data-leave'), name = this.getAttribute('data-name');
    if (!(await confirmBox(nim(name) + '의 기록을 더 이상 보지 않을까요? (다시 보려면 ' + nim(name) + '이 다시 추가해야 해요)', '그만 보기'))) return;
    try {
      loading();
      await call('api_removeShare', S.token, id);
      S.people = S.people.filter(function (p) { return p.shareId !== id; });
      if (S.ownerId && !S.people.some(function (p) { return p.ownerId === S.ownerId; })) await selectPerson(null, true);
      toast('해제했습니다.');
      await viewGuardians();
    } catch (e) { showError(e); }
  });
}

function radioGroup(name, value, options) {
  return options.map(function (o) {
    return '<label class="check" style="font-weight:normal;margin:8px 0"><input type="radio" name="' + name + '" value="' + o[0] + '"' +
      (value === o[0] ? ' checked' : '') + '>' + esc(o[1]) + '</label>';
  }).join('');
}

    '<div class="card"><h3>3. 추가 지시사항 (직접 작성)</h3>' +
    '<p class="muted">선생님께 바라는 점을 자유롭게 적어주세요. 이 내용이 AI 프롬프트에 그대로 들어갑니다.</p>' +
    '<textarea id="customPrompt" style="min-height:160px" placeholder="예) 설명 끝에 항상 한 줄로 요약해 주세요. 수치가 나쁘면 겁주지 말고 차분하게 알려주세요.">' + esc(d.customPrompt) + '</textarea>' +
    '<button class="block" id="preview" style="margin-top:10px">👀 최종 프롬프트 미리보기</button>' +
    '<pre id="pv" style="display:none;white-space:pre-wrap;font-size:.8em;background:#f0f3f8;padding:10px;border-radius:10px"></pre>' +
    '</div>' +
    '<button class="primary block" id="save">저장</button>' +
    (firstTime ? '<p style="margin-top:10px"><button class="block" id="skip">나중에 할게요</button></p>' : '')
  );

  function collect() {
    const pick = function (name) { const el = $('input[name="' + name + '"]:checked'); return el ? el.value : ''; };
    return {
      presetId: $('#presetId') ? $('#presetId').value : '',
      doctorName: val('#doctorName'), specialty: val('#specialty'),
      tone: pick('tone') || 'friendly', level: pick('level') || 'easy', length: pick('length') || 'medium',
      lifestyleTips: $('#lifestyleTips').checked,
      patientCall: val('#patientCall'), ageGroup: val('#ageGroup'), sex: $('#sex').value,
      conditions: val('#conditions'), medications: val('#medications'), allergies: val('#allergies'), concerns: val('#concerns'),
      customPrompt: $('#customPrompt').value.trim()
    };
  }

  bindBack(viewSettings);
  on('#skip', 'click', viewHome);
  on('#preview', 'click', async function () {
    try {
      loading();
      const res = await call('api_previewDoctorPrompt', S.token, collect());
      done();
      const pv = $('#pv'); pv.textContent = res.prompt; pv.style.display = 'block';
    } catch (e) { showError(e); }
  });
  on('#save', 'click', async function () {
    const doctor = collect();
    try {
      loading('저장하는 중…');
      await dcall('api_saveDoctorProfile', S.token, await Crypt.encryptJson(S.dek, doctor));
      S.doctor = Object.assign({}, doctor, { _saved: true });
      done(); toast('의사 선생님 설정을 저장했습니다.');
      if (firstTime) viewHome(); else viewSettings();
    } catch (e) { showError(e); }
  });
}

function viewChangePassword() {
  render(
    header('비밀번호 변경', true) +
    '<div class="card">' +
    '<label for="old">현재 비밀번호</label><input id="old" type="password" autocomplete="current-password">' +
    '<label for="p">새 비밀번호 (' + MIN_PW + '자 이상)</label><input id="p" type="password" autocomplete="new-password">' +
    '<label for="p2">새 비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password">' +
    '<p style="margin-top:16px"><button class="primary block" id="go">변경</button></p>' +
    '<p class="muted">복구코드는 그대로 유지됩니다.</p></div>'
  );
  bindBack(viewSettings);
  on('#go', 'click', async function () {
    const old = $('#old').value, pw = $('#p').value, pw2 = $('#p2').value;
    if (pw.length < MIN_PW) return showError(new Error('비밀번호는 ' + MIN_PW + '자 이상으로 해주세요.'));
    if (pw !== pw2) return showError(new Error('비밀번호 확인이 일치하지 않습니다.'));
    try {
      loading('변경하는 중…');
      const pre = await call('api_prelogin', S.username);
      const oldD = await Crypt.derive(old, pre.kdfSalt, pre.kdfIter);
      const login = await call('api_login', S.username, oldD.authKey); // 현재 비밀번호 확인 + 감싼 키 받기
      S.token = login.token;
      const dekRaw = await Crypt.unwrapDek(oldD.kek, login.wrappedDek);
      const kdfSalt = Crypt.newSalt();
      const newD = await Crypt.derive(pw, kdfSalt, pre.kdfIter);
      await call('api_changePassword', S.token, {
        oldAuthKey: oldD.authKey, kdfSalt: kdfSalt, kdfIter: pre.kdfIter,
        authKey: newD.authKey, wrappedDek: await Crypt.wrapDek(newD.kek, dekRaw)
      });
      done(); toast('비밀번호를 변경했습니다.'); viewSettings();
    } catch (e) { showError(e); }
  });
}

/* ---------------- 시작 ---------------- */
applyFontSize();
viewLogin();
</script>
